<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shot Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--g:#0f5132;--g2:#198754;--ink:#111;--mut:#555;--line:#d6d6d6;--red:#c62828}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#e9ece9;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#mapWrap{position:fixed;top:0;left:0;right:0;bottom:200px;overflow:hidden;background:#cfd8cf}
#map{position:absolute;top:0;left:0;width:100%;height:100%;background:#cfd8cf;transform-origin:50% 50%}
/* keep pins, flags and labels upright when the map is turned */
.pin,.flag,.gflag,.aimx,.aimo,.ptdot,.urot{transform:rotate(var(--unrot,0deg))}
#rotBtn{font-size:15px;font-weight:900;letter-spacing:.5px}
#rotBtn.on{background:var(--g2);color:#fff}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;gap:8px;z-index:1000;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
#holeNav{display:flex;align-items:center;background:#fff;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
#holeNav .ib{box-shadow:none;background:none;font-size:28px}
#holeLabel{border:0;background:none;font-weight:800;font-size:18px;min-width:80px;height:44px}
.pill{margin-left:auto;padding:9px 12px;border-radius:999px;font-weight:800;font-size:14px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);white-space:nowrap}
.pill.good{color:#0a7a33}.pill.fair{color:#a86b00}.pill.poor{color:var(--red)}
#fabs{position:fixed;right:10px;bottom:230px;z-index:1000;display:flex;flex-direction:column;gap:8px}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);z-index:1000}
#liveNum{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:-1px}
#liveSub{color:var(--mut);font-size:14px;margin-top:2px}
#lastCard{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.lcHead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.link{border:0;background:none;color:var(--g2);font-weight:800;padding:6px 0 6px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1.5px solid #b9b9b9;background:#fff;font-size:14px;font-weight:700}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.clab{flex:none;align-self:center;font-size:12px;color:var(--mut);width:46px;font-weight:700;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actions .btn{font-size:16px;padding:0 4px;height:50px}
#statusLine{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:38px}
#stMain{font-size:19px;font-weight:800;line-height:1.15}
#stSub{font-size:13px;color:var(--mut);font-weight:600}
#resultCard{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:2500;background:#fff;border-radius:18px;box-shadow:0 -2px 18px rgba(0,0,0,.35);padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);max-height:80vh;overflow:auto}
.rcHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
#rcMain{font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.5px}
#rcTags{margin-top:6px}
#rcAsk{margin-top:8px}
#rcClubs{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;gap:6px}
#rcClubs .chip{padding:11px 13px;font-size:16px;font-weight:800}
.ptdot{width:12px;height:12px;border-radius:50%;background:#1e88e5;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.pill.lock{color:#fff;background:#0a7a33}
.cchip{padding:3px 10px;font-size:15px;border-color:var(--g2);color:var(--g)}
#lcClubs .chip{padding:10px 13px}

.plan{background:#fff3e0;color:#8a4b00;border:2px solid #ff9800}
.plan.on{background:#ff9800;color:#111}
#planBox{margin-top:6px}
.planHead{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;overflow:hidden}
.planHead .pnum{font-size:26px;white-space:nowrap}
.planHead .chip{padding:8px 10px;font-size:15px;flex:none}
#planClubs{margin-top:4px}
#planSub{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pnum{font-size:34px;font-weight:900;line-height:1.05}
.psub{color:var(--mut);font-size:13px}
.planRow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:14px;font-weight:700}
.planRow>span:last-child{white-space:nowrap;flex:none}
.mini{min-width:40px;height:38px;border-radius:10px;border:1.5px solid #bbb;background:#fff;font-weight:800;font-size:16px}
.mini.wide{padding:0 10px;font-size:14px}
.chip.sug{border-color:#ff9800}
.aimx{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:rgba(255,152,0,.35);box-shadow:0 0 0 2px #ff9800,0 1px 4px rgba(0,0,0,.6);position:relative}
.aimx:before,.aimx:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.aimx:before{width:2px;height:22px}.aimx:after{width:22px;height:2px}
.aimo{width:16px;height:16px;border-radius:50%;border:3px solid #ff9800;background:transparent}
input[type=range]{width:100%;margin:8px 0}
.split{font-weight:800;font-size:16px}
.btn{height:58px;border-radius:14px;border:0;font-size:18px;font-weight:800;letter-spacing:.3px;width:100%}
.pri{background:var(--g2);color:#fff}.pri:active{background:var(--g)}
.sec{background:#e8f5ec;color:var(--g);border:2px solid var(--g2)}
.ghost{background:#f1f1f1;color:#222}
.danger{background:#fdecea;color:var(--red);border:2px solid #f3b4ae}
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-end}
#sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#sheet h3{margin:0 0 4px;font-size:20px}
.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.fl{display:block;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:12px 0 4px}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;font-size:18px;padding:10px;border:1.5px solid #bbb;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;text-transform:none;font-weight:600}
#ft{font-size:30px;font-weight:800}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin:14px 0}
.chk input{width:22px;height:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stack{display:grid;gap:10px;margin-top:12px}
.clubs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.clubs button{height:58px;border-radius:12px;border:1.5px solid #c4c4c4;background:#f6f7f6;font-size:17px;font-weight:800}
.clubs button:active{background:var(--g2);color:#fff}
.menu button{display:block;width:100%;text-align:left;padding:15px 12px;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;font-weight:700}
.rlist .ritem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ritem .rt{font-weight:800}.ritem .rs{color:var(--mut);font-size:13px;margin:2px 0 8px}
.ritem .rb{display:flex;gap:8px}
.ritem .rb button{flex:1;padding:9px;border-radius:10px;border:1.5px solid #bbb;background:#fff;font-weight:700;font-size:14px}
.tag{display:inline-block;background:var(--g2);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
.holegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.holegrid .chip{padding:14px 0;font-size:17px;text-align:center}
.tblwrap{overflow-x:auto;margin-top:8px}
table.stats{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.stats th:first-child,table.stats td:first-child{text-align:left}
table.stats th{font-size:12px;color:var(--mut);text-transform:uppercase}
.note{font-size:13px;color:var(--mut);line-height:1.4;margin-top:10px}
.guide{font-size:15px;line-height:1.5}
.guide .hero{background:linear-gradient(135deg,#0f5132,#198754);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px}
.guide .hero h2{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
.guide .hero p{margin:0;font-size:16px;opacity:.95}
.guide h4{margin:20px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--g2)}
.guide .sell{display:grid;gap:10px}
.guide .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.guide .card b{display:block;font-size:16px;margin-bottom:2px}
.guide ol{padding-left:0;list-style:none;counter-reset:st;margin:0}
.guide ol>li{counter-increment:st;position:relative;padding:0 0 12px 40px}
.guide ol>li:before{content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--g2);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.guide ul{margin:4px 0 0;padding-left:18px}
.guide .k{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:800;font-size:13px;background:#eef3ef;border:1px solid #cfdcd2;white-space:nowrap}
.guide .k.hit{background:var(--g2);color:#fff;border-color:var(--g2)}
.guide .k.plan{background:#ff9800;color:#111;border-color:#ff9800}
.guide .honest{background:#fff8e6;border:1px solid #f3d9a4;border-radius:12px;padding:12px 14px}
.seg{display:flex;border:1.5px solid var(--g2);border-radius:10px;overflow:hidden;margin-top:6px}
.seg button{flex:1;padding:10px;border:0;background:#fff;font-weight:800;color:var(--g)}
.seg button.on{background:var(--g2);color:#fff}
#capOverlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.capBox{background:#fff;border-radius:18px;padding:22px;text-align:center;width:min(320px,100%)}
.capBox .big{font-size:52px;font-weight:900}
.capBox .stack{margin-top:14px}
.pill.stale{color:#777}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(env(safe-area-inset-top) + 64px);z-index:4000;background:#111;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:center}
.pin{width:28px;height:28px;border-radius:50%;background:#ff9800;border:3px solid #fff;color:#111;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pin.ex{background:#9e9e9e}
.flag{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #d32f2f;color:#d32f2f;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.slog .sl{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px;background:#fff;align-items:flex-start}
.slog .sl.aimed{border-color:#f0c48a}
.slog .slh{flex:none;min-width:46px;height:34px;border-radius:9px;background:#f2f5f2;color:var(--g2);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.slog .slb{flex:1;min-width:0}
.slog .sl1{display:block;font-size:16px;font-weight:800;line-height:1.25}
.slog .sl1 .yd{font-size:19px}
.slog .sl1 .open{color:var(--mut);font-weight:700}
.slog .sl2{display:block;font-size:12.5px;color:#a3712a;font-weight:700;margin-top:3px;line-height:1.3}
.slog .sl2.out{color:#b0561f}
.slog .sl3{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:3px;line-height:1.3}
.slog .hd{font-weight:900;font-size:14px;margin:12px 0 6px;color:var(--g2)}
.slog .hd span{color:var(--mut);font-weight:700}
.slogSum{font-size:13px;color:var(--mut);font-weight:600;margin:-2px 0 8px}
.stp{display:flex;align-items:center;gap:8px;padding:5px 0}
.stp .lbl{flex:1;font-size:14px;font-weight:700}
.stp button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:#fff;font-size:19px;font-weight:900;line-height:1}
.stp b{min-width:26px;text-align:center;font-size:17px;font-weight:900}
.stp.on .lbl{color:var(--g2)}
.putt{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:#fafbfa}
.putt .ph{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.putt .ph b{font-size:14px;flex:none}
.putt .ph input{width:76px;padding:8px;border:2px solid var(--line);border-radius:10px;font-size:15px;font-weight:700}
.putt .ph .rm{margin-left:auto}
.putt .chips{margin:2px 0}
.putt .chip{padding:6px 9px;font-size:13px}
.scoreline{font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
.gflag{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--g2);color:var(--g2);font-weight:900;font-size:17px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.gflag.set{background:var(--g2);color:#fff}
#tgtBar{position:fixed;left:8px;right:8px;z-index:2400;background:#111;color:#fff;border-radius:14px;padding:10px 12px;display:flex;align-items:center;gap:10px;box-shadow:0 2px 14px rgba(0,0,0,.4)}
#tgtBar .t{flex:1;font-size:13px;font-weight:700;line-height:1.25}
#tgtBar button{border:0;border-radius:10px;padding:9px 12px;font-weight:800;font-size:14px}
#tgtSave{background:var(--g);color:#fff}#tgtCancel{background:#333;color:#fff}
.leaflet-tooltip.dtip{background:rgba(17,17,17,.85);color:#fff;border:0;font-weight:800;font-size:13px;padding:3px 7px;border-radius:8px;box-shadow:none}
.leaflet-tooltip.dtip:before{display:none}
#fatal{position:fixed;inset:0;z-index:5000;background:#fff;padding:24px;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div id="mapWrap"><div id="map"></div></div>

<header id="top">
  <button id="menuBtn" class="ib" aria-label="Menu">&#9776;</button>
  <div id="holeNav">
    <button id="prevHole" class="ib" aria-label="Previous hole">&#8249;</button>
    <button id="holeLabel">Hole 1</button>
    <button id="nextHole" class="ib" aria-label="Next hole">&#8250;</button>
  </div>
  <div id="gps" class="pill poor">GPS &hellip;</div>
</header>

<div id="fabs">
  <button id="rotBtn" class="ib" aria-label="Map rotation" title="North up / shot up">N</button>
  <button id="layerBtn" class="ib" aria-label="Map type" title="Street / Satellite">&#9707;</button>
  <button id="centerBtn" class="ib" aria-label="Center on me" title="Center on me">&#9678;</button>
</div>

<div id="tgtBar" hidden><div class="t" id="tgtText"></div><button id="tgtCancel">Cancel</button><button id="tgtSave">Save</button></div>

<section id="panel">
  <div id="statusLine"><div><div id="stMain">Ready</div><div id="stSub"></div></div><button id="tgtBtn" class="link" hidden>Set green &#9971;</button><button id="greenBtn" class="link" hidden>Finish hole &#9873;</button></div>
  <div id="planBox" hidden>
    <div class="planHead">
      <div id="planNum" class="pnum">— yd</div>
      <button id="planClubBtn" class="chip cchip">Club</button>
      <button id="planEdit" class="chip" title="Pattern">&#9881;</button>
      <button id="pwMinus" class="chip" aria-label="Narrower">&minus;</button>
      <button id="pwPlus" class="chip" aria-label="Wider">+</button>
      <button id="planClose" class="link">&#10005;</button>
    </div>
    <div class="psub" id="planSub"></div>
    <div class="chips" id="planClubs" hidden></div>
    <div class="row"><button id="markBtn" class="btn ghost">Just mark</button><button id="goBtn" class="btn pri">Go</button></div>
  </div>
  <div class="actions">
    <button id="planBtn" class="btn plan">PLAN</button>
    <button id="recBtn" class="btn pri">RECORD</button>
  </div>
</section>

<div id="sheetWrap" hidden><div id="sheet"></div></div>

<div id="capOverlay" hidden>
  <div class="capBox">
    <div id="capTitle">Locking GPS position</div>
    <div class="big" id="capCount">4</div>
    <div class="sub" id="capInfo">Hold still</div>
    <div class="stack">
      <button class="btn ghost" id="capSkip">Use now</button>
      <button class="btn sec" id="capStale" hidden>Use last fix</button>
      <button class="btn sec" id="capWait" hidden>Wait 5 s more</button>
      <button class="btn pri" id="capAnyway" hidden>Record anyway</button>
      <button class="btn ghost" id="capCancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="resultCard" hidden>
  <div class="rcHead"><div><div id="rcMain">—</div><div id="rcSub" class="psub"></div></div><button id="rcUndo" class="link">Undo</button></div>
  <div id="rcAsk" hidden><div class="clab" style="width:auto;margin-bottom:4px">What did you hit?</div><div class="chips" id="rcClubs"></div></div>
  <div id="rcTags" hidden><div class="chips"><span class="clab">Strike</span><span id="rcStrike" style="display:contents"></span></div><div class="chips"><span class="clab">Miss</span><span id="rcMiss" style="display:contents"></span></div></div>
  <button id="rcSep" class="btn ghost" style="margin-bottom:8px" hidden>No, that was a separate shot</button>
  <div class="row"><button id="rcGreen" class="btn sec">Finish hole</button><button id="rcPlan" class="btn plan">Plan next</button></div>
  <button id="rcDone" class="btn ghost" style="margin-top:8px">Done</button>
</div>

<script>
(function(){
'use strict';
if (!window.L){ document.body.insertAdjacentHTML('beforeend', '<div id="fatal">The map library did not load. Check your connection and reload.</div>'); return; }

/* ---------- constants ---------- */
var KEY = 'gst.v1';
var M_PER_YD = 0.9144;                 // exact, by definition
var WGS84_A = 6378137;                 // semi-major axis (m)
var WGS84_F = 1 / 298.257223563;       // flattening
var WGS84_E2 = WGS84_F * (2 - WGS84_F);
var DEFAULT_CLUBS = ['Driver','Mini Driver','19° UW','Heavenwood','9 Wood','4 Utility','6i','7i','8i','9i','PW','50°','54°','58°'];
var LIES = ['Tee','Fairway','Rough','Bunker','Fringe','Other'];
var STRIKES = ['Pure','Thin','Fat','Toe','Heel'];
var MISSES = ['Left','Right','Short','Long','On target'];
var MISS_OPP = {Left:'Right', Right:'Left', Short:'Long', Long:'Short'};
var SAT_URL = 'https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=';
var USGS_TILE = 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/';
var MAPBOX_TILE = 'https://api.mapbox.com/v4/mapbox.satellite/';
var MAPBOX_CSS = 'https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css'; // official stylesheet, used only for the required Mapbox logo
var MAPBOX_TTL_MS = 30 * 24 * 3600 * 1000; // Mapbox terms: on-device cache limited to 30 days
var OFFLINE_MAX_TILES = 3000;
/* Imagery sources that may be saved on the phone.
   key() is the cache key (no access token in it); url() is what is fetched. */
var SOURCES = {

/* Storage: IndexedDB (large quota, can be marked persistent). Falls back to localStorage only if
   IndexedDB is unavailable. Keys: 'state' = everything except trails; 'trail:<roundId>' = breadcrumbs. */
var store = (function(){
  var db = null, mode = 'idb';
  var DB = 'shot-tracker', OS = 'kv';
  function lsKey(k){ return k === 'state' ? KEY : 'gst.' + k.replace(':', '.'); } // state -> gst.v1, trail:x -> gst.trail.x
  function req(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  return {
    open:function(){
      if (!('indexedDB' in window)){ mode = 'ls'; return Promise.resolve(mode); }
      return new Promise(function(res){
        var q; try { q = indexedDB.open(DB, 1); } catch(e){ mode = 'ls'; return res(mode); }
        q.onupgradeneeded = function(){ q.result.createObjectStore(OS); };
        q.onsuccess = function(){ db = q.result; res(mode); };
        q.onerror = q.onblocked = function(){ mode = 'ls'; res(mode); };
      });
    },
    mode:function(){ return mode; },
    get:function(k){
      if (mode === 'ls'){ try { return Promise.resolve(JSON.parse(localStorage.getItem(lsKey(k)))); } catch(e){ return Promise.resolve(null); } }
      return req(db.transaction(OS, 'readonly').objectStore(OS).get(k));
    },
    put:function(k, v){

      return new Promise(function(res){ var t = db.transaction(OS, 'readwrite'); t.objectStore(OS).delete(k); t.oncomplete = t.onerror = function(){ res(); }; });

        return Promise.resolve(out);

/* One-time move from the localStorage format used by earlier versions. */
function migrateFromLocal(){
  var raw; try { raw = localStorage.getItem(KEY); } catch(e){ return Promise.resolve(null); }
  if (!raw) return Promise.resolve(null);
  var j; try { j = JSON.parse(raw); } catch(e){ return Promise.resolve(null); }
  if (!j || j.v !== 1) return Promise.resolve(null);
  var trailMap = {};
  (j.rounds || []).forEach(function(r){
    if (r.trail){ if (r.trail.length) trailMap[r.id] = r.trail; delete r.trail; }
    try { var t = JSON.parse(localStorage.getItem('gst.trail.' + r.id)); if (t && t.length) trailMap[r.id] = t; } catch(e){}

    if (!back || back.rounds.length !== j.rounds.length) throw new Error('verify');

    return back;

function gpsPill(){
  var el = $('#gps');

  if (age > STALE_FIX_MS){ el.className = 'pill stale'; el.textContent = 'GPS ' + Math.round(age / 1000) + ' s old'; renderStatus(); return; }
  var ls = lockState();

/* ---------- map rotation ----------

    document.documentElement.style.setProperty('--unrot', (-cssAngle()).toFixed(1) + 'deg');

  if (aimMarker && aimMarker.dragging){ if (bearing) aimMarker.dragging.disable(); else aimMarker.dragging.enable(); }
  if (placing && placing.marker && placing.marker.dragging){ if (bearing) placing.marker.dragging.disable(); else placing.marker.dragging.enable(); }

  if (plan && fix) return bearingDeg({lat:fix.lat, lng:fix.lng}, plan.aim);

  var b = autoBearing();
  if (b == null){ // nothing to point at yet, so let the golfer spin it by hand instead of refusing

/* Taps and clicks: undo the rotation so Leaflet gets the right point.

(function(){

      active = null;

  }
  function twistMove(e){
    if (!twist || !pts[twist.a] || !pts[twist.b]) return false;
    var d = angleOf(pts[twist.a], pts[twist.b]) - twist.start;

/* ---------- the green, placed by hand ----------
   A green belongs to the course, not to one round: place it once and every later round on the same
   course reuses it. A round finds its course by its name; a round you did not name is matched to the
   nearest course you have already placed a green on. The name wins, because two courses at one resort
   can sit a few hundred yards apart and the wrong greens would mean wrong yardages all day. */
var COURSE_MATCH_M = 1200;
function findCourse(id){ for (var i = 0; i < S.courses.length; i++) if (S.courses[i].id === id) return S.courses[i]; return null; }
function nearestCourse(pt, maxM){
  var best = null, bd = maxM;
  S.courses.forEach(function(c){
    Object.keys(c.greens || {}).forEach(function(k){

    });
  });

}
function courseFor(create){
  var r = active(); if (!r) return null;
  var c = r.courseId ? findCourse(r.courseId) : null;
  if (!c){
    var name = (r.course || '').trim().toLowerCase();
    if (name) c = S.courses.filter(function(x){ return (x.name || '').trim().toLowerCase() === name; })[0] || null;
  }
  if (!c && !(r.course || '').trim() && fix) c = nearestCourse(fix, COURSE_MATCH_M);
  if (!c && create){ c = {id:uid(), name:(r.course || '').trim() || 'Course', t:Date.now(), greens:{}}; S.courses.push(c); }
  if (c && r.courseId !== c.id) r.courseId = c.id;

}

var greenIcon = L.divIcon({className:'', html:'<div class="gflag set">&#9971;</div>', iconSize:[30,30], iconAnchor:[15,15]});
var greenPickIcon = L.divIcon({className:'', html:'<div class="gflag">&#9971;</div>', iconSize:[30,30], iconAnchor:[15,15]});

/* Scale: fit you, the green and any aim target on screen. Never while you are following yourself

window.__mapView = function(){ var c = map.getCenter(); return {zoom:map.getZoom(), lat:c.lat, lng:c.lng}; }; // exposed for testing

/* ---------- the hole card: the whole story of a hole ----------

  if (d === 1) return 'bogey';

  if (d === 3) return 'triple bogey';

}

/* ---------- rendering ---------- */
function layout(){
  var ph = $('#panel').offsetHeight;
  $('#mapWrap').style.bottom = Math.max(0, ph - 18) + 'px';
  var tb = $('#tgtBar'), tbh = tb.hidden ? 0 : tb.offsetHeight + 10;
  tb.style.bottom = (ph + 10) + 'px';
  $('#fabs').style.bottom = (ph + 26 + tbh) + 'px';
  applyRotation();
}
if (window.ResizeObserver) new ResizeObserver(layout).observe($('#panel'));
window.addEventListener('resize', layout);

function pinIcon(i, ex){ return L.divIcon({className:'', html:'<div class="pin' + (ex ? ' ex' : '') + '">' + i + '</div>', iconSize:[28,28], iconAnchor:[14,14]}); }
var pointIcon = L.divIcon({className:'', html:'<div class="ptdot"></div>', iconSize:[12,12], iconAnchor:[6,6]});
var flagIcon = L.divIcon({className:'', html:'<div class="flag">&#9873;</div>', iconSize:[30,30], iconAnchor:[15,15]});

function fitPadding(){
  var el = $('#map'), wrap = $('#mapWrap');
  var px = Math.max(50, (el.offsetWidth - wrap.clientWidth) / 2 + 40);
  var py = Math.max(50, (el.offsetHeight - wrap.clientHeight) / 2 + 40);
  return [px, py];
}
function renderHole(fit){
  if (plan && planKey !== holeKey()) endPlan(true);
  holeLayer.clearLayers(); markers = {};
  var r = active(), h = curHole();
  $('#holeLabel').textContent = h ? 'Hole ' + h.n : 'No round';
  trailLine.setLatLngs(r ? getTrail(r).map(function(p){ return [p[0], p[1]]; }) : []);
  if (h){
    h.shots.forEach(function(s, i){
      var e = shotEnd(h, i);
      if (e){
        var d = yd(distM(s, e.pt));
        L.polyline([[s.lat,s.lng],[e.pt.lat,e.pt.lng]], {color:s.excluded ? '#9e9e9e' : '#ff9800', weight:4, opacity:0.95})
          .bindTooltip('<span class="urot">' + r0(d) + ' yd · ' + esc(s.club || 'club?') + '</span>', {permanent:true, direction:'center', className:'dtip'})
          .addTo(holeLayer);
      }
      if (s.plan){
        var am = L.marker([s.plan.lat, s.plan.lng], {icon:aimDoneIcon, interactive:false}).addTo(holeLayer);
        var pr = planResultFor(h, i);
        if (e && pr) L.polyline([[s.plan.lat, s.plan.lng], [e.pt.lat, e.pt.lng]], {color:'#ff9800', weight:2, dashArray:'4 6', opacity:0.9})
          .bindTooltip('<span class="urot">' + missText(pr) + '</span>', {permanent:true, direction:'center', className:'dtip'}).addTo(holeLayer);
      }
      var m = L.marker([s.lat, s.lng], {icon:pinIcon(i+1, s.excluded), zIndexOffset:1000}).addTo(holeLayer);
      m.on('click', function(){ openShotEdit(h, i); });
      markers[s.id] = m;
    });
    if (h.green){
      var gm = L.marker([h.green.lat, h.green.lng], {icon:flagIcon, zIndexOffset:1100}).addTo(holeLayer);
      gm.bindTooltip('<span class="urot">' + holeScore(h) + (h.green.feet == null ? '' : ' · ' + h.green.feet + ' ft') + '</span>', {permanent:true, direction:'right', offset:[14,0], className:'dtip'});
      gm.on('click', function(){ openGreenEdit(h); });
      markers.green = gm;
    }
    var cg = greenFor(h);
    if (cg && !(placing && placing.n === h.n)){
      var cm = L.marker([cg.lat, cg.lng], {icon:greenIcon, zIndexOffset:900}).addTo(holeLayer);
      cm.bindTooltip('<span class="urot">' + greenLabel() + '</span>', {permanent:true, direction:'top', offset:[0,-15], className:'dtip'});
      cm.on('click', function(){ openCourseGreen(h); });
      markers.cgreen = cm;
    }
    if (fit){
      var pts = h.shots.map(function(s){ return [s.lat, s.lng]; });
      if (h.green) pts.push([h.green.lat, h.green.lng]);
      if (cg) pts.push([cg.lat, cg.lng]);
      if (fix && (cg || !h.green)) pts.push([fix.lat, fix.lng]);
      if (pts.length >= 2){ follow = false; map.fitBounds(pts, {padding:fitPadding(), maxZoom:19}); autoFitAt = Date.now(); autoFitD = (cg && fix) ? distM(fix, cg) : null; }
      else if (fix){ follow = true; map.setView([fix.lat, fix.lng], 18); }
    }
  }
  updateLive(); drawPlan(); renderPoints();
}

function openShot(h){ return (h && h.shots.length && !h.green) ? h.shots[h.shots.length - 1] : null; }
function greenLabel(){
  var d = fix ? toGreenYd({lat:fix.lat, lng:fix.lng}) : null;
  return d == null ? 'green' : r0(d) + ' yd';
}
function updateLive(){
  var h = curHole(), open = openShot(h);
  if (open && fix) liveLine.setLatLngs([[open.lat, open.lng], [fix.lat, fix.lng]]);
  else liveLine.setLatLngs([]);
  if (markers.cgreen && markers.cgreen.setTooltipContent) markers.cgreen.setTooltipContent('<span class="urot">' + greenLabel() + '</span>');
  renderStatus();
}

function chips(el, opts, get, set){
  function draw(){
    var cur = get();
    el.innerHTML = opts.map(function(o){ return '<button class="chip' + (cur === o ? ' on' : '') + '">' + esc(o) + '</button>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b, i){
      b.onclick = function(){ set(get() === opts[i] ? null : opts[i]); draw(); };
    });
  }
  draw();
}
function missChips(el, get, set){
  function draw(){
    var cur = get();
    el.innerHTML = MISSES.map(function(o){ return '<button class="chip' + (cur.indexOf(o) >= 0 ? ' on' : '') + '">' + esc(o) + '</button>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b, i){
      b.onclick = function(){
        var o = MISSES[i], a = get().slice();
        if (o === 'On target') a = a.indexOf(o) >= 0 ? [] : [o];
        else {
          var had = a.indexOf(o) >= 0;
          a = a.filter(function(x){ return x !== 'On target' && x !== MISS_OPP[o] && x !== o; });
          if (!had) a.push(o);
        }
        set(a); draw();
      };
    });
  }
  draw();
}

/* ---------- sheets ---------- */
var sheetCancel = null;
function openSheet(html, onCancel){
  var w = $('#sheetWrap'), sh = $('#sheet');
  sh.innerHTML = html; sh.scrollTop = 0; w.hidden = false; sheetCancel = onCancel || null;
  return sh;
}
function closeSheet(silent){
  var fn = sheetCancel; sheetCancel = null;
  $('#sheetWrap').hidden = true; $('#sheet').innerHTML = '';
  if (!silent && fn) fn();
}
$('#sheetWrap').addEventListener('click', function(e){ if (e.target.id === 'sheetWrap') closeSheet(); });

/* ---------- hit shot ---------- */
/* Walking to the next tee is the moment the putts and the score are lost for good, so ask here. */
function nagUnfinished(){
  var h = curHole();
  if (!h || !h.shots.length || h.green) return false;
  if (!confirm('Hole ' + h.n + ' has ' + h.shots.length + ' shot' + (h.shots.length === 1 ? '' : 's') + ' logged but was never finished, so it has no putts and no score.\n\nOK = finish it now, Cancel = move on without them.')) return false;
  onGreen(); return true;
}
function goNext(){
  var r = active(), h = curHole();
  if (r.cur < r.holes.length - 1) r.cur++;
  else { r.holes.push({n:nextN(h.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
  save(); renderHole(true);
}
var lastLog = null;

function hideResult(){ $('#resultCard').hidden = true; lastLog = null; }
function undoLast(){
  var u = lastLog; if (!u) return;
  hideResult();
  var r = null; S.rounds.forEach(function(x){ if (x.id === u.rid) r = x; });
  if (!r) return;
  r.holes.forEach(function(h){ h.shots = h.shots.filter(function(s){ return s.id !== u.shotId; }); });
  if (u.remarked){ // a re-mark moved an existing shot instead of adding one: put it back
    r.holes.forEach(function(h){ h.shots.forEach(function(x){
      if (x.id === u.remarked.id){ x.lat = u.remarked.was.lat; x.lng = u.remarked.was.lng; x.club = u.remarked.was.club; }
    }); });
  }
  if (u.greenOf){ r.holes.forEach(function(h){ if (h.n === u.greenOf) h.green = null; }); }
  if (u.closedId && u.club !== undefined){ // put the closed shot's club back the way it was
    r.holes.forEach(function(h){ h.shots.forEach(function(x){ if (x.id === u.closedId) x.club = u.club; }); });
  }
  if (u.newRound && !r.holes.some(function(h){ return h.shots.length; })){
    S.rounds = S.rounds.filter(function(x){ return x.id !== r.id; }); store.del('trail:' + r.id);
    S.activeId = u.prevActive; S.playingId = u.prevPlaying;
  } else {
    while (r.holes.length > u.holesLen && !r.holes[r.holes.length - 1].shots.length) r.holes.pop();
    r.cur = Math.min(u.cur, r.holes.length - 1);
  }
  if (u.plan){ plan = u.plan; planKey = holeKey(); $('#planBtn').classList.add('on'); renderPlanBox(false); }
  save(); renderHole(false); toast('Undone');
}

/* Makes sure there is a round and a live hole to log into. Returns null if the golfer cancels. */
function ensureHole(snap){
  var r = active();
  if (r && !r.keepOpen && Date.now() - r.started > 12 * 3600 * 1000){
    if (confirm('The current round started ' + niceDate(r.started) + '. Start a new round?\n\nOK = new round, Cancel = keep adding to the old one.')){
      r = newRound(''); snap.newRound = true; if (plan) planKey = holeKey(); renderHole(false);
    } else { r.keepOpen = true; save(); }
  }
  if (!r){ r = newRound(''); snap.newRound = true; if (plan) planKey = holeKey(); renderHole(false); }
  snap.rid = r.id; snap.holesLen = r.holes.length; snap.cur = r.cur;
  var h = curHole();
  if (h.green){
    var lastIdx = r.holes.length - 1, tgt = r.holes[lastIdx];
    var label = tgt.green ? nextN(tgt.n) : tgt.n;
    if (!confirm('Hole ' + h.n + ' is finished. Start hole ' + label + '?\n\nCancel, then tap the hole number at the top to jump to any hole.')) return null;
    var keepPlan = plan; r.cur = lastIdx;
    if (tgt.green){ r.holes.push({n:nextN(tgt.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
    save(); if (keepPlan) planKey = holeKey(); renderHole(true); h = curHole();
  }
  return {r:r, h:h};
}
/* Uses the locked average when it is ready, otherwise averages briefly (and asks about weak or stale GPS). */
function grabPosition(){
  var ls = lockState();
  if (ls.locked){ cap = null; return Promise.resolve(Object.assign({}, ls.pos, {stale:false, ageS:0, weak:false, locked:true, lockS:ls.spanS})); }
  startCapture(); return awaitCapture();
}

/* A second mark at the same ball, this soon and this close, is a re-mark, not a new shot. */
var REMARK_MS = 120000, REMARK_YD = 6;
/* Drops your ball position. plan and club are optional (PLAN then Go supplies both). */
function markBall(opts){
  opts = opts || {};
  if (!booted) return Promise.resolve(null);
  keepAwake(); hideResult();
  var snap = {prevActive:S.activeId, prevPlaying:S.playingId, newRound:false, plan:plan};
  var ctx = ensureHole(snap);
  if (!ctx) return Promise.resolve(null);
  var r = ctx.r, h = ctx.h;
  var usePlan = (opts && opts.plan) || null;
  return grabPosition().then(function(pos){
    if (!pos) return null;
    /* Tapping RECORD twice at the same ball used to make a second shot a yard from the first,
       which then measured as a 0 yd shot and pushed every club distance onto the wrong stroke.
       A second mark at the same spot within two minutes is the same ball: update it, do not add. */
    var last = h.shots[h.shots.length - 1];
    if (last && !opts.forceNew && Date.now() - last.t < REMARK_MS && yd(distM(last, pos)) < REMARK_YD){
      var was = {lat:last.lat, lng:last.lng, club:last.club};
      last.lat = pos.lat; last.lng = pos.lng; last.acc = pos.acc; last.n = pos.n; last.t = Date.now();
      Object.assign(last, gpsQ(pos));
      if (pos.locked) last.lockS = pos.lockS;
      if (opts && opts.club) last.club = opts.club;
      if (usePlan) last.plan = usePlan;
      markPlaying(r);
      if (usePlan) endPlan(true);
      save(); follow = true; renderHole(false);
      snap.shotId = null; snap.remarked = {id:last.id, was:was};
      lastLog = snap;
      return {h:h, shot:last, closed:null, pos:pos, remarked:true, opts:opts};
    }
    var closed = openShot(h);
    var shot = Object.assign({id:uid(), club:(opts && opts.club) || null, lie:h.shots.length === 0 ? 'Tee' : null,
      lat:pos.lat, lng:pos.lng, acc:pos.acc, n:pos.n, t:Date.now(), strike:null, miss:[], excluded:false}, gpsQ(pos));
    if (pos.locked) shot.lockS = pos.lockS;
    if (usePlan) shot.plan = usePlan;
    markPlaying(r);
    h.shots.push(shot);
    if (usePlan) endPlan(true);
    save(); follow = true; renderHole(false);
    snap.shotId = shot.id; snap.closedId = closed ? closed.id : null; snap.club = closed ? closed.club : undefined;
    lastLog = snap;
    return {h:h, shot:shot, closed:closed, pos:pos};
  });
}

/* RECORD: measures the shot you just hit, then marks your new ball position. */
function onRecord(){
  markBall({}).then(function(res){
    if (!res) return;
    var h = res.h, closed = res.closed;
    if (res.remarked){ showResult({main:'Ball re-marked', sub:'Same spot as your last mark, so it was moved rather than counted as another shot' + gpsNote(res.pos), h:h, shot:res.shot, ask:!res.shot.club, separate:res.opts}); return; }
    if (!closed){ showResult({main:'Ball marked', sub:'Tap RECORD again at your next ball' + gpsNote(res.pos), h:h}); return; }
    var i = h.shots.indexOf(closed), d = shotDistYd(h, i), pr = planResultFor(h, i);
    showResult({
      main:(closed.club ? closed.club + ' · ' : '') + r0(d) + ' yd',
      sub:(pr ? missText(pr) + ' from your aim' + (pr.inside ? ' · inside your pattern' : ' · outside your pattern') : 'GPS total distance, carry plus roll') + gpsNote(res.pos),
      h:h, shot:closed, ask:!closed.club
    });
  });
}
function onPlanGo(){
  if (!plan) return;
  var p = {lat:plan.aim.lat, lng:plan.aim.lng, club:plan.club, shape:plan.pat.shape, L:plan.pat.L, R:plan.pat.R, S:plan.pat.S, G:plan.pat.G};
  var club = plan.club;
  markBall({plan:p, club:club}).then(function(res){
    if (!res) return;
    var h = res.h, closed = res.closed, i;
    if (res.remarked){ showResult({main:'Ball re-marked', sub:'Same spot as your last mark, so it was moved rather than counted as another shot', h:h, shot:res.shot, ask:!res.shot.club, separate:res.opts}); return; }
    if (closed){
      i = h.shots.indexOf(closed);
      showResult({main:(closed.club ? closed.club + ' · ' : '') + r0(shotDistYd(h, i)) + ' yd', sub:'Your previous shot, now measured', h:h, shot:closed, ask:!closed.club});
    } else toast('Ball marked · ' + club + ' to a target ' + r0(yd(distM(res.shot, p))) + ' yd away' + gpsNote(res.pos), 3500);
  });
}
function onMarkOnly(){
  if (plan) endPlan(true);
  markBall({}).then(function(res){
    if (!res) return;
    var h = res.h, closed = res.closed;
    if (res.remarked){ showResult({main:'Ball re-marked', sub:'Same spot as your last mark, so it was moved rather than counted as another shot', h:h, shot:res.shot, ask:!res.shot.club, separate:res.opts}); return; }
    if (closed){ var i = h.shots.indexOf(closed); showResult({main:(closed.club ? closed.club + ' · ' : '') + r0(shotDistYd(h, i)) + ' yd', sub:'Your previous shot, now measured', h:h, shot:closed, ask:!closed.club}); }
    else toast('Ball marked' + gpsNote(res.pos), 3000);
  });
}

/* The one card that reports a shot and lets you fix it on the spot. */
function showResult(o){
  var card = $('#resultCard');
  $('#rcMain').textContent = o.main; $('#rcSub').textContent = o.sub || '';
  var ask = $('#rcAsk'), tags = $('#rcTags');
  ask.hidden = !o.ask; tags.hidden = !o.shot;
  if (o.ask){
    var clubs = S.settings.clubs;
    $('#rcClubs').innerHTML = clubs.map(function(c, i){ return '<button class="chip" data-i="' + i + '">' + esc(c) + '</button>'; }).join('');
    Array.prototype.forEach.call($('#rcClubs').querySelectorAll('.chip'), function(b){
      b.onclick = function(){
        o.shot.club = clubs[+b.dataset.i]; save(); renderHole(false);
        ask.hidden = true;
        var i = o.h.shots.indexOf(o.shot);
        $('#rcMain').textContent = o.shot.club + ' · ' + r0(shotDistYd(o.h, i)) + ' yd';
      };
    });
  }
  if (o.shot){
    chips($('#rcStrike'), STRIKES, function(){ return o.shot.strike || null; }, function(v){ o.shot.strike = v; save(); });
    missChips($('#rcMiss'), function(){ return o.shot.miss || []; }, function(v){ o.shot.miss = v; save(); });
  }
  var sep = $('#rcSep');
  sep.hidden = !o.separate;
  if (o.separate) sep.onclick = function(){
    sep.hidden = true;
    markBall(Object.assign({}, o.separate, {forceNew:true})).then(function(res){
      if (!res) return;
      var c = res.closed, i;
      if (c){ i = res.h.shots.indexOf(c); showResult({main:(c.club ? c.club + ' · ' : '') + r0(shotDistYd(res.h, i)) + ' yd', sub:'Kept as a separate shot', h:res.h, shot:c, ask:!c.club}); }
      else toast('Kept as a separate shot');
    });
  };
  $('#rcGreen').hidden = !o.h || !!o.h.green || !o.h.shots.length;
  card.hidden = false;
  layout();
}

/* Editing one shot: the club, how it was struck, where it missed, or moving the marker. */
function openShotEdit(h, i){
  var s = h.shots[i], d = shotDistYd(h, i);
  var clubs = S.settings.clubs.slice(); if (s.club && clubs.indexOf(s.club) < 0) clubs.unshift(s.club); if (!s.club) clubs.unshift('(not set)');
  var el = openSheet(
    '<h3>Hole ' + h.n + ' · Shot ' + (i+1) + '</h3>' +
    '<div class="sub">' + (d != null ? r0(d) + ' yd total (GPS, to ' + shotEnd(h,i).type + ')' : 'Distance pending: set by your next shot or ON GREEN') +
      ' · GPS ±' + r0(yd(s.acc || 0)) + ' yd (phone estimate)' + (s.moved ? ' · moved by hand' : '') + (s.stale ? ' · recorded from a ' + s.ageS + ' s old fix' : '') + (s.weak ? ' · weak GPS' : '') + '</div>' +
    (s.plan ? '<div class="sub"><b>Plan:</b> aimed ' + r0(yd(distM(s, s.plan))) + ' yd with ' + esc(s.plan.club) + ' · pattern ' + patText(s.plan) +
      (planResultFor(h, i) ? '<br><b>Result vs aim:</b> ' + missText(planResultFor(h, i)) + (planResultFor(h, i).inside ? ' · inside pattern' : ' · outside pattern') : '<br>Result vs aim appears after your next shot.') +
      ' <button class="link" id="dropPlan">Remove plan</button></div>' : '') +
    '<label class="fl">Club<select id="club">' + clubs.map(function(c){ return '<option' + ((c === s.club || (!s.club && c === '(not set)')) ? ' selected' : '') + '>' + esc(c) + '</option>'; }).join('') + '</select></label>' +
    '<div class="fl">Lie</div><div class="chips" id="lieC"></div>' +
    '<div class="fl">Strike</div><div class="chips" id="stC"></div>' +
    '<div class="fl">Miss</div><div class="chips" id="msC"></div>' +
    '<label class="chk"><input type="checkbox" id="ex"' + (s.excluded ? ' checked' : '') + '> Exclude from club stats</label>' +
    '<div class="row"><button class="btn sec" id="move">Move marker</button><button class="btn danger" id="del">Delete shot</button></div>' +
    '<div class="stack"><button class="btn pri" id="done">Done</button></div>',
    function(){ save(); renderHole(false); });
  el.querySelector('#club').onchange = function(e){ s.club = e.target.value === '(not set)' ? null : e.target.value; save(); };
  chips(el.querySelector('#lieC'), LIES, function(){ return s.lie || null; }, function(v){ s.lie = v; save(); });
  chips(el.querySelector('#stC'), STRIKES, function(){ return s.strike || null; }, function(v){ s.strike = v; save(); });
  missChips(el.querySelector('#msC'), function(){ return s.miss || []; }, function(v){ s.miss = v; save(); });
  el.querySelector('#ex').onchange = function(e){ s.excluded = e.target.checked; save(); };
  if (s.plan) el.querySelector('#dropPlan').onclick = function(){ if (confirm('Remove the aim point from this shot?')){ delete s.plan; save(); closeSheet(true); renderHole(false); } };
  el.querySelector('#move').onclick = function(){ closeSheet(true); renderHole(false); enableMove(s.id, s); };
  el.querySelector('#del').onclick = function(){
    if (!confirm('Delete shot ' + (i+1) + ' (' + s.club + ')?')) return;
    h.shots.splice(i, 1); save(); closeSheet(true); renderHole(false); toast('Shot deleted');
  };
  el.querySelector('#done').onclick = function(){ closeSheet(); };
}

/* ---------- finishing a hole: the whole story ---------- */
function onGreen(){
  keepAwake();
  var h = curHole();
  if (!h || !h.shots.length){ toast('Log at least one shot on this hole first.'); return; }
  if (h.green){ openCard(h, 'edit'); return; }
  startCapture();
  openCard(h, 'finish');
}
function openGreenEdit(h){ openCard(h, 'edit'); }

/* One sheet, used to finish a hole and to edit it afterwards. Only the distance is asked for;
   putts, bunkers and penalty strokes are there for anyone who wants the full picture. */
function openCard(h, mode){
  var finish = mode === 'finish';
  var g = h.green || null;
  var c = h.card ? JSON.parse(JSON.stringify(h.card)) : blankCard();
  var scoreTouched = c.score != null;
  var lastI = h.shots.length - 1, lastD = lastI >= 0 ? shotDistYd(h, lastI) : null;

  var el = openSheet(
    '<h3>' + (finish ? 'Finish hole ' : 'Hole ') + h.n + '</h3>' +
    '<div class="sub">' + (finish
      ? 'Stand at your ball on the green. Only the distance is needed \u2014 the rest is there when you want the whole story.'
      : ((lastD != null ? 'Last shot ' + r0(lastD) + ' yd \u00b7 ' : '') + 'GPS \u00b1' + r0(yd((g && g.acc) || 0)) + ' yd')) + '</div>' +
    '<label class="fl">Feet to pin<input id="ft" type="number" inputmode="decimal" min="0" step="0.5" placeholder="e.g. 18" value="' + (g && g.feet != null ? g.feet : '') + '"></label>' +
    '<label class="chk"><input type="checkbox" id="holed"' + (g && g.holed ? ' checked' : '') + '> Holed out from off the green</label>' +
    '<div class="fl">Par</div><div class="chips" id="parC"></div>' +
    '<div class="fl">Putts</div><div class="chips" id="puttN"></div><div id="puttList"></div>' +
    '<div class="fl">Bunkers and penalty strokes</div><div id="trouble"></div>' +
    '<div class="fl">Score</div><div id="scoreStep"></div><div class="scoreline" id="scoreWhy"></div>' +
    '<label class="fl">Note<input id="cnote" type="text" maxlength="120" placeholder="anything worth remembering" value="' + esc(c.note || '') + '"></label>' +
    (finish ? '' : '<div class="row"><button class="btn sec" id="move">Move marker</button><button class="btn danger" id="reopen">Reopen hole</button></div>') +

/* Local flat-earth frame at an origin (east x, north y, metres), using the same WGS84 radii as distM. */
function radii(lat){ var phi = lat * Math.PI / 180, s = Math.sin(phi), w = 1 - WGS84_E2 * s * s; return {M:WGS84_A * (1 - WGS84_E2) / Math.pow(w, 1.5), N:WGS84_A / Math.sqrt(w), c:Math.cos(phi)}; }

/* Pattern outline around the aim, as lat/lng points. Arc = band centred on the ball; oval = four quarter-ellipses. */
function patternPolygon(start, aim, q){

    for (k = n; k >= 0; k--){ var b = a0 + (a1 - a0) * k / n; pts.push(at((ux * Math.cos(b) + rx * Math.sin(b)) * rIn, (uy * Math.cos(b) + ry * Math.sin(b)) * rIn)); }

/* Where the ball finished relative to the aim, in yards (right +, long +), and whether it was inside the pattern. */

    inside = a > 0 && b > 0 && (dx / a) * (dx / a) + (dy / b) * (dy / b) <= 1;

function computeAimStats(rounds, pureOnly){
  var by = {};
  rounds.forEach(function(r){ r.holes.forEach(function(h){ h.shots.forEach(function(s, i){
    if (s.excluded || !s.plan || !s.club) return;
    if (pureOnly && s.strike !== 'Pure') return;
    var pr = planResultFor(h, i); if (!pr) return;
    (by[s.club] = by[s.club] || []).push(pr);

  function sd(a){ if (a.length < 2) return null; var m = mean(a); return Math.sqrt(a.reduce(function(t, x){ return t + (x - m) * (x - m); }, 0) / (a.length - 1)); }

var plan = null;           // {aim:{lat,lng}, club, pat:{shape,L,R,S,G}}
var aimDragging = false, planKey = null;
var planLayer = L.layerGroup().addTo(map), aimMarker = null;

var aimIcon = L.divIcon({className:'', html:'<div class="aimx"></div>', iconSize:[34,34], iconAnchor:[17,17]});
var aimDoneIcon = L.divIcon({className:'', html:'<div class="aimo"></div>', iconSize:[16,16], iconAnchor:[8,8]});

function planStart(){ return fix ? {lat:fix.lat, lng:fix.lng} : null; }

/* Moving a marker while the map is turned. Leaflet's own marker drag follows the raw screen

function attachRotDrag(m, h){
  var el = m.getElement && m.getElement();

  var drag = null;
  function end(e){
    if (!drag || e.pointerId !== drag.id) return;
    drag = null;
    if (h.end) h.end();
  }
  el.addEventListener('pointerdown', function(e){
    if (!bearing) return;  // facing north: Leaflet's marker drag is live, leave it alone
    e.stopPropagation();   // keep the one-finger pan out of this gesture
    drag = {id:e.pointerId, x:e.clientX, y:e.clientY, pt:map.latLngToContainerPoint(m.getLatLng())};
    follow = false;
    if (h.start) h.start();

  });
  el.addEventListener('pointermove', function(e){
    if (!drag || e.pointerId !== drag.id) return;
    e.stopPropagation();
    var v = rotIn(e.clientX - drag.x, e.clientY - drag.y);
    var ll = map.containerPointToLatLng([drag.pt.x + v.x, drag.pt.y + v.y]);
    m.setLatLng(ll);
    if (h.move) h.move(ll);
  });

/* ---------- stats ---------- */
function computeStats(rounds, pureOnly){
  var by = {};
  rounds.forEach(function(r){ r.holes.forEach(function(h){ h.shots.forEach(function(s, i){
    if (s.excluded || !s.club) return;
    if (pureOnly && s.strike !== 'Pure') return;
    var d = shotDistYd(h, i); if (d == null) return;
    (by[s.club] = by[s.club] || []).push(d);
  }); }); });
  var order = S.settings.clubs;
  return Object.keys(by).map(function(club){
    var a = by[club].slice().sort(function(x, y){ return x - y; }), n = a.length;
    var mean = a.reduce(function(t, x){ return t + x; }, 0) / n;
    var med = n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2;
    var sd = n > 1 ? Math.sqrt(a.reduce(function(t, x){ return t + (x - mean) * (x - mean); }, 0) / (n - 1)) : null;
    return {club:club, n:n, mean:mean, median:med, min:a[0], max:a[n-1], sd:sd};
  }).sort(function(x, y){
    var ix = order.indexOf(x.club), iy = order.indexOf(y.club);
    if (ix < 0) ix = 999; if (iy < 0) iy = 999;
    return ix - iy || y.mean - x.mean;
  });
}

/* One row per hole: what you scored, how you putted, and what it cost you. */

/* course lookups that work for any round, not just the active one */
function courseById(id){ for (var i = 0; i < S.courses.length; i++) if (S.courses[i].id === id) return S.courses[i]; return null; }
function courseForRound(r){
  if (r.courseId){ var c = courseById(r.courseId); if (c) return c; }

  return name ? (S.courses.filter(function(x){ return (x.name || '').trim().toLowerCase() === name; })[0] || null) : null;

/* ---------- the round card you would actually show someone ----------
   Drawn as one SVG so the screen and the shared picture are the same thing, and so it survives
   being saved, sent and reopened with no fonts or images to fetch. Scoring is carried by shape -

var CARD_W = 1080, CARD_H = 1350;
var CARD = {bg:'#0C1F17', bg2:'#123026', ink:'#F4F1E8', mut:'#9DB0A4', line:'#24483A',
            under:'#EFB84A', over:'#5FAEDB'};
function roundStats(r){
  var played = r.holes.filter(function(h){ return h.green || h.shots.length; });
  var st = {holes:[], strokes:0, par:0, toPar:null, allPar:true, putts:0, one:0, three:0,
            pen:0, bunk:0, eagle:0, birdie:0, parN:0, bogey:0, dbl:0,
            longDrive:null, longPutt:null, best:null, date:r.started, course:r.course || 'Untitled course'};
  played.forEach(function(h){
    var v = holeScore(h), par = courseParFor(r, h), c = cardOf(h);
    st.holes.push({n:h.n, score:v, par:par});
    if (v != null) st.strokes += v;
    if (par) st.par += par; else st.allPar = false;
    var pc = puttCount(h);

    }
    if (c) c.putts.forEach(function(pt){
      if (pt.out === 'In' && pt.ft != null && (!st.longPutt || pt.ft > st.longPutt.ft)) st.longPutt = {ft:pt.ft, n:h.n};
    });
    h.shots.forEach(function(sh, i){
      var d = shotDistYd(h, i);
      if (d == null || sh.excluded) return;
      if (sh.lie === 'Tee' && par !== 3 && (!st.longDrive || d > st.longDrive.yd)) st.longDrive = {yd:d, n:h.n, club:sh.club};
    });
  });

}
function markFor(d){ return d == null ? '' : (d <= -2 ? 'eagle' : d === -1 ? 'birdie' : d === 0 ? 'par' : d === 1 ? 'bogey' : 'dbl'); }

  if (kind === 'eagle') return '<circle cx="' + cx + '" cy="' + cy + '" r="33" fill="none" stroke="' + g + '" stroke-width="3.5"/>' +
                                '<circle cx="' + cx + '" cy="' + cy + '" r="42" fill="none" stroke="' + g + '" stroke-width="3.5"/>';
  if (kind === 'bogey') return '<rect x="' + (cx - 31) + '" y="' + (cy - 31) + '" width="62" height="62" rx="5" fill="none" stroke="' + b + '" stroke-width="3.5"/>';
  if (kind === 'dbl') return '<rect x="' + (cx - 31) + '" y="' + (cy - 31) + '" width="62" height="62" rx="5" fill="none" stroke="' + b + '" stroke-width="3.5"/>' +

function nineBlock(st, from, to, label, x0, y0, colW){

/* the picture: the same SVG, rasterised, so it can be shared or saved */
function cardBlob(r, scale){
  return new Promise(function(resolve, reject){
    var svg = roundCardSVG(r), img = new Image();
    img.onload = function(){
      var k = scale || 1, cv = document.createElement('canvas');
      cv.width = CARD_W * k; cv.height = CARD_H * k;
      var ctx2 = cv.getContext('2d');
      ctx2.fillStyle = CARD.bg; ctx2.fillRect(0, 0, cv.width, cv.height);
      ctx2.drawImage(img, 0, 0, cv.width, cv.height);
      if (cv.toBlob) cv.toBlob(function(b){ b ? resolve(b) : reject(new Error('no blob')); }, 'image/png');
      else reject(new Error('no toBlob'));
    };
    img.onerror = function(){ reject(new Error('the card could not be drawn')); };
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
}

function downloadBlob(name, blob){
  var a = document.createElement('a');

}

      out.push({hi:hi, si:si, n:h.n, h:h, s:sh, d:shotDistYd(h, si), pr:planResultFor(h, si),
                aimYd:sh.plan ? yd(distM(sh, sh.plan)) : null});

  });

}

function openShotLog(r){

      };
    });

      var tmap = j.trails || {}; delete j.trails; delete j.appVersion; delete j.exportedAt;
      (j.rounds || []).forEach(function(r){ if (r.trail){ if (r.trail.length) tmap[r.id] = r.trail; delete r.trail; } }); // older backups
      j = normalize(j);
      return store.keys().then(function(keys){
        return Promise.all(keys.filter(function(k){ return String(k).indexOf('trail:') === 0; }).map(function(k){ return store.del(k); }));

      }).then(function(){

      });
    }).catch(function(){ toast('That file is not a Shot Tracker backup.'); });
  };
  el.querySelector('#close').onclick = function(){ closeSheet(); };
}

/* ---------- offline maps ---------- */
/* Standard Web Mercator tile math (the scheme both USGS and Mapbox use). */
function lng2x(lng, z){ return Math.floor((lng + 180) / 360 * Math.pow(2, z)); }
function lat2y(lat, z){ var r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z)); }
function tilesFor(b, zmin, zmax){
  var out = [];
  for (var z = zmin; z <= zmax; z++){
    var x0 = lng2x(b.w, z), x1 = lng2x(b.e, z), y0 = lat2y(b.n, z), y1 = lat2y(b.s, z);
    for (var x = x0; x <= x1; x++) for (var y = y0; y <= y1; y++) out.push([z, x, y]);
  }
  return out;
}
window.__tilesFor = tilesFor;
function mb(bytes){ return (bytes / 1048576).toFixed(1) + ' MB'; }
function areaSrc(a){ return SOURCES[a.src || 'usgs']; }
function daysLeft(a){ var s = areaSrc(a); return s.ttl ? Math.max(0, Math.ceil((a.t + s.ttl - Date.now()) / 86400000)) : null; }
var offlineOK = ('caches' in window) && ('serviceWorker' in navigator) && window.isSecureContext;
var dl = null; // active download {cancel}

function registerSW(){
  if (!offlineOK) return;
  navigator.serviceWorker.register('sw.js').catch(function(){ offlineOK = false; });
}

function downloadArea(srcName, b, onProgress){
  var src = SOURCES[srcName], tiles = tilesFor(b, src.zmin, src.zmax), i = 0, done = 0, ok = 0, bytes = 0, netErr = 0, httpErr = 0;
  var stamp = String(Date.now());
  dl = {cancel:false};
  var mine = dl;
  return caches.open(src.cache).then(function(cache){
    function worker(){
      if (mine.cancel || i >= tiles.length) return Promise.resolve();
      var t = tiles[i++], key = src.key(t[0], t[1], t[2]);
      return cache.match(key).then(function(hit){
        if (hit && !src.ttl) return hit.blob(); // expiring sources are always refetched so every tile gets a fresh 30-day clock
        // cache:'reload' tells our service worker to go to the network, so a re-save really refetches
        return fetch(src.url(t[0], t[1], t[2]), {mode:'cors', cache:src.ttl ? 'reload' : 'default'}).then(function(res){
          if (!res.ok){ httpErr++; return null; }
          return res.blob().then(function(bl){
            var stored = new Response(bl, {headers:{'Content-Type':res.headers.get('Content-Type') || 'image/jpeg', 'X-Saved-At':stamp}});
            return cache.put(key, stored).then(function(){ return bl; });
          });
        });
      }).then(function(bl){ if (bl){ ok++; bytes += bl.size; } })
        .catch(function(){ netErr++; })
        .then(function(){ done++; onProgress(done, tiles.length, bytes); return worker(); });
    }
    var ws = []; for (var k = 0; k < 6; k++) ws.push(worker());
    return Promise.all(ws);
  }).then(function(){
    if (dl === mine) dl = null;
    return {cancelled:mine.cancel, total:tiles.length, ok:ok, bytes:bytes, netErr:netErr, httpErr:httpErr};
  });
}
function now(){ return Date.now(); }

function deleteAreaTiles(area){
  var src = areaSrc(area), keep = {};
  S.offlineAreas.forEach(function(a){
    if (a.id !== area.id && areaSrc(a) === src) tilesFor(a.b, a.zmin, a.zmax).forEach(function(t){ keep[src.key(t[0], t[1], t[2])] = 1; });
  });
  return caches.open(src.cache).then(function(c){
    return Promise.all(tilesFor(area.b, area.zmin, area.zmax).map(function(t){ return src.key(t[0], t[1], t[2]); })
      .filter(function(k){ return !keep[k]; }).map(function(k){ return c.delete(k); }));
  });
}

/* Remove saved areas whose source has an expiry (Mapbox: 30 days). */
function purgeExpired(){
  if (!offlineOK) return Promise.resolve([]);
  var expired = S.offlineAreas.filter(function(a){ var s = areaSrc(a); return s.ttl && now() - a.t >= s.ttl; });
  return expired.reduce(function(p, a){
    return p.then(function(){ return deleteAreaTiles(a); }).then(function(){
      S.offlineAreas = S.offlineAreas.filter(function(x){ return x.id !== a.id; });
    });
  }, Promise.resolve()).then(function(){
    if (expired.length){ save(); toast('Saved Mapbox imagery for ' + expired.map(function(a){ return a.name; }).join(', ') + ' reached 30 days and was removed. Save it again before you play.', 6000); }
    return expired;
  });
}
window.__purgeExpired = purgeExpired;

function openOffline(){
  if (!offlineOK){
    openSheet('<h3>Offline maps</h3><div class="note">Offline maps need this page opened over https:// in a browser that supports service workers.</div><div class="stack"><button class="btn ghost" id="close">Close</button></div>');
    $('#close').onclick = function(){ closeSheet(); }; return;
  }
  var st = S.settings;
  var srcName = st.basemap === 'mapbox' && st.mapboxToken ? 'mapbox' : 'usgs';
  var el = openSheet(
    '<h3>Offline maps</h3>' +
    '<div class="sub">Saves satellite imagery for the area on your screen, so the map works with no signal. GPS and shot tracking do not need a data signal.</div>' +
    '<div id="areas"></div>' +
    '<div id="prog" class="note" hidden></div>' +
    '<div class="stack"><button class="btn pri" id="saveArea">Save area on screen (' + SOURCES[srcName].label + ')</button><button class="btn danger" id="cancelDl" hidden>Stop download</button></div>' +
    '<div class="note" id="usage"></div>' +

    '</div>' +
    '<div class="stack"><button class="btn ghost" id="clearAll">Delete all saved imagery</button><button class="btn ghost" id="close">Close</button></div>');
  function usage(){
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function(e){
      var u = el.querySelector('#usage'); if (u) u.textContent = 'This app is using ' + mb(e.usage || 0) + ' of phone storage' + (e.quota ? ' (browser allows up to ' + mb(e.quota) + ').' : '.');
    });
  }
  function drawAreas(){
    var box = el.querySelector('#areas');
    if (!box) return;
    if (!S.offlineAreas.length){ box.innerHTML = '<div class="note">No saved areas yet.</div>'; return; }
    box.innerHTML = '<div class="rlist">' + S.offlineAreas.map(function(a, idx){
      var d = daysLeft(a);
      return '<div class="ritem"><div class="rt">' + esc(a.name) + ' <span class="tag">' + areaSrc(a).label.toUpperCase() + '</span></div><div class="rs">' + niceDate(a.t) + ' · ' + a.ok + ' of ' + a.total + ' tiles · ' + mb(a.bytes) +
        (d != null ? ' · expires in ' + d + ' day' + (d === 1 ? '' : 's') : '') + '</div>' +
        '<div class="rb"><button data-a="view" data-i="' + idx + '">Show</button><button data-a="del" data-i="' + idx + '">Delete</button></div></div>';
    }).join('') + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('button'), function(bt){
      bt.onclick = function(){
        var a = S.offlineAreas[+bt.dataset.i];
        if (bt.dataset.a === 'view'){
          follow = false; closeSheet(true); map.fitBounds([[a.b.s, a.b.w], [a.b.n, a.b.e]], {padding:fitPadding()});
          var want = a.src === 'mapbox' && S.settings.mapboxToken ? 'mapbox' : 'usgs';
          if (S.settings.basemap !== want){ S.settings.basemap = want; save(); setBase(); }
          return;
        }
        if (!confirm('Delete saved imagery for ' + a.name + '?')) return;

  }
  el.querySelector('#close').onclick = function(){ closeSheet(); };
  el.querySelector('#clearAll').onclick = function(){

    Promise.all(Object.keys(SOURCES).map(function(k){ return caches.delete(SOURCES[k].cache); }))

  el.querySelector('#saveArea').onclick = function(){
    if (dl){ toast('A download is already running.'); return; }
    if (!navigator.onLine){ toast('You need a data or Wi-Fi connection to save an area.'); return; }
    var src = SOURCES[srcName];
    var bb = map.getBounds(), b = {n:bb.getNorth(), s:bb.getSouth(), e:bb.getEast(), w:bb.getWest()};
    var n = tilesFor(b, src.zmin, src.zmax).length;

    var r = active();
    var name = prompt('Name this area (' + n + ' ' + src.label + ' tiles)', (r && r.course) || 'Course');
    if (name === null) return;
    name = name.trim() || 'Course';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
    var prog = el.querySelector('#prog'), sv = el.querySelector('#saveArea'), cn = el.querySelector('#cancelDl');
    prog.hidden = false; sv.hidden = true; cn.hidden = false;
    downloadArea(srcName, b, function(d, t, by){ prog.textContent = 'Downloading ' + d + ' of ' + t + ' tiles · ' + mb(by); }).then(function(res){
      prog.hidden = true; sv.hidden = false; cn.hidden = true;
      if (res.ok === 0){
        toast(res.netErr ? 'Download failed: no connection, or the imagery server refused the request.' : (res.httpErr ? 'The imagery server rejected the request' + (srcName === 'mapbox' ? ' (check the Mapbox token).' : '.') : 'Nothing was saved.'), 5000);
        return;
      }
      S.offlineAreas.unshift({id:uid(), src:srcName, name:name, b:b, zmin:src.zmin, zmax:src.zmax, total:res.total, ok:res.ok, bytes:res.bytes, t:Date.now()});
      save(); drawAreas(); usage();
      var miss = res.total - res.ok;
      toast((res.cancelled ? 'Stopped. ' : 'Saved. ') + res.ok + ' tiles, ' + mb(res.bytes) + (miss ? ' (' + miss + ' not saved)' : ''), 4500);
    });
  };
  purgeExpired().then(drawAreas); usage();
}
