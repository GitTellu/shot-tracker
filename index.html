function roundStats(r){
  var played = r.holes.filter(holePlayed);
  var st = {holes:[], strokes:0, par:0, toPar:null, allPar:true, putts:0, one:0, three:0,
            pen:0, bunk:0, eagle:0, birdie:0, parN:0, bogey:0, dbl:0,
            longDrive:null, longPutt:null, best:null, date:r.started, course:r.course || 'Untitled course'};
  played.forEach(function(h){
    var v = holeScore(h), par = courseParFor(r, h), c = cardOf(h);

    if (v != null) st.strokes += v;

    var pc = puttCount(h);

    }
    if (c) c.putts.forEach(function(pt){
      if (pt.out === 'In' && pt.ft != null && (!st.longPutt || pt.ft > st.longPutt.ft)) st.longPutt = {ft:pt.ft, n:h.n};
    });

  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  var pad = Math.max(8, (hi - lo) * 0.12); lo = Math.max(0, lo - pad); hi = hi + pad;
  var at = function(v){ return x0 + ((v - lo) / ((hi - lo) || 1)) * w; };
  var m = med(vals);
  var out = '<line x1="' + x0 + '" y1="' + y + '" x2="' + (x0 + w) + '" y2="' + y + '" stroke="' + CARD.line + '" stroke-width="2"/>';
  vals.forEach(function(v){ out += '<circle cx="' + at(v).toFixed(1) + '" cy="' + y + '" r="9" fill="' + accent + '" fill-opacity="0.55"/>'; });
  out += '<line x1="' + at(m).toFixed(1) + '" y1="' + (y - 28) + '" x2="' + at(m).toFixed(1) + '" y2="' + (y + 28) + '" stroke="' + CARD.ink + '" stroke-width="3"/>' +
    '<text x="' + at(m).toFixed(1) + '" y="' + (y - 40) + '" text-anchor="middle" class="tick">' + r0(m) + unit + '</text>' +
    '<text x="' + x0 + '" y="' + (y + 50) + '" class="tick">' + r0(Math.min.apply(null, vals)) + '</text>' +
    '<text x="' + (x0 + w) + '" y="' + (y + 50) + '" text-anchor="end" class="tick">' + r0(Math.max.apply(null, vals)) + unit + '</text>';

/* Every hole as its own little drawing: the shots turned so the hole plays left to right, which
   is the shape of how you actually played it rather than where it sits on the earth. */
function holeTrace(r, h, w, hgt){
  var g = courseGreenFor(r, h) || greenPos(h);
  var pts = h.shots.slice();
  if (g) pts = pts.concat([g]);
  if (pts.length < 2) return null;
  var o = pts[0], axis = g || pts[pts.length - 1];
  var A = toXY(o, axis), ang = Math.atan2(A.y, A.x), c = Math.cos(-ang), sn = Math.sin(-ang);
  var xy = pts.map(function(p){ var q = toXY(o, p); return {x:q.x * c - q.y * sn, y:q.x * sn + q.y * c}; });
  var xs = xy.map(function(q){ return q.x; }), ys = xy.map(function(q){ return q.y; });
  var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
  var y0 = Math.min.apply(null, ys), y1 = Math.max.apply(null, ys);
  var k = Math.min(w / Math.max(x1 - x0, 1), hgt / Math.max(y1 - y0, 1));
  var ox = (w - (x1 - x0) * k) / 2 - x0 * k, oy = (hgt - (y1 - y0) * k) / 2 + y1 * k;
  return {p:xy.map(function(q){ return {x:q.x * k + ox, y:oy - q.y * k}; }), hasGreen:!!g, yards:yd(distM(o, axis))};
}

    var meas = list.filter(function(x){ return x.d != null && !x.s.excluded; }).map(function(x){ return x.d; }).sort(function(a, b){ return a - b; });
    var med = meas.length ? meas[Math.floor((meas.length - 1) / 2)] : null;
    sum.textContent = list.length + ' shot' + (list.length === 1 ? '' : 's') +
      (meas.length ? ' · ' + meas.length + ' measured · median ' + r0(med) + ' yd · longest ' + r0(meas[meas.length - 1]) + ' yd' : ' · none measured yet') +
      (pick ? '' : ' · ' + all.filter(function(x){ return x.s.plan; }).length + ' with an aim set');
    var html = '', lastHole = null;
    list.forEach(function(x, idx){
      if (x.n !== lastHole){
        lastHole = x.n;
        var sc = holeScore(x.h);
        html += '<div class="hd">Hole ' + x.n + (sc != null && x.h.green ? ' <span>· ' + sc + ' strokes</span>' : '') + '</div>';
      }
      var s2 = '';

      else if (x.aimYd != null) s2 = 'aim ' + r0(x.aimYd) + ' yd · where it finished is not recorded';
      var tags = [];
      // the two shapes of bad data this round taught us to look for
      if (x.d != null && x.d < 5 && x.si > 0) tags.push('same spot as the shot before');
      if (x.d != null && x.d > 400) tags.push('that distance looks wrong');
      if (x.s.lie) tags.push(x.s.lie);
      if (x.s.strike) tags.push(x.s.strike);
      if (x.s.miss && x.s.miss.length) tags.push('miss ' + x.s.miss.join(' + '));
      if (x.s.excluded) tags.push('excluded');
      if (x.s.moved) tags.push('moved by hand');
      if (x.s.weak) tags.push('weak GPS');
      if (x.s.stale) tags.push('old fix');
      tags.push('\u00b1' + r0(yd(x.s.acc || 0)) + ' yd');
      html += '<button class="sl' + (x.pr ? ' aimed' : '') + '" data-i="' + idx + '">' +
        '<span class="slh">' + x.n + '·' + (x.si + 1) + '</span><span class="slb">' +
        '<span class="sl1">' + (x.d == null ? '<span class="open">not measured</span>' : '<span class="yd">' + r0(x.d) + ' yd</span>') +
        '  ' + esc(x.s.club || 'club not set') + '</span>' +
        (s2 ? '<span class="sl2' + (x.pr && !x.pr.inside ? ' out' : '') + '">' + esc(s2) + '</span>' : '') +
        '<span class="sl3">' + esc(tags.join(' · ')) + '</span>' +
        '</span></button>';
    });
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('.sl'), function(b){
      b.onclick = function(){
        var x = list[+b.dataset.i];
        closeSheet(true);
        r.cur = x.hi; save(); renderHole(true);
        var pts = [[x.s.lat, x.s.lng]];
        if (x.s.plan) pts.push([x.s.plan.lat, x.s.plan.lng]);
        var e = shotEnd(x.h, x.si); if (e) pts.push([e.pt.lat, e.pt.lng]);
        if (pts.length > 1){ follow = false; map.fitBounds(pts, fitOpts(19)); }
        else map.setView(pts[0], 18);
        openShotEdit(x.h, x.si);
      };
    });
  }
  if (clubs.length > 1) chips($('#slClubs'), clubs, function(){ return pick; }, function(v){ pick = v; rows(); });
  rows();
  el.querySelector('#close').onclick = function(){ closeSheet(); };
}

/* ---------- the scorecard, filled in afterwards ----------
   Everything the round card needs, on one screen: par, score and putts for all eighteen. Par is
   what turns a score into a birdie or a bogey, so without it nothing on the card gets circled. */
function ensureCard(h){ if (!h.card) h.card = blankCard(); return h.card; }
function setParFor(r, h, v){
  var c = courseForRound(r);
  if (!c){
    c = {id:uid(), name:(r.course || '').trim() || 'Course', t:Date.now(), greens:{}, pars:{}};
    S.courses.push(c); r.courseId = c.id;
  }
  c.pars = c.pars || {};
  if (v) c.pars[h.n] = v; else delete c.pars[h.n];
}
function setPuttCount(h, n){
  var c = ensureCard(h);
  while (c.putts.length > n) c.putts.pop();
  while (c.putts.length < n) c.putts.push({ft:null, read:null, act:null, out:null});
  if (h.green) h.green.putts = c.putts.length;
}
function openScorecard(r){
  if (!r){ toast('No round open. Open one from Rounds first.'); return; }
  var el = openSheet(
    '<h3>Scorecard</h3>' +
    '<div class="sub">' + esc(r.course || 'This round') + ' \u00b7 tap a box, then use \u2212 and + . Par is what puts the circles and squares on your round card.</div>' +
    '<div class="scTot" id="scTot"></div><div id="scGrid"></div>' +
    '<div class="scedit" id="scEdit" hidden></div>' +
    '<div class="row"><button class="btn sec" id="scCard">Round card</button><button class="btn pri" id="close">Done</button></div>');

  var selK = null, selH = null;   // which box is being edited

  function val(h, k){
    if (k === 'par') return courseParFor(r, h);
    if (k === 'score') return holeScore(h);
    return puttCount(h);
  }
  function bump(h, k, d){
    if (k === 'par'){
      var p0 = courseParFor(r, h);
      setParFor(r, h, p0 == null ? (d > 0 ? 4 : 3) : Math.max(3, Math.min(6, p0 + d)));
    } else if (k === 'score'){
      var cur = holeScore(h);
      if (cur == null) cur = (courseParFor(r, h) || 4) - (d < 0 ? 0 : 1);
      ensureCard(h).score = Math.max(1, Math.min(20, cur + d));
    } else {
      setPuttCount(h, Math.max(0, Math.min(9, puttCount(h) + d)));
    }
    save();
  }
  /* A score carries its shape the way it does on a real card: round under par, square over. */
  function shape(h){
    var par = courseParFor(r, h), v = holeScore(h);
    if (par == null || v == null) return '';
    var d = v - par;
    return d <= -2 ? ' e2' : d === -1 ? ' e1' : d === 1 ? ' b1' : d >= 2 ? ' b2' : '';
  }
  function cell(hi, k){
    var h = r.holes[hi], v = val(h, k);
    var sel = (selK === k && selH === hi) ? ' sel' : '';
    return '<button class="sccell' + (k === 'score' ? shape(h) : '') + sel + '" data-k="' + k + '" data-h="' + hi + '">' +
      // putts live on the green when a hole was finished without a card, so ask whether the
      // hole was played rather than whether a card exists
      (v == null || (k === 'putts' && !holePlayed(h)) ? '\u2013' : v) + '</button>';
  }
  function block(idxs, label){
    if (!idxs.length) return '';
    function row(k, name, tot){
      return '<div class="scr"><div class="scl">' + name + '</div>' +
        idxs.map(function(hi){ return cell(hi, k); }).join('') +
        '<div class="sct">' + (tot == null ? '\u2013' : tot) + '</div></div>';
    }
    var par = 0, sc = 0, pu = 0, anyPar = false, anySc = false;
    idxs.forEach(function(hi){
      var h = r.holes[hi], p = courseParFor(r, h), v = holeScore(h);
      if (p != null){ par += p; anyPar = true; }
      if (v != null){ sc += v; anySc = true; }
      pu += puttCount(h);
    });
    return '<div class="scblk">' +
      '<div class="scr scr-h"><div class="scl">HOLE</div>' +
        idxs.map(function(hi){ return '<div class="scn">' + r.holes[hi].n + '</div>'; }).join('') +
        '<div class="sct">' + label + '</div></div>' +
      row('par', 'PAR', anyPar ? par : null) +
      row('score', 'SCORE', anySc ? sc : null) +
      row('putts', 'PUTTS', pu) +
      '</div>';
  }
  function drawEdit(){
    var box = $('#scEdit');
    if (selK == null){ box.hidden = true; return; }
    var h = r.holes[selH], v = val(h, selK);
    box.hidden = false;
    box.innerHTML = '<div class="sce-t">Hole ' + h.n + ' \u00b7 ' + selK.toUpperCase() +
      '<button class="link" id="sceMore">Details \u203a</button></div>' +
      '<div class="sce-r"><button id="sceDown" aria-label="Less">\u2212</button>' +
      '<b id="sceVal">' + (v == null ? '\u2013' : v) + '</b>' +
      '<button id="sceUp" aria-label="More">+</button></div>';
    box.querySelector('#sceDown').onclick = function(){ bump(h, selK, -1); draw(); };
    box.querySelector('#sceUp').onclick = function(){ bump(h, selK, 1); draw(); };
    box.querySelector('#sceMore').onclick = function(){
      closeSheet(true); r.cur = selH; save(); renderHole(true); openCard(h, 'edit');
    };
  }
  function draw(){
    var sc = roundScore(r), putts = roundPutts(r);
    $('#scTot').innerHTML = (sc.holes ? sc.strokes + (sc.toPar != null ? ' (' + (sc.toPar > 0 ? '+' : '') + sc.toPar + ')' : '') : '\u2014') +
      ' <span>\u00b7 ' + sc.holes + ' hole' + (sc.holes === 1 ? '' : 's') + ' \u00b7 ' + putts + ' putts' +
      (sc.holes && sc.parHoles < sc.holes ? ' \u00b7 par missing on ' + (sc.holes - sc.parHoles) : '') + '</span>';
    var front = [], back = [];
    r.holes.forEach(function(h, hi){ (h.n <= 9 ? front : back).push(hi); });
    $('#scGrid').innerHTML = block(front, 'OUT') + block(back, 'IN');
    Array.prototype.forEach.call(el.querySelectorAll('#scGrid .sccell'), function(b){
      b.onclick = function(){ selK = b.dataset.k; selH = +b.dataset.h; draw(); };
    });
    drawEdit();
  }
  draw();
  el.querySelector('#scCard').onclick = function(){ closeSheet(true); openSummary(r); };
  el.querySelector('#close').onclick = function(){ closeSheet(); };
}
window.__openScorecard = openScorecard;

/* ---------- ending a round ----------
   Until a round is ended the app keeps dropping a breadcrumb every minute whenever it is open,
   which is how a drive home ends up in a round. Ending stops that, stops anything else being
   added, and shows you the card. */
function endRound(r){
  if (!r) return false;
  if (r.ended){ toast('That round has already been ended.'); return false; }
  var open = r.holes.filter(function(h){ return h.shots.length && !h.green; }).length;
  if (!confirm('End this round?' +
      (open ? '\n\n' + open + ' hole' + (open === 1 ? ' has' : 's have') + ' no score yet. You can still fill ' +
              (open === 1 ? 'it' : 'them') + ' in afterwards from the Scorecard.' : '') +
      '\n\nThe app stops following you and stops adding to this round.')) return false;
  r.ended = Date.now();
  if (S.playingId === r.id) S.playingId = null;
  if (plan) endPlan(true);
  if (trailDirty){ trailDirty = false; saveTrail(r); }
  save(); renderHole(false);
  openSummary(r);
  return true;
}
function resumeRound(r, quiet){
  if (!r) return;
  delete r.ended;
  S.playingId = r.id; r.lastAt = Date.now();
  save(); renderHole(false);
  if (!quiet) toast('Round picked back up');
}
window.__endRound = endRound; window.__resumeRound = resumeRound;
function download(name, text, type){
  var blob = new Blob([text], {type:type}), a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

/* ---------- rounds ---------- */
function roundSummary(r){
  var sc = roundScore(r), putts = roundPutts(r);
  var shots = r.holes.reduce(function(t, h){ return t + h.shots.length; }, 0);
  return sc.holes + ' hole' + (sc.holes === 1 ? '' : 's') +
    (sc.strokes ? ' · ' + sc.strokes + ' strokes' + (sc.toPar != null ? ' (' + (sc.toPar > 0 ? '+' : '') + sc.toPar + ')' : '') : '') +
    (putts ? ' · ' + putts + ' putts' : '') +
    ' · ' + shots + ' shot' + (shots === 1 ? '' : 's') + ' logged';
}

/* ---------- settings ---------- */
/* System by default, because a phone already knows whether it is night. The override is there
   for the one round played in bright sun where light wins whatever the phone thinks. */
function darkNow(mode){
  if (mode === 'dark') return true;
  if (mode === 'light') return false;
  return !!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
}
function applyTheme(mode){
  mode = mode || 'system';
  var el = document.documentElement;
  if (mode === 'system') el.removeAttribute('data-theme'); else el.setAttribute('data-theme', mode);
  var m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', darkNow(mode) ? '#0A0E0C' : '#0f5132');
}
window.__applyTheme = applyTheme; window.__darkNow = darkNow;
if (window.matchMedia){
  var mq = window.matchMedia('(prefers-color-scheme: dark)');
  var onScheme = function(){ if (!S || !S.settings || (S.settings.theme || 'system') === 'system') applyTheme('system'); };
  if (mq.addEventListener) mq.addEventListener('change', onScheme); else if (mq.addListener) mq.addListener(onScheme);
}

/* ---------- offline maps ---------- */
/* Standard Web Mercator tile math (the scheme both USGS and Mapbox use). */
function lng2x(lng, z){ return Math.floor((lng + 180) / 360 * Math.pow(2, z)); }
function lat2y(lat, z){ var r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z)); }

  var out = [];
  for (var z = zmin; z <= zmax; z++){
    var x0 = lng2x(b.w, z), x1 = lng2x(b.e, z), y0 = lat2y(b.n, z), y1 = lat2y(b.s, z);
    for (var x = x0; x <= x1; x++) for (var y = y0; y <= y1; y++) out.push([z, x, y]);
  }
  return out;
}
window.__tilesFor = tilesFor;
function mb(bytes){ return (bytes / 1048576).toFixed(1) + ' MB'; }
function areaSrc(a){ return srcFor(a.src || 'usgs'); }

/* ---------- finding sharper imagery ---------- */
/* Ground resolution of one pixel at this latitude, which is what "sharper" actually means.
   256 px tiles, so zoom 20 is about 11 cm a pixel in Colorado and zoom 16 about 1.8 m. */
function mPerPx(z, lat){ return 156543.03392 * Math.cos(lat * Math.PI / 180) / Math.pow(2, z); }

  var m = mPerPx(z, lat);
  return m < 1 ? Math.round(m * 100) + ' cm a pixel' : m.toFixed(1) + ' m a pixel';
}

/* A tile server outside its coverage usually answers 200 with a blank image rather than an
   error, so a status code proves nothing. This draws the tile and looks at it: if every
   sampled pixel is the same colour, or the whole thing is transparent, there is no imagery
   there. Fetched as a blob first, so the canvas stays untainted and readable. */
function tileLooksReal(blob){
  if (!blob || blob.size < 700) return Promise.resolve(false);   // blank JPEG/PNG tiles are tiny
  return new Promise(function(res){
    var url = URL.createObjectURL(blob), img = new Image();
    img.onload = function(){
      try {
        var n = 24, c = document.createElement('canvas');
        c.width = n; c.height = n;
        var x = c.getContext('2d');
        x.drawImage(img, 0, 0, n, n);
        var d = x.getImageData(0, 0, n, n).data, opaque = 0, first = -1, varied = false;
        for (var i = 0; i < d.length; i += 4){
          if (d[i+3] < 8) continue;
          opaque++;

          if (first < 0) first = v; else if (v !== first) varied = true;
        }
        res(opaque > n * n * 0.5 && varied);

      URL.revokeObjectURL(url);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); res(false); };

/* One tile, fetched the same way the offline download will fetch it. mode:'cors' matters:
   if the server sends no CORS header the fetch rejects here, which is exactly what we want
   to know, because cache.put() refuses an opaque response and the course could never be
   saved for offline play. */

    if (!r.ok) return {ok:false, why:'http ' + r.status};
    return r.blob().then(function(b){
      return tileLooksReal(b).then(function(real){
        return real ? {ok:true, bytes:b.size} : {ok:false, why:'no imagery here'};
      });
    });
  }).catch(function(){ return {ok:false, why:'blocked or offline'}; });

/* Walks down from the deepest zoom the service claims until a tile at the course really
   has imagery in it. That top number is the whole point: it is the difference between a
   sharp course and a blurry one, and services routinely advertise more than they hold. */
function probeSource(tpl, topZ, lat, lng){

    return probeTile(tpl, z, lat, lng).then(function(r){
      if (r.ok) return {ok:true, zmax:z, bytes:r.bytes};
      if (r.why === 'blocked or offline' && z === Math.min(topZ, 21)) return {ok:false, why:r.why};
      z--; return step();

   grid the map uses, and reads the deepest zoom each one holds. */

function downloadArea(srcName, b, onProgress){
  var src = srcFor(srcName), tiles = tilesFor(b, src.zmin, src.zmax), i = 0, done = 0, ok = 0, bytes = 0, netErr = 0, httpErr = 0;
  var stamp = String(Date.now());

    function worker(){

        .catch(function(){ netErr++; })
        .then(function(){ done++; onProgress(done, tiles.length, bytes); return worker(); });

  });

    return Promise.all(tilesFor(area.b, area.zmin, area.zmax).map(function(t){ return src.key(t[0], t[1], t[2]); })

  return expired.reduce(function(p, a){

    });

    if (expired.length){ save(); toast('Saved Mapbox imagery for ' + expired.map(function(a){ return a.name; }).join(', ') + ' reached 30 days and was removed. Save it again before you play.', 6000); }
    return expired;

/* Works through one agency's REST root and reports back anything that actually has this
   course in it. Names are only a hint, so the filter is generous and the tile decides. */
function discoverServer(srv, lat, lng, onFound, onStatus){
  onStatus('Asking ' + srv.label + '\u2026');
  return agsCatalog(srv.root).then(function(urls){
    if (!urls.length){ onStatus(srv.label + ': ' + (srv.guess ? 'no server at the address the app tries.' : 'nothing published there, or it refuses browser requests.')); return; }
    var named = urls.filter(looksImagery);
    var look = (named.length ? named : urls).slice(0, 8);
    onStatus(srv.label + ': checking ' + look.length + ' of ' + urls.length + ' services\u2026');
    return look.reduce(function(p, u){
      return p.then(function(){
        return agsTiled(u).then(function(t){
          if (!t) return;
          return probeSource(t.tpl, t.topZ, lat, lng).then(function(r){
            if (r.ok) onFound({label:srv.label + ' \u2014 ' + t.name, tpl:t.tpl, zmax:r.zmax,
              attribution:'Imagery: ' + esc(srv.label)});

    }, Promise.resolve());
  }).catch(function(){ onStatus(srv.label + ': ' + (srv.guess ? 'no server at the address the app tries.' : 'could not be reached from the browser.')); });

/* Sharper imagery: find it, prove it covers the course, then let it be saved like any other

    '<div id="found"></div>' +

    '<div class="note">An ArcGIS MapServer or ImageServer address, or a tile pattern with {z}/{x}/{y} in it. County and city GIS or open-data pages publish these: for the two counties north of Denver, look at Adams County GIS and Broomfield\u2019s open data site. The map only keeps it if a tile really comes back for this course.</div>' +
    '<div class="stack"><button class="btn" id="addUrl">Test this address</button></div>' +
    '<div class="stack"><button class="btn ghost" id="close">Close</button></div>');

  var statusEl = el.querySelector('#status'), resEl = el.querySelector('#results');
  function status(t){ statusEl.hidden = false; statusEl.textContent = t; }
  function use(rec){
    S.settings.localSources.unshift(rec);
    S.settings.basemap = 'local:' + rec.id;
    save(); setBase(); drawFound();
    toast(rec.label + ' is now the map, down to ' + resLabel(rec.zmax, lat) + '.', 5000);
  }
  function drawFound(){
    var box = el.querySelector('#found'), list = localList();
    if (!list.length){ box.innerHTML = ''; return; }
    box.innerHTML = '<div class="mlab">Imagery you have added</div><div class="rlist">' + list.map(function(x, i){
      var on = S.settings.basemap === 'local:' + x.id;
      return '<div class="ritem"><div class="rt">' + esc(x.label) + (on ? ' <span class="tag">IN USE</span>' : '') + '</div>' +
        '<div class="rs">to zoom ' + x.zmax + ' \u00b7 ' + resLabel(x.zmax, lat) + '</div>' +
        '<div class="rb"><button data-a="use" data-i="' + i + '">Use</button><button data-a="del" data-i="' + i + '">Remove</button></div></div>';
    }).join('') + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('button'), function(b){
      b.onclick = function(){
        var x = localList()[+b.dataset.i];
        if (b.dataset.a === 'use'){ S.settings.basemap = 'local:' + x.id; save(); setBase(); drawFound(); toast(x.label, 3000); return; }
        if (!confirm('Remove ' + x.label + '? Any imagery saved from it is deleted too.')) return;
        var areas = S.offlineAreas.filter(function(a){ return a.src === 'local:' + x.id; });
        areas.reduce(function(p, a){ return p.then(function(){ return deleteAreaTiles(a); }); }, Promise.resolve()).then(function(){
          S.offlineAreas = S.offlineAreas.filter(function(a){ return a.src !== 'local:' + x.id; });
          S.settings.localSources = localList().filter(function(y){ return y.id !== x.id; });
          if (S.settings.basemap === 'local:' + x.id) S.settings.basemap = 'usgs';
          save(); setBase(); drawFound();
        });
      };
    });
  }
  function addResult(f){
    var id = uid();
    var row = document.createElement('div');
    row.className = 'ritem';
    row.innerHTML = '<div class="rt">' + esc(f.label) + '</div><div class="rs">to zoom ' + f.zmax + ' \u00b7 ' +
      resLabel(f.zmax, lat) + ' \u00b7 can be saved offline</div><div class="rb"><button>Use this</button></div>';
    row.querySelector('button').onclick = function(){
      if (findLocal(id)) return;
      use({id:id, label:f.label, tpl:f.tpl, zmax:f.zmax, attribution:f.attribution, t:Date.now()});
    };
    if (!resEl.firstChild) resEl.innerHTML = '<div class="mlab">Found at this course</div><div class="rlist" id="rl"></div>';
    (el.querySelector('#rl') || resEl).appendChild(row);
  }

  el.querySelector('#scan').onclick = function(){
    if (busy) return;
    busy = true; resEl.innerHTML = '';
    var n = 0, seen = {};
    function found(f){ if (seen[f.tpl]) return; seen[f.tpl] = 1; n++; addResult(f); }
    status('Asking what imagery is published over this spot\u2026');
    // the catalogue first, because it needs no knowledge of who flies this county
    agolNearby(lat, lng).then(function(items){
      status(items.length ? 'Checking ' + items.length + ' published layer' + (items.length === 1 ? '' : 's') + '\u2026'
                          : 'The catalogue lists none here. Trying known servers\u2026');
      return items.slice(0, 10).reduce(function(p, it){
        return p.then(function(){
          return agsTiled(it.url).then(function(t){
            if (!t) return;
            return probeSource(t.tpl, t.topZ, lat, lng).then(function(r){
              if (r.ok) found({label:it.label, tpl:t.tpl, zmax:r.zmax, attribution:'Imagery: ' + esc(it.label)});
            });
          }).catch(function(){});
        });
      }, Promise.resolve());
    }).then(function(){
      return IMAGERY_SERVERS.reduce(function(p, srv){
        return p.then(function(){ return discoverServer(srv, lat, lng, found, status); });
      }, Promise.resolve());
    }).then(function(){
      busy = false;
      status(n ? n + ' source' + (n === 1 ? ' covers' : 's cover') + ' this course.'
               : 'Nothing published covers this spot, or the servers that hold it will not answer a browser. Paste your county GIS tile address below instead.');
    });
  };
  el.querySelector('#addUrl').onclick = function(){
    if (busy) return;
    var u = el.querySelector('#url').value.trim().replace(/\/$/, '');
    if (!u) return;
    busy = true;
    if (u.indexOf('{z}') >= 0){
      status('Testing that address at this course\u2026');
      probeSource(u, 21, lat, lng).then(function(pr){
        busy = false;
        if (!pr.ok){ status('No imagery came back for this course (' + pr.why + ').'); return; }
        status('');
        addResult({label:'Pasted address', tpl:u, zmax:pr.zmax, attribution:'Imagery: pasted source'});
      });
      return;
    }
    status('Reading that service\u2026');
    agsTiled(u).then(function(t){
      if (!t){ busy = false; status('That address is not a cached tile service in the map\u2019s grid. It may still work pasted as a {z}/{x}/{y} pattern.'); return; }
      return probeSource(t.tpl, t.topZ, lat, lng).then(function(pr){
        busy = false;
        if (!pr.ok){ status('The service answered, but has no imagery at this course (' + pr.why + ').'); return; }
        status('');
        addResult({label:t.name, tpl:t.tpl, zmax:pr.zmax, attribution:'Imagery: ' + esc(t.name)});
      });
    }).catch(function(){ busy = false; status('That address could not be reached from the browser.'); });
  };
  el.querySelector('#close').onclick = function(){ closeSheet(); };
  drawFound();
}

function openOffline(){
  if (!offlineOK){
    openSheet('<h3>Offline maps</h3><div class="note">Offline maps need this page opened over https:// in a browser that supports service workers.</div><div class="stack"><button class="btn ghost" id="close">Close</button></div>');
    $('#close').onclick = function(){ closeSheet(); }; return;
  }
  var st = S.settings;
  var localOn = st.basemap && st.basemap.indexOf('local:') === 0 && findLocal(st.basemap.slice(6));
  var srcName = localOn ? st.basemap : (st.basemap === 'mapbox' && st.mapboxToken ? 'mapbox' : 'usgs');
  var srcHere = srcFor(srcName);
  var el = openSheet(
    '<h3>Offline maps</h3>' +
    '<div class="sub">Saves satellite imagery for the area on your screen, so the map works with no signal. GPS and shot tracking do not need a data signal.</div>' +
    '<div id="areas"></div>' +
    '<div id="prog" class="note" hidden></div>' +
    '<div class="stack"><button class="btn pri" id="saveArea">Save area on screen (' + esc(srcHere.label) + ')</button><button class="btn danger" id="cancelDl" hidden>Stop download</button></div>' +
    '<div class="note" id="usage"></div>' +
    '<div class="note">How: zoom and pan so the whole course fills the screen, then tap Save. This saves the imagery shown on the map now: ' +
      (localOn ? esc(srcHere.label) + ' (zoom ' + srcHere.zmin + ' to ' + srcHere.zmax + '). Nothing expires this the way Mapbox expires its own, so saved once, this course stays sharp. USGS shows through anywhere the flight line did not reach, so save USGS as well.'
       : srcName === 'mapbox' ? 'Mapbox (zoom 14 to 19). Mapbox terms limit saved imagery to 30 days, so it is removed automatically after that. Fallback order is Mapbox, then OpenStreetMap (online only), then USGS, so save USGS too for an offline fallback that never expires.'
       : 'USGS (zoom 14 to 18).' + (st.basemap === 'osm' ? ' OpenStreetMap cannot be saved (its rules forbid offline downloads), so USGS is saved as the offline fallback.' : st.basemap === 'sat' ? ' Esri imagery cannot be saved (Esri only allows offline use through its native app toolkits), so USGS is saved as the offline fallback.' : '') + ' For something sharper that saves with no expiry, try Sharper imagery in the menu first.') +
    '</div>' +
    '<div class="stack"><button class="btn ghost" id="clearAll">Delete all saved imagery</button><button class="btn ghost" id="close">Close</button></div>');
  function usage(){
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function(e){
      var u = el.querySelector('#usage'); if (u) u.textContent = 'This app is using ' + mb(e.usage || 0) + ' of phone storage' + (e.quota ? ' (browser allows up to ' + mb(e.quota) + ').' : '.');
    });
  }
  function drawAreas(){
    var box = el.querySelector('#areas');
    if (!box) return;
    if (!S.offlineAreas.length){ box.innerHTML = '<div class="note">No saved areas yet.</div>'; return; }
    box.innerHTML = '<div class="rlist">' + S.offlineAreas.map(function(a, idx){
      var d = daysLeft(a);
      var tag = areaSrc(a).label.split('\u2014').pop().trim().slice(0, 18).toUpperCase();
      return '<div class="ritem"><div class="rt">' + esc(a.name) + ' <span class="tag">' + esc(tag) + '</span></div><div class="rs">' + niceDate(a.t) + ' · ' + a.ok + ' of ' + a.total + ' tiles · ' + mb(a.bytes) +
        (d != null ? ' · expires in ' + d + ' day' + (d === 1 ? '' : 's') : '') + '</div>' +
        '<div class="rb"><button data-a="view" data-i="' + idx + '">Show</button><button data-a="del" data-i="' + idx + '">Delete</button></div></div>';
    }).join('') + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('button'), function(bt){
      bt.onclick = function(){
        var a = S.offlineAreas[+bt.dataset.i];
        if (bt.dataset.a === 'view'){
          follow = false; closeSheet(true); map.fitBounds([[a.b.s, a.b.w], [a.b.n, a.b.e]], fitOpts());
          var want = a.src && a.src.indexOf('local:') === 0 && findLocal(a.src.slice(6)) ? a.src
                   : a.src === 'mapbox' && S.settings.mapboxToken ? 'mapbox' : 'usgs';
          if (S.settings.basemap !== want){ S.settings.basemap = want; save(); setBase(); }
          return;
        }
        if (!confirm('Delete saved imagery for ' + a.name + '?')) return;
        deleteAreaTiles(a).then(function(){ S.offlineAreas = S.offlineAreas.filter(function(x){ return x.id !== a.id; }); save(); drawAreas(); usage(); });
      };
    });
  }
  el.querySelector('#close').onclick = function(){ closeSheet(); };
  el.querySelector('#clearAll').onclick = function(){
    if (!confirm('Delete all saved map imagery from this phone? Rounds are not affected.')) return;
    Promise.all(Object.keys(SOURCES).map(function(k){ return SOURCES[k].cache; }).concat([LOCAL_CACHE]).map(function(c){ return caches.delete(c); }))
      .then(function(){ S.offlineAreas = []; save(); drawAreas(); usage(); toast('Saved imagery deleted'); });
  };
  el.querySelector('#cancelDl').onclick = function(){ if (dl) dl.cancel = true; };
  el.querySelector('#saveArea').onclick = function(){
    if (dl){ toast('A download is already running.'); return; }
    if (!navigator.onLine){ toast('You need a data or Wi-Fi connection to save an area.'); return; }
    var src = srcHere;
    var bb = map.getBounds(), b = {n:bb.getNorth(), s:bb.getSouth(), e:bb.getEast(), w:bb.getWest()};
    var n = tilesFor(b, src.zmin, src.zmax).length;
    // tiles run from about 8 KB of mown fairway to 60 KB of trees, so 26 KB is a fair middle
    var estMB = Math.max(1, Math.round(n * 26 / 1024));
    if (n > OFFLINE_MAX_TILES || estMB > OFFLINE_MAX_MB){
      toast('That area is about ' + n + ' tiles, roughly ' + estMB + ' MB (limit ' + OFFLINE_MAX_MB + ' MB). Zoom in so just the course fills the screen.', 5500); return;
    }
    var r = active();
    var name = prompt('Name this area (' + n + ' ' + src.label + ' tiles, about ' + estMB + ' MB)', (r && r.course) || 'Course');
    if (name === null) return;
    name = name.trim() || 'Course';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
    var prog = el.querySelector('#prog'), sv = el.querySelector('#saveArea'), cn = el.querySelector('#cancelDl');
    prog.hidden = false; sv.hidden = true; cn.hidden = false;
    downloadArea(srcName, b, function(d, t, by){ prog.textContent = 'Downloading ' + d + ' of ' + t + ' tiles · ' + mb(by); }).then(function(res){
      prog.hidden = true; sv.hidden = false; cn.hidden = true;
      if (res.ok === 0){
        toast(res.netErr ? 'Download failed: no connection, or the imagery server refused the request.' : (res.httpErr ? 'The imagery server rejected the request' + (srcName === 'mapbox' ? ' (check the Mapbox token).' : '.') : 'Nothing was saved.'), 5000);
        return;
      }
      S.offlineAreas.unshift({id:uid(), src:srcName, name:name, b:b, zmin:src.zmin, zmax:src.zmax, total:res.total, ok:res.ok, bytes:res.bytes, t:Date.now()});
      save(); drawAreas(); usage();
      var miss = res.total - res.ok;
      toast((res.cancelled ? 'Stopped. ' : 'Saved. ') + res.ok + ' tiles, ' + mb(res.bytes) + (miss ? ' (' + miss + ' not saved)' : ''), 4500);
    });
  };
  purgeExpired().then(drawAreas); usage();
}


/* ---------- about & tutorial ---------- */
function openGuide(){

  var el = openSheet(
    '<div class="guide">' +

    '<div class="sell">' +
      '<div class="card"><b>Two buttons, that is the app</b>PLAN the shot in front of you. RECORD the one you just hit. Your position is already averaged while you stand at the ball, so recording is instant and the map keeps the screen.</div>' +
      '<div class="card"><b>Your real numbers, not your best ones</b>Every shot is measured by GPS from where you hit it to where you hit the next one. Over a few rounds you get honest averages, medians and spread for every club in your bag.</div>' +
      '<div class="card"><b>Plan every shot</b>Drop a target on the map and see your dispersion drawn to scale: an arc off the tee, an oval into greens. Set each club\'s pattern to match your shot shape, like 15 yards left and 45 right for a fade.</div>' +
      '<div class="card"><b>The truth after the shot</b>When you reach your ball, the app tells you how far left or right, long or short you finished from your target, and whether it stayed inside your pattern. Your aim results build up club by club.</div>' +
      '<div class="card"><b>Works with no signal</b>The app and your saved course imagery live on your phone. GPS is a satellite signal, so tracking keeps working out where the cell bars disappear.</div>' +
      '<div class="card"><b>No sensors, no subscription, no account</b>Your rounds stay on your phone. Export every shot to a spreadsheet whenever you like.</div>' +

      '<li><b>Import your course.</b> Scroll the map to it, then ' + k('☰') + ' <i>Course</i>, <i>Import from OpenStreetMap</i>. Where volunteers have mapped it, that fills in every green, with its real shape for front and back yardages, and the tee boxes. The import says exactly what it found; place anything missing by hand.</li>' +

      '<li><b>Save your course.</b> At home on Wi-Fi: zoom so the course fills the screen, then ' + k('☰') + ' <i>Offline maps</i> and <i>Save area on screen</i>. That imagery shows even with no signal.</li>' +
    '</ol>' +

    '<h4>Playing a hole</h4>' +
    '<ol>' +
      '<li><b>Two buttons.</b> ' + k('PLAN', 'plan') + ' is for the shot you are about to hit. ' + k('RECORD', 'hit') + ' is for the shot you just hit. Nothing else takes up the screen.</li>' +

      '<li>' + k('☰') + ' <i>Club distances</i> shows your averages, medians and spread, plus aim results for planned shots. <i>Export</i> and <i>Backup</i> are in the same menu.</li>' +
      '<li>The map button cycles map types, and ' + k('◎') + ' re-centers on you.</li>' +
    '</ul>' +

    '<h4>Good to know</h4>' +
    '<div class="honest"><ul style="margin:0">' +
      '<li><b>GPS is good, not perfect.</b> Phones are typically accurate to about 5 meters (16 feet) in open sky, so any single distance can be a few yards off. The ± the app shows is the phone\'s own estimate, and real errors can be larger. Averages over many shots are where the value is. You can drag a marker to correct a bad one.</li>' +
      '<li><b>Distances are total, not carry.</b> They measure where the ball stopped, roll included.</li>' +
      '<li><b>Aim results use where the ball finished,</b> since that is where you hit your next shot from.</li>' +
      '<li><b>The screen can sleep between shots.</b> Phones pause GPS for web apps when the screen is off, so the breadcrumb trail has gaps then. Shots are captured at your ball when you tap, so they are not affected.</li>' +
      '<li><b>Your data lives on this phone only.</b> Use <i>Backup</i> now and then. It is a plain JSON file you own, and <i>Export</i> gives every shot as a spreadsheet.</li>' +

    '<div class="note" style="text-align:center">Version ' + APP_VERSION + '</div>' +
    '<div class="stack"><button class="btn pri" id="close">Let\'s play</button></div>' +
    '</div>');
  el.querySelector('#close').onclick = function(){ closeSheet(); };
}

/* Drag the grip down for more map, up to bring the line back. A tap does the same, so it
   works for anyone who does not think to drag it. */
(function(){
  var g = $('#grip'), y0 = null, moved = false;
  g.addEventListener('pointerdown', function(e){
    y0 = e.clientY; moved = false;
    if (g.setPointerCapture) { try { g.setPointerCapture(e.pointerId); } catch (err) {} }
  });
  g.addEventListener('pointermove', function(e){
    if (y0 == null) return;
    var dy = e.clientY - y0;
    if (Math.abs(dy) < 18) return;
    moved = true; y0 = null; setPeek(dy > 0);
  });
  g.addEventListener('pointerup', function(){
    if (y0 != null && !moved) setPeek(!S.settings.peek);
    y0 = null;
  });
  g.addEventListener('pointercancel', function(){ y0 = null; });
  g.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); setPeek(!S.settings.peek); }
  });
})();

  if (pm){ pmStep(1); return; }
  var r = active(); if (!r){ toast('Nothing to play yet: PLAN or RECORD starts a round.'); return; }
  if (nagUnfinished()) return;
  var h = curHole();
  if (r.cur < r.holes.length - 1) r.cur++;
  else { r.holes.push({n:nextN(h.n), shots:[], green:null}); r.cur = r.holes.length - 1; } // skipping holes is fine
  save(); renderHole(true);
};
$('#holeLabel').onclick = function(){ if (pm) openPlanPicker(); else openHolePicker(); };
$('#pmNext').onclick = function(){ if (pm) pmNext(); };
$('#pmClose').onclick = exitPlanMode;
$('#pmAdd').onclick = function(){ if (pm) pmAdd(); };
$('#pmDel').onclick = function(){ if (pm) pmDel(); };
$('#pmPlan').onclick = function(){ if (!pm) return; var c = pm.c, n = pm.n; exitPlanMode(true); openPlanList(c, n); };
$('#pmClubBtn').onclick = function(){ if (pm){ $('#pmClubs').hidden = !$('#pmClubs').hidden; layout(); } };
$('#pmPat').onclick = function(){
  if (!pm) return; var ph = planHoleOf(pm.c, pm.n, false); if (!ph || !ph.shots.length){ toast('Place a target first.'); return; }
  var s = ph.shots[pm.sel >= 0 ? pm.sel : ph.shots.length - 1];
  openPatternEdit(s.club);
};
$('#rotBtn').onclick = cycleRotation;
$('#tgtBtn').onclick = function(){ startPlaceGreen(false); };
$('#tgtSave').onclick = function(){ saveGreen(false); };
$('#tgtSweep').onclick = function(){ saveGreen(true); };
$('#tgtDone').onclick = endPlaceGreen;
$('#tgtPrev').onclick = function(){ placeStep(-1); };
$('#tgtNext').onclick = function(){ placeStep(1); };
// any finger on the map means hands off the zoom for a while
$('#mapWrap').addEventListener('pointerdown', function(){ mapTouchedAt = Date.now(); }, {passive:true, capture:true});
$('#centerBtn').onclick = function(){ follow = true; if (fix) map.setView([fix.lat, fix.lng], Math.max(map.getZoom(), 17)); else toast('Waiting for GPS'); };
$('#layerBtn').onclick = function(){
  var st = S.settings, order = localList().map(function(x){ return 'local:' + x.id; });
  if (st.mapboxToken) order.push('mapbox');
  if (st.arcgisKey) order.push('sat');
  order.push('osm', 'usgs');
  var i = order.indexOf(st.basemap);
  st.basemap = order[(i + 1) % order.length];
  save(); setBase();
  var rec = st.basemap.indexOf('local:') === 0 ? findLocal(st.basemap.slice(6)) : null;
  toast(rec ? rec.label + ' (offline in saved areas, no expiry)'
     : {mapbox:'Mapbox satellite (offline in saved areas, 30 days)', usgs:'USGS satellite (offline in saved areas)', osm:'OpenStreetMap (online only, saved USGS underneath)', sat:'Esri satellite (online only, OSM and USGS underneath)'}[st.basemap]);
};

/* ---------- boot ---------- */
function startApp(){
  booted = true;
  applyTheme(S.settings.theme); setBase(); applyPeek(); renderHole(true);
  startGPS(); registerSW(); purgeExpired(); keepAwake();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
}
window.__S = function(){ return S; }; window.__save = function(){ save(); };
window.__store = store;
window.__ready = store.open().then(function(mode){
  if (mode !== 'idb') return store.get('state');
  return store.get('state').then(function(st){ return st || migrateFromLocal(); });
}).then(function(st){ S = normalize(st); }).catch(function(){ S = defaults(); })
  .then(function(){ startApp(); return store.mode(); });
})();
</script>
