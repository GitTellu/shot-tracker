<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shot Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--g:#0B3B2A;--g2:#15734A;--g3:#E9F2EC;--gink:#0B3B2A;--ink:#0E1512;--ink2:#36423C;--mut:#69786F;
 --line:#DDE4DF;--line2:#EDF1EE;--bg:#EFF3F0;--srf:#FFFFFF;--srf2:#FFFFFF;--gold:#A8762A;--goldink:#9A6B22;--red:#B3261E;
 --orange:#ff9800;--warm:#FFF3E0;--warmink:#8A4B00;--warmline:#F3D9A4;--mapbg:#cfd8cf;
 --tint:#F3F5F3;--tint2:#F7F9F7;--tint3:#FBFDFB;--dangerbg:#FDECEA;--dangerline:#F0B9B4;--grip:#D6DED9;--secact:#DCEAE1;--okline:#BCD7C6;--float:rgba(255,255,255,.96);--floatq:rgba(255,255,255,.66);
 --r1:10px;--r2:14px;--r3:18px;--r4:26px;
 --sh1:0 1px 2px rgba(11,59,42,.07),0 2px 8px rgba(11,59,42,.07);
 --sh2:0 2px 8px rgba(11,59,42,.10),0 16px 34px rgba(11,59,42,.18);
 --ease:cubic-bezier(.2,.8,.2,1)}
/* Dark is a real second skin, not a filter: surfaces lift with light rather than sinking,
   the brand green brightens so it still reads as green on a dark ground, and the map keeps
   its own colours because the course is the one thing that should not be recoloured. */
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --g:#0E4D36;--g2:#1E8A5A;--g3:#15251E;--gink:#6FD29E;--ink:#E9F0EB;--ink2:#B4C2BA;--mut:#8A978F;
 --line:#2A342E;--line2:#212A25;--bg:#0A0E0C;--srf:#141A17;--srf2:#1B231E;--gold:#D9A85C;--goldink:#E0B268;--red:#F0857B;
 --orange:#FFA726;--warm:#2A1F10;--warmink:#F2C88A;--warmline:#4A3A1C;--mapbg:#101512;
 --tint:#1F2823;--tint2:#1A221D;--tint3:#17201A;--dangerbg:#31191A;--dangerline:#5C2F2C;--grip:#3A453E;--secact:#1D3B2C;--okline:#2E5742;--float:rgba(22,28,25,.94);--floatq:rgba(16,21,18,.72);
 --sh1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.34);
 --sh2:0 2px 8px rgba(0,0,0,.45),0 16px 34px rgba(0,0,0,.5)}}
:root[data-theme="dark"]{
 --g:#0E4D36;--g2:#1E8A5A;--g3:#15251E;--gink:#6FD29E;--ink:#E9F0EB;--ink2:#B4C2BA;--mut:#8A978F;
 --line:#2A342E;--line2:#212A25;--bg:#0A0E0C;--srf:#141A17;--srf2:#1B231E;--gold:#D9A85C;--goldink:#E0B268;--red:#F0857B;
 --orange:#FFA726;--warm:#2A1F10;--warmink:#F2C88A;--warmline:#4A3A1C;--mapbg:#101512;
 --tint:#1F2823;--tint2:#1A221D;--tint3:#17201A;--dangerbg:#31191A;--dangerline:#5C2F2C;--grip:#3A453E;--secact:#1D3B2C;--okline:#2E5742;--float:rgba(22,28,25,.94);--floatq:rgba(16,21,18,.72);
 --sh1:0 1px 2px rgba(0,0,0,.4),0 2px 8px rgba(0,0,0,.34);
 --sh2:0 2px 8px rgba(0,0,0,.45),0 16px 34px rgba(0,0,0,.5)}

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%} /* Chrome on Android inflates text otherwise, which stretched button labels onto two lines */
#stMain,#stSub,#stFB,#planNum,#planSub,#rcMain,#gps,.pnum,.pin,.dtip,.stepv,.stats,.mh2,.rt,.rs,.tval{
 font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
#mapWrap{position:fixed;top:0;left:0;right:0;bottom:200px;overflow:hidden;background:var(--mapbg)}
#map{position:absolute;top:0;left:0;width:100%;height:100%;background:var(--mapbg);transform-origin:50% 50%}
/* keep pins, flags and labels upright when the map is turned */
.pin,.flag,.gflag,.aimx,.aimo,.ptdot,.hpin,.bmark,.urot{transform:rotate(var(--unrot,0deg))}
#rotBtn{font-size:15px;font-weight:900;letter-spacing:.5px}
#rotBtn.on{background:var(--g2);color:#fff}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;gap:8px;z-index:1000;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:13px;border:1px solid rgba(11,59,42,.07);background:var(--float);box-shadow:var(--sh1);font-size:21px;font-weight:700;display:flex;align-items:center;justify-content:center;color:var(--ink);transition:transform .12s var(--ease),background .12s var(--ease)}
.ib:active{transform:scale(.93);background:var(--g3)}
.ib svg{width:22px;height:22px;stroke:var(--ink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.ichip svg{width:17px;height:17px;stroke:var(--ink2);stroke-width:1.7;fill:none;stroke-linecap:round;stroke-linejoin:round;display:block}
.ichip{display:flex;align-items:center;justify-content:center}
#holeNav{display:flex;align-items:center;background:var(--float);border:1px solid rgba(11,59,42,.07);border-radius:13px;box-shadow:var(--sh1)}
#holeNav .ib{box-shadow:none;background:none;border:0;font-size:26px;color:var(--ink2)}
#holeLabel{border:0;background:none;font-weight:800;font-size:17px;letter-spacing:-.2px;min-width:80px;height:44px}
.pill{margin-left:auto;padding:9px 13px;border-radius:999px;font-weight:800;font-size:13px;letter-spacing:.2px;background:var(--float);border:1px solid rgba(11,59,42,.07);box-shadow:var(--sh1);white-space:nowrap}
.pill.good{color:#0a7a33}.pill.fair{color:#a86b00}.pill.poor{color:var(--red)}
#fabs{position:fixed;right:10px;bottom:230px;z-index:1000;display:flex;flex-direction:column;gap:8px}
#panel{position:fixed;left:0;right:0;bottom:0;background:var(--srf);border-radius:var(--r4) var(--r4) 0 0;box-shadow:0 -1px 0 var(--line2),0 -8px 30px rgba(11,59,42,.14);padding:14px 16px calc(env(safe-area-inset-bottom) + 12px);z-index:1000}
#liveNum{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:-1px}
#liveSub{color:var(--mut);font-size:14px;margin-top:2px}
#lastCard{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.lcHead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.link{border:0;background:none;color:var(--gink);font-weight:800;padding:6px 0 6px 12px}
#statusLine .link{white-space:nowrap;flex:none;align-self:center}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--srf2);color:var(--ink2);font-size:14px;font-weight:700;transition:transform .12s var(--ease),background .12s var(--ease)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--g);border-color:var(--g);color:#fff;box-shadow:0 2px 8px rgba(11,59,42,.22)}
.clab{flex:none;align-self:center;font-size:12px;color:var(--mut);width:46px;font-weight:700;text-transform:uppercase}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.actions .btn{font-size:16px;padding:0 4px;height:50px}
/* What you are working on, in one line: the shots already played and the one you are on. */
#holeStrip{display:flex;gap:6px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;
 margin:0 0 8px;padding-bottom:2px;scrollbar-width:none}
#holeStrip::-webkit-scrollbar{display:none}
#holeStrip .hs{flex:none;display:flex;align-items:baseline;gap:5px;padding:4px 9px;border-radius:999px;
 border:1px solid var(--line);background:var(--srf2);font-size:12px;font-weight:800;color:var(--ink2);
 white-space:nowrap;font-variant-numeric:tabular-nums}
#holeStrip .hs i{font-style:normal;color:var(--mut);font-size:10.5px;font-weight:900}
#holeStrip .hs em{font-style:normal;color:var(--mut);font-weight:700}
#holeStrip .hs.now{border-color:var(--g2);background:var(--g3);color:var(--gink)}
#holeStrip .hs.now i{color:var(--gink)}
#holeStrip .hs.aim:after{content:"";width:7px;height:7px;border-radius:50%;background:var(--orange);align-self:center}
/* On the green the units change: nobody reads a three foot putt in yards. */
#puttBar{margin-bottom:8px}
.pbTop{display:flex;align-items:baseline;gap:10px}
.pbNum{font-size:34px;font-weight:900;line-height:1;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.pbSub{flex:1;min-width:0;color:var(--mut);font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#pbClose{flex:none;padding:4px 0 4px 8px}
#pbClose svg{width:20px;height:20px;stroke:var(--gink);stroke-width:2.1;fill:none;stroke-linecap:round;display:block}
.pbRow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:9px}
.pbRow .btn{height:52px;font-size:15px}
/* the bare minimum first: two taps and a score */
.pbCount{display:flex;align-items:center;gap:10px;margin-top:9px}
.pbCount button{flex:1;height:46px;border-radius:12px;border:1.5px solid var(--line);
 background:var(--srf2);color:var(--ink);font-size:22px;font-weight:900;line-height:1}
.pbCount button:active{background:var(--g3)}
.pbCount b{flex:1.2;text-align:center;font-size:19px;font-weight:900;font-variant-numeric:tabular-nums}
.pbOpt{display:flex;align-items:center;gap:14px;margin-top:8px;flex-wrap:wrap}
.pbOpt .link{padding:4px 0;font-size:13px}
.pbOpt .link.set{color:var(--mut)}
#statusLine{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;min-height:38px}
#grip{display:flex;align-items:center;justify-content:center;height:22px;margin:-10px 0 4px;touch-action:none;cursor:grab;-webkit-tap-highlight-color:transparent}
#grip span{display:block;width:40px;height:4px;border-radius:99px;background:var(--grip);transition:width .16s var(--ease),background .16s var(--ease)}
#grip:active span{width:56px;background:#B9C6BF}
#stMain{font-size:19px;font-weight:800;line-height:1.15}
#stSub{font-size:13px;color:var(--mut);font-weight:600}
#stFB{flex:none;margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;font-size:13px;font-weight:800;color:var(--ink2);line-height:1.3;padding-top:1px}
#stFB b{color:var(--mut);font-weight:700;margin-right:3px}
.teebox{width:12px;height:12px;border-radius:3px;background:#fff;border:2px solid #15734A;box-shadow:0 1px 3px rgba(0,0,0,.45);transform:rotate(var(--unrot,0deg))}
.teebox.on{background:#15734A;border-color:#fff;width:16px;height:16px}
.fbdot{width:12px;height:12px;border-radius:50%;background:#fff;border:3px solid #15734A;box-shadow:0 1px 3px rgba(0,0,0,.45)}
#resultCard{position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom) + 8px);z-index:2500;background:var(--srf);border-radius:18px;box-shadow:0 -2px 18px rgba(0,0,0,.35);padding:14px 16px calc(env(safe-area-inset-bottom) + 14px);max-height:80vh;overflow:auto}
.rcHead{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.rcActs{display:flex;align-items:center;gap:2px;flex:none;white-space:nowrap}
#rcMain{font-size:30px;font-weight:900;line-height:1.1;letter-spacing:-.5px}
#rcTags{margin-top:6px}
#rcAsk{margin-top:8px}
#rcClubs{display:grid;grid-template-rows:repeat(2,auto);grid-auto-flow:column;grid-auto-columns:max-content;gap:6px}
#rcClubs .chip{padding:11px 13px;font-size:16px;font-weight:800}
.leaflet-control-attribution{background:var(--floatq)!important;color:var(--mut)!important;font-size:9px!important;line-height:1.4!important;padding:1px 5px!important;border-radius:7px 0 0 0;max-width:62vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:.75}
.leaflet-control-attribution a{color:var(--mut)!important;text-decoration:none}
.ptdot{width:12px;height:12px;border-radius:50%;background:#1e88e5;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.hpin{width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid var(--ink);
 box-shadow:0 0 0 1px rgba(255,255,255,.9),0 1px 4px rgba(0,0,0,.5)}
.bmark{width:14px;height:14px;border-radius:50%;background:#8D6E63;border:2px solid #fff;
 box-shadow:0 1px 3px rgba(0,0,0,.45)}
.stdot{width:20px;height:20px;border-radius:50%;background:#1e88e5;border:3px solid #fff;
 box-shadow:0 0 0 1px rgba(0,0,0,.35),0 0 0 6px rgba(30,136,229,.22)}
.pill.lock{color:#fff;background:#0a7a33}
.cchip{padding:3px 10px;font-size:15px;border-color:var(--g2);color:var(--gink)}
#lcClubs .chip{padding:10px 13px}

.plan{background:var(--warm);color:var(--warmink);border:2px solid var(--orange)}
/* an aim already set reads as done rather than as an invitation */
.btn.plan.aimed{background:var(--srf2);color:var(--ink2);border-color:var(--line)}
.btn.plan.aimed:before{content:"";width:9px;height:9px;border-radius:50%;background:var(--orange);
 margin-right:8px;flex:none;box-shadow:0 0 0 3px var(--warm)}
.plan.on{background:#ff9800;color:#111}
#planBox{margin-top:6px}
.planHead{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.planHead .pnum{font-size:26px;white-space:nowrap;flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis}
#planClose{flex:none;padding:6px 2px 6px 12px}
#planClose svg{width:21px;height:21px;stroke:var(--gink);stroke-width:2.1;fill:none;stroke-linecap:round;display:block}
.planCtl{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;margin-top:8px}
.planCtl .chip{padding:9px 11px;font-size:15px;flex:none}
.planCtl .cchip{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#planClubs{margin-top:4px}
#pmBox{margin-top:6px}
#pmBox .planHead .pnum{font-size:22px;flex:none}
#pmPlan{flex:0 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto;padding:6px 11px}
#pmNext{height:40px;width:auto;flex:none;padding:0 14px;font-size:15px}
#pmClose{flex:none;padding:6px 0 6px 6px}
#pmClose svg{width:21px;height:21px;stroke:var(--gink);stroke-width:2.1;fill:none;stroke-linecap:round;display:block}
#pmSub{white-space:pre-line;line-height:1.35;margin-top:2px;min-height:2.7em}
#pmTees{margin-top:4px}
#pmBox .planCtl .chip:disabled{opacity:.4}
.ritem.pr{display:block;width:100%;text-align:left;font:inherit;color:inherit}
.tag.off{background:var(--warm);color:var(--warmink);border:1px solid var(--warmline)}
#planSub{line-height:1.35;margin-top:2px;height:2.7em;overflow:hidden;
 display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pnum{font-size:34px;font-weight:900;line-height:1.05}
.psub{color:var(--mut);font-size:13px}
.planRow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:14px;font-weight:700}
.planRow>span:last-child{white-space:nowrap;flex:none}
.mini{min-width:40px;height:38px;border-radius:10px;border:1.5px solid var(--line);background:var(--srf2);font-weight:800;font-size:16px}
.mini.wide{padding:0 10px;font-size:14px}
.chip.sug{border-color:#ff9800}
.aimx{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:rgba(255,152,0,.35);box-shadow:0 0 0 2px #ff9800,0 1px 4px rgba(0,0,0,.6);position:relative}
.aimx:before,.aimx:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.aimx:before{width:2px;height:22px}.aimx:after{width:22px;height:2px}
.aimo{width:16px;height:16px;border-radius:50%;border:3px solid #ff9800;background:transparent}
input[type=range]{width:100%;margin:8px 0}
.split{font-weight:800;font-size:16px}
.btn{height:54px;border-radius:var(--r2);border:0;font-size:17px;font-weight:800;letter-spacing:.1px;width:100%;
 display:inline-flex;align-items:center;justify-content:center;gap:8px;white-space:nowrap;
 transition:transform .12s var(--ease),background .15s var(--ease),box-shadow .15s var(--ease)}
.btn:active{transform:scale(.975)}
.pri{background:var(--g2);color:#fff;box-shadow:0 1px 2px rgba(11,59,42,.18),0 6px 16px rgba(21,115,74,.24)}
.pri:active{background:var(--g);box-shadow:0 1px 2px rgba(11,59,42,.2)}
.sec{background:var(--g3);color:var(--gink);border:1.5px solid rgba(21,115,74,.3)}
.sec:active{background:var(--secact)}
.ghost{background:var(--tint);color:var(--ink2);border:1.5px solid var(--line)}
.danger{background:var(--dangerbg);color:var(--red);border:1.5px solid var(--dangerline)}
#sheetWrap{position:fixed;inset:0;background:rgba(9,26,19,.5);z-index:2000;display:flex;align-items:flex-end;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);animation:fadeIn .2s var(--ease)}
#sheet{background:var(--srf);width:100%;max-height:92vh;overflow:auto;border-radius:var(--r4) var(--r4) 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 16px);animation:sheetUp .3s var(--ease)}
#sheet:before{content:"";display:block;width:38px;height:4px;border-radius:99px;background:var(--grip);margin:0 auto 12px}
#sheet h3{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.35px}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes sheetUp{from{transform:translateY(16px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#sheetWrap,#sheet{animation:none}.btn,.chip,.ib{transition:none}}
.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.fl{display:block;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:12px 0 4px}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;font-size:17px;padding:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--srf2);color:var(--ink);font-family:inherit;text-transform:none;font-weight:600;transition:border-color .15s var(--ease),box-shadow .15s var(--ease)}
.fl input:focus,.fl select:focus,.fl textarea:focus{outline:0;border-color:var(--g2);box-shadow:0 0 0 3px rgba(21,115,74,.14)}
#ft{font-size:30px;font-weight:800}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin:14px 0}
.chk input{width:22px;height:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stack{display:grid;gap:10px;margin-top:12px}
.clubs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.clubs button{height:56px;border-radius:12px;border:1.5px solid var(--line);background:var(--tint2);font-size:17px;font-weight:800;transition:transform .12s var(--ease)}
.clubs button:active{transform:scale(.97)}
.clubs button:active{background:var(--g2);color:#fff}
.mhead{background:linear-gradient(155deg,#16513A,#0B3B2A);color:#fff;border-radius:var(--r3);padding:15px 16px 16px;margin:2px 0 4px;box-shadow:0 6px 20px rgba(11,59,42,.22)}
.mhead .mh1{font-size:19px;font-weight:800;letter-spacing:-.25px}
.mhead .mh2{font-size:13px;font-weight:600;color:rgba(255,255,255,.74);margin-top:3px}
.mhead .btn{margin-top:13px;height:44px;font-size:15px;background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.24);box-shadow:none}
.mlab{font-size:11px;font-weight:800;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin:18px 4px 7px}
.mtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mtile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;
 padding:14px 6px;background:var(--srf);border:1px solid var(--line);border-radius:var(--r2);
 font-size:12.5px;font-weight:800;color:var(--ink);line-height:1.2;text-align:center;
 box-shadow:var(--sh1);transition:transform .12s var(--ease)}
.mtile:active{transform:scale(.96);background:var(--g3)}
.mtile svg{flex:none;width:23px;height:23px;stroke:var(--gink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mtile.warn svg{stroke:var(--gold)}
.mtile.warn{color:var(--goldink)}
.msec{border:1px solid var(--line);border-radius:var(--r2);background:var(--srf);margin-top:8px;overflow:hidden}
.msec>summary{display:flex;align-items:center;gap:10px;padding:14px;font-size:15px;font-weight:800;
 color:var(--ink);cursor:pointer;list-style:none}
.msec>summary::-webkit-details-marker{display:none}
.msec>summary:after{content:"\203a";margin-left:auto;color:var(--mut);font-size:20px;font-weight:800;
 transition:transform .18s var(--ease)}
.msec[open]>summary:after{transform:rotate(90deg)}
.msec[open]>summary{border-bottom:1px solid var(--line2)}
.msec .mgrp{border:0;border-radius:0}
.msec .mrow:last-child{border-bottom:0}
.mgrp{background:var(--srf);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 14px;border:0;border-bottom:1px solid var(--line2);background:none;font-size:16px;font-weight:700;color:var(--ink)}
.mgrp .mrow:last-child{border-bottom:0}
.mrow:active{background:var(--g3)}
.mrow svg{flex:none;width:20px;height:20px;stroke:var(--gink);stroke-width:1.9;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mrow.warn svg{stroke:var(--gold)}
.mrow .mchev{margin-left:auto;color:#BAC5BE;font-size:20px;font-weight:700;line-height:1}
.rlist .ritem{border:1px solid var(--line);border-radius:var(--r2);padding:12px 13px;margin-bottom:9px;background:var(--srf)}
.ritem .rt{font-weight:800}.ritem .rs{color:var(--mut);font-size:13px;margin:2px 0 8px}
.ritem .rb{display:flex;gap:8px}
.ritem .rb button{flex:1;padding:10px;border-radius:11px;border:1.5px solid var(--line);background:var(--srf2);font-weight:700;font-size:14px;color:var(--ink2)}
.tag{display:inline-block;background:var(--g2);color:#fff;border-radius:999px;padding:2px 8px;font-size:10px;font-weight:800;letter-spacing:.6px;margin-left:6px;vertical-align:middle}
.holegrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:10px 0}
.holegrid .chip{padding:14px 0;font-size:17px;text-align:center}
.tblwrap{overflow-x:auto;margin-top:8px}
table.stats{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.stats th:first-child,table.stats td:first-child{text-align:left}
table.stats th{font-size:12px;color:var(--mut);text-transform:uppercase}
.note{font-size:13px;color:var(--mut);line-height:1.4;margin-top:10px}
.guide{font-size:15px;line-height:1.5}
.guide .hero{background:linear-gradient(135deg,#0f5132,#198754);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px}
.guide .hero h2{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
.guide .hero p{margin:0;font-size:16px;opacity:.95}
.guide h4{margin:20px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--gink)}
.guide .sell{display:grid;gap:10px}
.guide .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.guide .card b{display:block;font-size:16px;margin-bottom:2px}
.guide ol{padding-left:0;list-style:none;counter-reset:st;margin:0}
.guide ol>li{counter-increment:st;position:relative;padding:0 0 12px 40px}
.guide ol>li:before{content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--g2);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.guide ul{margin:4px 0 0;padding-left:18px}
.guide .k{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:800;font-size:13px;background:var(--tint);border:1px solid #cfdcd2;white-space:nowrap}
.guide .k.hit{background:var(--g2);color:#fff;border-color:var(--g2)}
.guide .k.plan{background:#ff9800;color:#111;border-color:#ff9800}
.guide .honest{background:var(--warm);border:1px solid var(--warmline);border-radius:12px;padding:12px 14px}
.seg{display:flex;border:1.5px solid var(--g2);border-radius:10px;overflow:hidden;margin-top:6px}
.seg button{flex:1;padding:10px;border:0;background:var(--srf2);font-weight:800;color:var(--gink)}
.seg button.on{background:var(--g2);color:#fff}
#capOverlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.capBox{background:var(--srf);border-radius:18px;padding:22px;text-align:center;width:min(320px,100%)}
.capBox .big{font-size:52px;font-weight:900}
.capBox .stack{margin-top:14px}
.pill.stale{color:#777}
#toast{position:fixed;left:0;right:0;margin:0 auto;width:max-content;top:calc(env(safe-area-inset-top) + 64px);z-index:4000;background:#111;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:center}
.pin{width:28px;height:28px;border-radius:50%;background:#ff9800;border:3px solid #fff;color:#111;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pin.ex{background:#9e9e9e}
.flag{width:30px;height:30px;border-radius:50%;background:var(--gold);border:3px solid #fff;color:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.flag svg,.gflag svg{width:17px;height:17px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
.mini{flex:1;min-width:0;text-align:center}
.mini .ml{display:block;font-size:10px;letter-spacing:1.1px;font-weight:800;color:var(--mut);margin-bottom:3px}
.mini .mc{display:flex;align-items:center;justify-content:center;gap:1px}
.mini button{width:30px;height:32px;border-radius:8px;border:1.5px solid var(--line);background:var(--srf2);font-size:16px;font-weight:900;line-height:1;padding:0}
.mini b{min-width:28px;font-size:16px;font-weight:900}
.mini.set b{color:var(--gink)}
/* A scorecard is a grid. Eighteen stacked cards was 3,900px of scrolling to fill in a round. */
.scblk{margin:10px 0 14px}
.scr{display:grid;grid-template-columns:42px repeat(9,1fr) 36px;gap:3px;align-items:center;margin-bottom:3px}
.scl{font-size:9.5px;font-weight:800;letter-spacing:.8px;color:var(--mut);text-align:left}
.scr-h{margin-bottom:5px}
.scr-h .scn{text-align:center;font-size:11px;font-weight:800;color:var(--mut)}
.scr-h .scl,.scr-h .sct{color:var(--ink2)}
.sct{text-align:center;font-size:13px;font-weight:900;color:var(--ink)}
.sccell{height:34px;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--srf2);
 color:var(--ink);font-size:14px;font-weight:800;line-height:1;display:flex;align-items:center;
 justify-content:center;position:relative;transition:background .12s var(--ease),border-color .12s var(--ease)}
.sccell.sel{border-color:var(--g2);background:var(--g3);box-shadow:0 0 0 2px var(--g2) inset;color:var(--gink)}
/* under par rounds off, over par squares up, the way a card marks them */
.sccell.e1:before,.sccell.e2:before,.sccell.b1:before,.sccell.b2:before{content:"";position:absolute;
 left:4px;right:4px;top:3px;bottom:3px;border:2px solid var(--goldink);pointer-events:none}
.sccell.e1:before,.sccell.e2:before{border-radius:50%}
.sccell.b1:before,.sccell.b2:before{border-radius:3px;border-color:#1c6ea4}
.sccell.e2:after,.sccell.b2:after{content:"";position:absolute;left:1px;right:1px;top:0;bottom:0;
 border:2px solid var(--goldink);pointer-events:none}
.sccell.e2:after{border-radius:50%}
.sccell.b2:after{border-radius:4px;border-color:#1c6ea4}
.scedit{position:sticky;bottom:0;background:var(--srf);border-top:1px solid var(--line);
 padding:9px 0 4px;margin-top:4px;z-index:2}
.sce-t{display:flex;align-items:center;font-size:12px;font-weight:800;letter-spacing:.6px;color:var(--mut)}
.sce-t .link{margin-left:auto;font-size:13px;padding:2px 0 2px 10px}
.sce-r{display:flex;align-items:center;gap:12px;margin-top:6px}
.sce-r button{flex:1;height:44px;border-radius:12px;border:1.5px solid var(--line);background:var(--srf2);
 color:var(--ink);font-size:22px;font-weight:900;line-height:1}
.sce-r button:active{background:var(--g3)}
.sce-r b{min-width:54px;text-align:center;font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.scTot{position:sticky;top:0;background:var(--srf);padding:6px 0 10px;font-weight:800;font-size:15px;z-index:2}
.scTot span{font-weight:700;color:var(--mut);font-size:13px}
.slog .sl{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-bottom:7px;background:var(--srf);align-items:flex-start}
.slog .sl.aimed{border-color:#f0c48a}
.slog .slh{flex:none;min-width:46px;height:34px;border-radius:9px;background:var(--tint);color:var(--gink);font-weight:900;font-size:13px;display:flex;align-items:center;justify-content:center}
.slog .slb{flex:1;min-width:0}
.slog .sl1{display:block;font-size:16px;font-weight:800;line-height:1.25}
.slog .sl1 .yd{font-size:19px}
.slog .sl1 .open{color:var(--mut);font-weight:700}
.slog .sl2{display:block;font-size:12.5px;color:#a3712a;font-weight:700;margin-top:3px;line-height:1.3}
.slog .sl2.out{color:#b0561f}
.slog .sl3{display:block;font-size:12px;color:var(--mut);font-weight:600;margin-top:3px;line-height:1.3}
.slog .hd{font-weight:900;font-size:14px;margin:12px 0 6px;color:var(--gink)}
.slog .hd span{color:var(--mut);font-weight:700}
.slogSum{font-size:13px;color:var(--mut);font-weight:600;margin:-2px 0 8px}
.stp{display:flex;align-items:center;gap:8px;padding:5px 0}
.stp .lbl{flex:1;font-size:14px;font-weight:700}
.stp button{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);background:var(--srf2);font-size:19px;font-weight:900;line-height:1}
.stp b{min-width:26px;text-align:center;font-size:17px;font-weight:900}
.stp.on .lbl{color:var(--gink)}
.putt{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:6px 0;background:var(--tint3)}
.putt .ph{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.putt .ph b{font-size:14px;flex:none}
.putt .ph input{width:76px;padding:8px;border:2px solid var(--line);border-radius:10px;font-size:15px;font-weight:700}
.putt .ph .rm{margin-left:auto}
.putt .chips{margin:2px 0}
.putt .chip{padding:6px 9px;font-size:13px}
.scoreline{font-size:13px;color:var(--mut);font-weight:600;margin-top:2px}
.gflag{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid var(--g2);color:var(--gink);display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(0,0,0,.45)}
.gflag.set{background:var(--g2);color:#fff}
#tgtBar{position:fixed;left:8px;right:8px;z-index:2400;background:#0E1512;color:#fff;border-radius:16px;padding:10px 12px 11px;box-shadow:0 2px 16px rgba(0,0,0,.42)}
.tgtTop{display:flex;align-items:baseline;gap:10px;margin-bottom:9px}
#tgtBar .t{flex:1;font-size:13px;font-weight:700;line-height:1.3}
.tgtCount{flex:none;font-size:11px;font-weight:800;letter-spacing:.8px;color:rgba(255,255,255,.62);white-space:nowrap}
.tgtRow{display:flex;align-items:center;gap:8px}
#tgtBar button{border:0;border-radius:11px;padding:11px 14px;font-weight:800;font-size:15px;transition:transform .12s var(--ease)}
#tgtBar button:active{transform:scale(.95)}
#tgtBar .tgtNav{flex:none;width:44px;padding:11px 0;background:rgba(255,255,255,.14);color:#fff;font-size:20px;line-height:1}
#tgtBar .tgtNav:disabled{opacity:.35}
#tgtSave{flex:1;background:var(--g2);color:#fff}
#tgtDone{flex:none;background:rgba(255,255,255,.14);color:#fff}
#tgtSweep{flex:none;background:rgba(255,255,255,.14);color:#fff;white-space:nowrap}
/* The pill is the inner span, not the tooltip box: the box carries Leaflet's own positioning, and
   turning the box instead would spin it about the pane's origin and throw it off the screen. */
.leaflet-tooltip.dtip{background:none;border:0;box-shadow:none;padding:0;color:#fff;font-weight:800;font-size:13px}
.leaflet-tooltip.dtip .urot{display:inline-block;background:rgba(14,21,18,.86);padding:3px 7px;border-radius:9px;box-shadow:0 1px 4px rgba(0,0,0,.28)}
.leaflet-tooltip.dtip.walk .urot{background:#C2185B}
.leaflet-tooltip.dtip.hid{display:none}
.leaflet-tooltip.dtip:before{display:none}
#fatal{position:fixed;inset:0;z-index:5000;background:var(--srf);padding:24px;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div id="mapWrap"><div id="map"></div></div>

<header id="top">
  <button id="menuBtn" class="ib" aria-label="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div id="holeNav">
    <button id="prevHole" class="ib" aria-label="Previous hole">&#8249;</button>
    <button id="holeLabel">Hole 1</button>
    <button id="nextHole" class="ib" aria-label="Next hole">&#8250;</button>
  </div>
  <div id="gps" class="pill poor">GPS &hellip;</div>
</header>

<div id="fabs">
  <button id="rotBtn" class="ib" aria-label="Map rotation" title="North up / shot up">N</button>
  <button id="layerBtn" class="ib" aria-label="Map type" title="Street / Satellite"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 3 7.5l9 4.5 9-4.5L12 3z"/><path d="M3 12.5 12 17l9-4.5M3 17 12 21.5 21 17"/></svg></button>
  <button id="centerBtn" class="ib" aria-label="Center on me" title="Center on me"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.4"/><circle cx="12" cy="12" r="8"/><path d="M12 1.6v2.6M12 19.8v2.6M22.4 12h-2.6M4.2 12H1.6"/></svg></button>
</div>

<div id="tgtBar" hidden>
  <div class="tgtTop"><div class="t" id="tgtText"></div><div class="tgtCount" id="tgtCount"></div></div>
  <div class="tgtRow">
    <button id="tgtPrev" class="tgtNav" aria-label="Previous hole">&#8249;</button>
    <button id="tgtNext" class="tgtNav" aria-label="Next hole">&#8250;</button>
    <button id="tgtDone">Done</button><button id="tgtSweep">Save &amp; next &#8250;</button><button id="tgtSave">Save</button>
  </div>
</div>

<section id="panel">
  <div id="grip" role="button" tabindex="0" aria-label="Collapse the panel for more map"><span></span></div>
  <div id="holeStrip" hidden></div>
  <div id="statusLine"><div><div id="stMain">Ready</div><div id="stSub"></div></div><div id="stFB" hidden></div><button id="tgtBtn" class="link" hidden>Set green</button><button id="greenBtn" class="link" hidden>Finish hole</button></div>
  <div id="planBox" hidden>
    <div class="planHead">
      <div id="planNum" class="pnum">— yd</div>
      <button id="planClose" class="link ichip" aria-label="Back, without planning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="psub" id="planSub"></div>
    <div class="planCtl">
      <button id="planClubBtn" class="chip cchip">Club</button>
      <button id="planEdit" class="chip ichip" title="Shot pattern" aria-label="Shot pattern"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.1"/><path d="M19.4 14.6a1.6 1.6 0 0 0 .32 1.77l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.6 1.6 0 0 0-1.77-.32 1.6 1.6 0 0 0-1 1.46V21a2 2 0 1 1-4 0v-.1a1.6 1.6 0 0 0-1.05-1.46 1.6 1.6 0 0 0-1.77.32l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.6 1.6 0 0 0 .32-1.77 1.6 1.6 0 0 0-1.46-1H3a2 2 0 1 1 0-4h.1a1.6 1.6 0 0 0 1.46-1.05 1.6 1.6 0 0 0-.32-1.77l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.6 1.6 0 0 0 1.77.32H9a1.6 1.6 0 0 0 1-1.46V3a2 2 0 1 1 4 0v.1a1.6 1.6 0 0 0 1 1.46 1.6 1.6 0 0 0 1.77-.32l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.6 1.6 0 0 0-.32 1.77V9a1.6 1.6 0 0 0 1.46 1H21a2 2 0 1 1 0 4h-.1a1.6 1.6 0 0 0-1.46 1z"/></svg></button>
      <button id="pwMinus" class="chip" aria-label="Narrower pattern">&minus;</button>
      <button id="pwPlus" class="chip" aria-label="Wider pattern">+</button>
    </div>
    <div class="chips" id="planClubs" hidden></div>
    <button id="goBtn" class="btn pri" style="margin-top:12px">HIT IT</button>
  </div>
  <div id="pmBox" hidden>
    <div class="planHead">
      <div id="pmNum" class="pnum">Hole 1</div>
      <button id="pmPlan" class="chip cchip" title="Plans for this course"></button>
      <button id="pmNext" class="btn pri">Next &#8250;</button>
      <button id="pmClose" class="link ichip" aria-label="Stop planning"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>
    <div class="psub" id="pmSub"></div>
    <div class="chips" id="pmTees"></div>
    <div class="planCtl">
      <button id="pmClubBtn" class="chip cchip">Club</button>
      <button id="pmPat" class="chip ichip" title="Shot pattern" aria-label="Shot pattern"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.2"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      <button id="pmAdd" class="chip">+ Shot</button>
      <button id="pmDel" class="chip">Remove</button>
    </div>
    <div class="chips" id="pmClubs" hidden></div>
  </div>
  <div id="puttBar" hidden>
    <div class="pbTop"><div class="pbNum" id="pbNum">&mdash;</div><div class="pbSub" id="pbSub"></div>
      <button id="pbClose" class="link ichip" aria-label="Leave putting"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div class="pbCount"><button id="pbDown" aria-label="One fewer putt">&minus;</button><b id="pbN">0 putts</b><button id="pbUp" aria-label="One more putt">+</button></div>
    <div class="pbRow"><button id="pbPutt" class="btn sec">PUTT FROM HERE</button><button id="pbHoled" class="btn pri">HOLED IT</button></div>
    <div class="pbOpt"><button class="link" id="pbPin">Hole is here</button><button class="link" id="pbMark">Ball mark</button><button class="link" id="pbDetail">Detail &#8250;</button></div>
  </div>
  <div class="actions" id="actions">
    <button id="planBtn" class="btn plan">AIM</button>
    <button id="recBtn" class="btn pri">MARK BALL</button>
    <button id="greenGoBtn" class="btn pri" hidden>PUTTING</button>
    <button id="holedBtn" class="btn pri" hidden>HOLED IT</button>
  </div>
</section>

<div id="sheetWrap" hidden><div id="sheet"></div></div>

<div id="capOverlay" hidden>
  <div class="capBox">
    <div id="capTitle">Locking GPS position</div>
    <div class="big" id="capCount">4</div>
    <div class="sub" id="capInfo">Hold still</div>
    <div class="stack">
      <button class="btn ghost" id="capSkip">Use now</button>
      <button class="btn sec" id="capStale" hidden>Use last fix</button>
      <button class="btn sec" id="capWait" hidden>Wait 5 s more</button>
      <button class="btn pri" id="capAnyway" hidden>Record anyway</button>
      <button class="btn ghost" id="capCancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>
<div id="resultCard" hidden>
  <div class="rcHead"><div><div id="rcMain">—</div><div id="rcSub" class="psub"></div></div><div class="rcActs"><button id="rcTagBtn" class="link" hidden>Tag it</button><button id="rcUndo" class="link">Undo</button></div></div>

  <div id="rcTags" hidden><div class="chips"><span class="clab">Strike</span><span id="rcStrike" style="display:contents"></span></div><div class="chips"><span class="clab">Miss</span><span id="rcMiss" style="display:contents"></span></div></div>
  <button id="rcSep" class="btn ghost" style="margin-bottom:8px" hidden>No, that was a separate shot</button>
  <div class="row"><button id="rcGreen" class="btn sec">Finish hole</button><button id="rcPlan" class="btn plan">Plan next</button></div>
  <button id="rcDone" class="btn ghost" style="margin-top:8px">Done</button>
</div>

<script>
(function(){
'use strict';
if (!window.L){ document.body.insertAdjacentHTML('beforeend', '<div id="fatal">The map library did not load. Check your connection and reload.</div>'); return; }

/* ---------- constants ---------- */
var KEY = 'gst.v1';
var M_PER_YD = 0.9144;                 // exact, by definition
var WGS84_A = 6378137;                 // semi-major axis (m)
var WGS84_F = 1 / 298.257223563;       // flattening
var WGS84_E2 = WGS84_F * (2 - WGS84_F);
var DEFAULT_CLUBS = ['Driver','Mini Driver','19° UW','Heavenwood','9 Wood','4 Utility','6i','7i','8i','9i','PW','50°','54°','58°'];
var LIES = ['Tee','Fairway','Rough','Bunker','Fringe','Other'];
var STRIKES = ['Pure','Thin','Fat','Toe','Heel'];
var MISSES = ['Left','Right','Short','Long','On target'];
var MISS_OPP = {Left:'Right', Right:'Left', Short:'Long', Long:'Short'};
var SAT_URL = 'https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=';
var USGS_TILE = 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/';
var MAPBOX_TILE = 'https://api.mapbox.com/v4/mapbox.satellite/';
var MAPBOX_CSS = 'https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css'; // official stylesheet, used only for the required Mapbox logo
var MAPBOX_TTL_MS = 30 * 24 * 3600 * 1000; // Mapbox terms: on-device cache limited to 30 days
var OFFLINE_MAX_TILES = 12000;   // a course at 6 in imagery needs z14-20, which is roughly 3,500 tiles
var OFFLINE_MAX_MB = 220;        // the real guard: tiles vary from 8 KB of fairway to 60 KB of trees
var LOCAL_CACHE = 'st-tiles-local-v1';
var LOCAL_ZMIN = 14;

/* Counties and regional councils fly 3 in and 6 in orthophotos, against 0.6 m for the USGS
   layer and 0.3-0.5 m for the commercial ones, so where one of them covers a course it is
   much the sharpest picture of it there is.

   Finding one used to mean knowing a county's server address. Most of them publish through
   ArcGIS Online instead, which has a public catalogue that can be searched by where you are
   standing, so the app asks that first and only falls back to a list of addresses. Nothing
   here is trusted either way: something becomes a map layer only once a tile has been
   fetched from it at the course and seen to have imagery in it. */
var AGOL_SEARCH = 'https://www.arcgis.com/sharing/rest/search';
var IMAGERY_SERVERS = [
  {label:'Adams County, CO', root:'https://gisapp.adcogov.org/arcgis/rest/services'}
];

/* Imagery sources that may be saved on the phone.
   key() is the cache key (no access token in it); url() is what is fetched. */
var SOURCES = {
  usgs: {label:'USGS', cache:'st-tiles-usgs-v1', zmin:14, zmax:18, ttl:null,   // z18 ~0.46 m/px at 40° N, finer than the ~1 m NAIP source
    key:function(z,x,y){ return USGS_TILE + z + '/' + y + '/' + x; },
    url:function(z,x,y){ return USGS_TILE + z + '/' + y + '/' + x; }},
  mapbox: {label:'Mapbox', cache:'st-tiles-mapbox-v1', zmin:14, zmax:19, ttl:MAPBOX_TTL_MS, // z19 @2x ~0.11 m/px at 40° N
    key:function(z,x,y){ return MAPBOX_TILE + z + '/' + x + '/' + y + '@2x.jpg80'; },
    url:function(z,x,y){ return MAPBOX_TILE + z + '/' + x + '/' + y + '@2x.jpg80?access_token=' + encodeURIComponent(S.settings.mapboxToken); }}
};

/* A local imagery source, once it has proved itself, behaves exactly like the built-in
   ones: same cache, same download, same delete. ttl is null because agency services do not
   impose the 30-day limit Mapbox does, so a course saved this way stays saved. */
function fillTpl(tpl, z, x, y){ return tpl.replace('{z}', z).replace('{x}', x).replace('{y}', y); }
function localSrc(rec){
  return {label:rec.label, cache:LOCAL_CACHE, zmin:LOCAL_ZMIN, zmax:rec.zmax, ttl:null, local:rec,
    key:function(z,x,y){ return fillTpl(rec.tpl, z, x, y); },
    url:function(z,x,y){ return fillTpl(rec.tpl, z, x, y); }};
}
function localList(){ return (S && S.settings && S.settings.localSources) || []; }
function findLocal(id){ return localList().filter(function(r){ return r.id === id; })[0] || null; }
/* Every place that used SOURCES[name] goes through here, so 'local:abc123' works wherever
   'usgs' does. An unknown name falls back to USGS rather than throwing mid-round. */
function srcFor(name){
  if (name && name.indexOf('local:') === 0){
    var rec = findLocal(name.slice(6));
    return rec ? localSrc(rec) : SOURCES.usgs;
  }
  return SOURCES[name] || SOURCES.usgs;
}
var TRAIL_MIN_STEP_M = 3;
var WEAK_ACC_M = 20;          // above this median accuracy the app asks before recording
var STALE_FIX_MS = 5000;      // pill turns grey when the newest fix is older than this
var TRAIL_MAX_ACC_M = 20;

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yd(m){ return m / M_PER_YD; }
function r0(x){ return Math.round(x); }

/* Distance on the WGS84 ellipsoid using local radii of curvature at the mean latitude.
   For golf-scale distances (< 1 km) this matches a full geodesic to well under a centimetre. */
function distM(a, b){
  var phi = (a.lat + b.lat) / 2 * Math.PI / 180;
  var s = Math.sin(phi), w = 1 - WGS84_E2 * s * s;
  var Mr = WGS84_A * (1 - WGS84_E2) / Math.pow(w, 1.5);
  var Nr = WGS84_A / Math.sqrt(w);
  var dy = (b.lat - a.lat) * Math.PI / 180 * Mr;
  var dx = (b.lng - a.lng) * Math.PI / 180 * Nr * Math.cos(phi);
  return Math.hypot(dx, dy);
}
window.__distM = distM; // exposed for testing

function isoDate(t){ var d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function niceDate(t){ return new Date(t).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }

var toastTimer = null;
function toast(msg, ms){
  var el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, ms || 2600);
}

/* ---------- state ---------- */
var APP_VERSION = '1.26.0', SCHEMA = 8;
function defaults(){ return {v:1, schema:SCHEMA, settings:{clubs:DEFAULT_CLUBS.slice(), arcgisKey:'', mapboxToken:'', patterns:{}, avgSeconds:4, basemap:'osm', localSources:[], wake:false, peek:false, theme:'system'}, rounds:[], activeId:null, playingId:null, offlineAreas:[], courses:[]}; }
function normalize(j){
  var d = defaults();
  if (!j || j.v !== 1) return d;
  j.settings = Object.assign(d.settings, j.settings || {}); j.settings.localSources = j.settings.localSources || []; j.rounds = j.rounds || []; j.offlineAreas = j.offlineAreas || [];
  j.courses = j.courses || []; // v1.5: greens you place yourself, kept per course and reused every round
  // v1.23 (schema 6): a course may also carry osm (where it came from), geo (holes, green outlines,
  // tee boxes and hazards from OpenStreetMap) and fb (front and back edges placed by hand). All optional.
  // v1.24 (schema 7): a course may carry plan (the game plan, hole by hole), and a round the copy of
  // each hole's plan it was played with (r.plan), so later edits never rewrite a round. Optional too.
  if (!('playingId' in j)) j.playingId = null;
  // v1.26 (schema 8): one plan per course became a list of named plans, and a round names the one it plays
  j.courses.forEach(function(c){
    if (c.plan && !c.plans){
      var P = Object.assign({id:uid(), name:'Plan 1'}, c.plan); c.plans = [P]; delete c.plan;
      Object.keys(P.holes || {}).forEach(function(k){ delete P.holes[k].score; });
      j.rounds.forEach(function(r){ if (r.courseId === c.id && r.plan && !r.planId){ r.planId = P.id; r.planName = P.name; } });
    }
  });
  if ((j.schema || 1) < 3) j.settings.wake = false; // v1.1: the phone can sleep between shots by default
  j.schema = SCHEMA;
  return j;
}

/* Storage: IndexedDB (large quota, can be marked persistent). Falls back to localStorage only if
   IndexedDB is unavailable. Keys: 'state' = everything except trails; 'trail:<roundId>' = breadcrumbs. */
var store = (function(){
  var db = null, mode = 'idb';
  var DB = 'shot-tracker', OS = 'kv';
  function lsKey(k){ return k === 'state' ? KEY : 'gst.' + k.replace(':', '.'); } // state -> gst.v1, trail:x -> gst.trail.x
  function req(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  return {
    open:function(){
      if (!('indexedDB' in window)){ mode = 'ls'; return Promise.resolve(mode); }
      return new Promise(function(res){
        var q; try { q = indexedDB.open(DB, 1); } catch(e){ mode = 'ls'; return res(mode); }
        q.onupgradeneeded = function(){ q.result.createObjectStore(OS); };
        q.onsuccess = function(){ db = q.result; res(mode); };
        q.onerror = q.onblocked = function(){ mode = 'ls'; res(mode); };
      });
    },
    mode:function(){ return mode; },
    get:function(k){
      if (mode === 'ls'){ try { return Promise.resolve(JSON.parse(localStorage.getItem(lsKey(k)))); } catch(e){ return Promise.resolve(null); } }
      return req(db.transaction(OS, 'readonly').objectStore(OS).get(k));
    },
    put:function(k, v){
      if (mode === 'ls'){ try { localStorage.setItem(lsKey(k), JSON.stringify(v)); return Promise.resolve(); } catch(e){ return Promise.reject(e); } }
      return new Promise(function(res, rej){
        var t; try { t = db.transaction(OS, 'readwrite', {durability:'strict'}); } catch(e){ t = db.transaction(OS, 'readwrite'); }
        t.objectStore(OS).put(v, k); // structured clone happens now, so later edits to S don't leak into this write
        t.oncomplete = function(){ res(); }; t.onerror = t.onabort = function(){ rej(t.error); };
      });
    },
    del:function(k){
      if (mode === 'ls'){ try { localStorage.removeItem(lsKey(k)); } catch(e){} return Promise.resolve(); }
      return new Promise(function(res){ var t = db.transaction(OS, 'readwrite'); t.objectStore(OS).delete(k); t.oncomplete = t.onerror = function(){ res(); }; });
    },
    keys:function(){
      if (mode === 'ls'){
        var out = []; for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k === KEY) out.push('state'); else if (k.indexOf('gst.trail.') === 0) out.push('trail:' + k.slice(10)); }
        return Promise.resolve(out);
      }
      return req(db.transaction(OS, 'readonly').objectStore(OS).getAllKeys());
    }
  };
})();

var S = defaults(), booted = false;
var lastSaveWarn = 0;
function warnSave(){ if (Date.now() - lastSaveWarn > 10000){ lastSaveWarn = Date.now(); toast('Could not save! Phone storage for this app may be full: back up, then delete old rounds.', 6000); } }
var bc = ('BroadcastChannel' in window) ? new BroadcastChannel('shot-tracker') : null;
function save(){
  if (!booted) return;
  store.put('state', S).then(function(){ if (bc) bc.postMessage('saved'); }).catch(warnSave);
}

/* Breadcrumb trails: one record per round, loaded on demand and never overwritten before they have loaded. */
var trails = {}, trailState = {};
function getTrail(r){
  if (!trails[r.id]){ trails[r.id] = []; loadTrail(r.id); }
  return trails[r.id];
}
function loadTrail(id){
  if (trailState[id]) return;
  trailState[id] = 'loading';
  store.get('trail:' + id).then(function(v){
    trailState[id] = 'ready';
    if (v && v.length){ trails[id] = v.concat(trails[id] || []); var r = active(); if (r && r.id === id) trailLine.setLatLngs(trails[id].map(function(p){ return [p[0], p[1]]; })); }
  }).catch(function(){ trailState[id] = 'ready'; });
}
function saveTrail(r){ if (!r || trailState[r.id] !== 'ready') return; store.put('trail:' + r.id, trails[r.id] || []).catch(warnSave); }
var trailDirty = false;
setInterval(function(){ if (trailDirty && booted){ trailDirty = false; saveTrail(active()); } }, 10000);

/* One-time move from the localStorage format used by earlier versions. */
function migrateFromLocal(){
  var raw; try { raw = localStorage.getItem(KEY); } catch(e){ return Promise.resolve(null); }
  if (!raw) return Promise.resolve(null);
  var j; try { j = JSON.parse(raw); } catch(e){ return Promise.resolve(null); }
  if (!j || j.v !== 1) return Promise.resolve(null);
  var trailMap = {};
  (j.rounds || []).forEach(function(r){
    if (r.trail){ if (r.trail.length) trailMap[r.id] = r.trail; delete r.trail; }
    try { var t = JSON.parse(localStorage.getItem('gst.trail.' + r.id)); if (t && t.length) trailMap[r.id] = t; } catch(e){}
  });
  j = normalize(j);
  var writes = [store.put('state', j)].concat(Object.keys(trailMap).map(function(id){ return store.put('trail:' + id, trailMap[id]); }));
  return Promise.all(writes).then(function(){ return store.get('state'); }).then(function(back){
    if (!back || back.rounds.length !== j.rounds.length) throw new Error('verify');
    // verified in IndexedDB: free the old localStorage copy (it shares a small quota with other apps on this site)
    try { localStorage.removeItem(KEY); Object.keys(trailMap).forEach(function(id){ localStorage.removeItem('gst.trail.' + id); });
      (j.rounds || []).forEach(function(r){ localStorage.removeItem('gst.trail.' + r.id); }); } catch(e){}
    return back;
  });
}

/* If another open copy of the app (tab or home-screen icon) saves, pick up its data instead of overwriting it later. */
if (bc) bc.onmessage = function(){
  store.get('state').then(function(st){
    if (!st) return;
    S = normalize(st); trails = {}; trailState = {}; pmRebind();
    setBase(); renderHole(false);
    toast('Updated with changes from another open copy of the app.');
  });
};

function active(){ for (var i=0;i<S.rounds.length;i++) if (S.rounds[i].id === S.activeId) return S.rounds[i]; return null; }
function curHole(){ var r = active(); return r ? r.holes[r.cur] : null; }
function nextN(n){ return n >= 18 ? 1 : n + 1; }
function newRound(course){
  var r = {id:uid(), course:course || '', started:Date.now(), holes:[{n:1, shots:[], green:null}], cur:0};
  S.rounds.unshift(r); S.activeId = r.id; S.playingId = r.id; trailState[r.id] = 'ready'; trails[r.id] = [];
  save(); return r;
}
function markPlaying(r){ S.playingId = r.id; r.lastAt = Date.now(); }
function greenPos(h){ return (h && h.green && !h.green.noPos && h.green.lat != null) ? h.green : null; }
function shotEnd(h, i){
  if (i < h.shots.length - 1) return {pt:h.shots[i+1], type:'next shot'};
  var g = greenPos(h); // a hole filled in afterwards has no finish position, so nothing to measure to
  if (g) return {pt:g, type:'green'};
  return null;
}
function shotDistYd(h, i){ var e = shotEnd(h, i); return e ? yd(distM(h.shots[i], e.pt)) : null; }

/* ---------- map ---------- */
var map = L.map('map', {zoomControl:false, maxZoom:21, attributionControl:true}).setView([39.83, -98.58], 4);
var baseLayer = null, underLayers = [], mbLogo = null;
function usgsLayer(){
  return L.tileLayer(USGS_TILE + '{z}/{y}/{x}', {maxNativeZoom:SOURCES.usgs.zmax, maxZoom:21,
    attribution:'Imagery: <a href="https://www.usgs.gov/programs/national-geospatial-program/national-map">USGS The National Map</a> (USDA NAIP)'});
}
function osmLayer(){
  return L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {maxNativeZoom:19, maxZoom:21,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'});
}
/* Agency imagery sits on top of USGS, so a hole that falls outside the county's flight
   line still shows something rather than grey. maxNativeZoom is the zoom the probe proved,
   so Leaflet stretches the sharpest real tiles instead of asking for ones that are blank. */
function localLayer(rec){
  return L.tileLayer(rec.tpl, {maxNativeZoom:rec.zmax, maxZoom:21,
    attribution:rec.attribution || esc(rec.label)});
}
function ensureMapboxCss(){
  if (document.getElementById('mbcss')) return;
  var l = document.createElement('link'); l.id = 'mbcss'; l.rel = 'stylesheet'; l.href = MAPBOX_CSS; document.head.appendChild(l);
}
function setBase(){
  if (baseLayer) map.removeLayer(baseLayer);
  underLayers.forEach(function(l){ map.removeLayer(l); }); underLayers = [];
  if (mbLogo){ map.removeControl(mbLogo); mbLogo = null; }
  var st = S.settings;
  // Fallback stack, bottom to top: USGS (can be saved offline) < OpenStreetMap (online only) < sharp imagery.
  // Any tile a higher layer can't load (no signal, not saved, token problem) shows the next layer down.
  var localRec = st.basemap && st.basemap.indexOf('local:') === 0 ? findLocal(st.basemap.slice(6)) : null;
  var top = localRec ? 'local' : (st.basemap === 'mapbox' && st.mapboxToken) ? 'mapbox' : (st.basemap === 'sat' && st.arcgisKey) ? 'sat' : st.basemap === 'usgs' ? 'usgs' : 'osm';
  if (top !== 'usgs'){ underLayers.push(usgsLayer()); }
  if (top === 'mapbox' || top === 'sat'){ underLayers.push(osmLayer()); }
  underLayers.forEach(function(l){ l.addTo(map); });
  if (localRec){
    baseLayer = localLayer(localRec);
  } else if (st.basemap === 'mapbox' && st.mapboxToken){
    ensureMapboxCss();
    baseLayer = L.tileLayer(MAPBOX_TILE + '{z}/{x}/{y}@2x.jpg80?access_token=' + encodeURIComponent(st.mapboxToken), {maxNativeZoom:SOURCES.mapbox.zmax, maxZoom:21,
      attribution:'&copy; <a href="https://www.mapbox.com/about/maps/">Mapbox</a> &copy; <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://www.maxar.com/">Maxar</a> <a href="https://apps.mapbox.com/feedback/"><strong>Improve this map</strong></a>'});
    var mbWarned = false;
    baseLayer.on('tileerror', function(){ if (!mbWarned && navigator.onLine){ mbWarned = true; toast('Some Mapbox tiles failed to load. Check the token in Settings, or your signal.', 4500); } });
    mbLogo = L.control({position:'bottomleft'});
    mbLogo.onAdd = function(){ var d = L.DomUtil.create('div'); d.innerHTML = '<a class="mapboxgl-ctrl-logo" href="https://www.mapbox.com/" target="_blank" rel="noopener" aria-label="Mapbox logo"></a>'; return d; };
    mbLogo.addTo(map);
  } else if (st.basemap === 'sat' && st.arcgisKey){
    baseLayer = L.tileLayer(SAT_URL + encodeURIComponent(st.arcgisKey), {maxNativeZoom:19, maxZoom:21,
      attribution:'Powered by <a href="https://www.esri.com">Esri</a> | Esri World Imagery'});
    var warned = false;
    baseLayer.on('tileerror', function(){ if (!warned){ warned = true; toast('Satellite tiles failed to load. Check the ArcGIS key in Settings, or your signal.', 4500); } });
  } else if (top === 'usgs'){
    baseLayer = usgsLayer();
  } else {
    baseLayer = osmLayer();
  }
  baseLayer.addTo(map);
}

var trailLine = L.polyline([], {color:'#1e88e5', weight:3, opacity:0.65}).addTo(map);
var pointLayer = L.layerGroup().addTo(map);
var holeLayer = L.layerGroup().addTo(map);
var liveLine = L.polyline([], {color:'#e91e63', weight:3, dashArray:'6 8', opacity:0.95}).addTo(map);
var accCircle = L.circle([0,0], {radius:1, color:'#1e88e5', weight:1, fillOpacity:0.12, interactive:false});
var youDot = L.circleMarker([0,0], {radius:8, color:'#fff', weight:3, fillColor:'#1e88e5', fillOpacity:1, interactive:false});
var markers = {};
var follow = true;
map.on('dragstart', function(){ follow = false; });

/* ---------- GPS ---------- */
var fix = null;       // latest fix {lat,lng,acc,t}
var recent = [];      // fixes from the last 15 s
var cap = null;       // active position capture {start, samples}
var firstFix = true;

function gpsPill(){
  var el = $('#gps');
  if (!fix){ return; }
  var age = Date.now() - fix.t;
  if (age > STALE_FIX_MS){ el.className = 'pill stale'; el.textContent = 'GPS ' + Math.round(age / 1000) + ' s old'; renderStatus(); return; }
  var ls = lockState();
  renderStatus();
  if (ls.locked){ el.className = 'pill lock'; el.textContent = 'Locked ±' + r0(yd(ls.pos.acc)) + ' yd'; return; }
  // Standing still and converging: say how long until a tap records instantly. Walking resets the
  // window on every fix, so n stays at 1 and no countdown is promised that cannot be kept.
  if (ls.pending && ls.n >= 2){
    el.className = 'pill fair';
    el.textContent = 'Locking ' + Math.max(1, Math.ceil(ls.leftMs / 1000)) + ' s';
    return;
  }
  var a = fix.acc;
  el.className = 'pill ' + (a <= 5 ? 'good' : a <= 10 ? 'fair' : 'poor');
  el.textContent = 'GPS ±' + r0(yd(a)) + ' yd';
}
setInterval(gpsPill, 1000);
function onPos(p, requested){
  var c = p.coords, now = Date.now(), raw = p.timestamp || now, pt = Math.abs(raw - now) > 30000 ? now : raw; // ignore a badly skewed clock
  fix = {lat:c.latitude, lng:c.longitude, acc:c.accuracy, t:now, pt:pt, lag:Math.max(0, now - pt)};
  // A capture accepts: the answer to the fresh-fix request made at the tap (maximumAge 0), or routine
  // updates received after the tap whose position time is no more than 2 s before it.
  if (cap && now >= cap.start && (requested === true || pt >= cap.start - 2000)) cap.samples.push(fix);
  fix.speed = c.speed; feedStill(fix);

  var ll = [fix.lat, fix.lng];
  youDot.setLatLng(ll); accCircle.setLatLng(ll).setRadius(fix.acc);
  if (!map.hasLayer(youDot)){ accCircle.addTo(map); youDot.addTo(map); }
  if (firstFix){ firstFix = false; if (!(greenFor(curHole()) && fitHole())) map.setView(ll, 18); } // fitHole shows the hole, not the sofa, when you are away
  else if (follow){ map.panTo(ll, {animate:true}); }

  var r = active();

/* ---------- the hole card: the whole story of a hole ----------
   Shots are measured by GPS; everything a phone cannot see - putts, bunkers, penalty strokes -
   is entered once when the hole is finished. Score is worked out from all three, and can be
   overridden, because a round where a shot went unrecorded should still show the score you made. */
var PEN_KINDS = [['water','Penalty area / water'], ['ob','Out of bounds'], ['lost','Lost ball'], ['unpl','Unplayable']];

function scoreName(d){
  if (d === 0) return 'par';
  if (d === -1) return 'birdie';
  if (d === -2) return 'eagle';
  if (d === -3) return 'albatross';
  if (d === 1) return 'bogey';
  if (d === 2) return 'double bogey';
  if (d === 3) return 'triple bogey';
  return d > 0 ? d + ' over' : (-d) + ' under';
}
function blankCard(){ return {putts:[], pen:{water:0,ob:0,lost:0,unpl:0}, bunker:{fw:0,gs:0}, score:null, note:''}; }
function cardOf(h){ return (h && h.card) || null; }

function bunkerTotal(c){ return c ? BUNK_KINDS.reduce(function(t, k){ return t + (c.bunker[k[0]] || 0); }, 0) : 0; }
function puttCount(h){
  var c = cardOf(h);
  if (c && c.putts.length) return c.putts.length;
  return (h && h.green && h.green.putts != null) ? h.green.putts : 0;
}
function countedShots(h){ return h ? h.shots.filter(function(s){ return !s.excluded; }).length : 0; }
function autoScore(h){ return countedShots(h) + puttCount(h) + penTotal(cardOf(h)); }

/* ---------- keeping the labels readable ----------
   Permanent labels pile on top of each other wherever shots bunch up, which is exactly around a
   green. Lay them out in screen space: the ones that matter most keep their place, the rest are
   nudged clear, and anything with nowhere left to go is hidden rather than left as mush. It is
   redone whenever the map moves, turns or is redrawn, so it always suits what is on screen. */
var DE_PAD = 3, DE_TRIES = 10;
function declutter(){
  var host = $('#map'); if (!host) return;
  var els = Array.prototype.slice.call(host.querySelectorAll('.leaflet-tooltip.dtip'));
  if (!els.length) return;
  els.forEach(function(e){ e.style.translate = ''; e.classList.remove('hid'); });
  var boxes = els.map(function(e){
    var r = (e.querySelector('.urot') || e).getBoundingClientRect();
    return {e:e, x:r.left, y:r.top, w:r.width, h:r.height,
            pr:e.classList.contains('p1') ? 1 : (e.classList.contains('p3') ? 3 : 2)};
  });
  boxes.sort(function(a, b){ return a.pr - b.pr || a.y - b.y; });
  // the pins and the flag are what the labels are about: never sit on top of one
  var vp = $('#mapWrap').getBoundingClientRect();
  var placed = Array.prototype.slice.call(host.querySelectorAll('.leaflet-marker-icon')).map(function(m){
    var r = (m.firstElementChild || m).getBoundingClientRect();
    return {x:r.left, y:r.top, w:r.width, h:r.height};
  }).filter(function(q){ return q.w && q.h; });
  function clash(x, y, w, h){
    for (var i = 0; i < placed.length; i++){
      var q = placed[i];
      if (x + w + DE_PAD > q.x && x < q.x + q.w + DE_PAD && y + h + DE_PAD > q.y && y < q.y + q.h + DE_PAD) return true;
    }
    return false;
  }
  function inView(y, h){ return y >= vp.top - 2 && y + h <= vp.bottom + 2; }
  boxes.forEach(function(b){
    var step = b.h + DE_PAD, dy = 0, ok = inView(b.y, b.h) && !clash(b.x, b.y, b.w, b.h);
    for (var i = 1; !ok && i <= DE_TRIES; i++){
      dy = (i % 2 ? 1 : -1) * Math.ceil(i / 2) * step;   // out from where it wants to be, both ways
      ok = inView(b.y + dy, b.h) && !clash(b.x, b.y + dy, b.w, b.h);
    }
    if (!ok){ b.e.classList.add('hid'); return; }
    if (dy){ var v = rotIn(0, dy); b.e.style.translate = v.x.toFixed(1) + 'px ' + v.y.toFixed(1) + 'px'; }
    placed.push({x:b.x, y:b.y + dy, w:b.w, h:b.h});
  });
}

    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b, i){

function missChips(el, get, set){
  function draw(){
    var cur = get();
    el.innerHTML = MISSES.map(function(o){ return '<button class="chip' + (cur.indexOf(o) >= 0 ? ' on' : '') + '">' + esc(o) + '</button>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b, i){

/* ---------- hit shot ---------- */
/* Walking to the next tee is the moment the putts and the score are lost for good, so ask here. */
function nagUnfinished(){
  var h = curHole();
  if (!h || !h.shots.length || h.green) return false;
  if (!confirm('Hole ' + h.n + ' has ' + h.shots.length + ' shot' + (h.shots.length === 1 ? '' : 's') + ' logged but was never finished, so it has no putts and no score.\n\nOK = finish it now, Cancel = move on without them.')) return false;
  onGreen(); return true;
}
function goNext(){
  var r = active(), h = curHole();
  if (r.cur < r.holes.length - 1) r.cur++;
  else { r.holes.push({n:nextN(h.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
  save(); renderHole(true);
}
var lastLog = null;

function hideResult(){ $('#resultCard').hidden = true; lastLog = null; }
function undoLast(){
  var u = lastLog; if (!u) return;
  hideResult();
  var r = null; S.rounds.forEach(function(x){ if (x.id === u.rid) r = x; });
  if (!r) return;
  r.holes.forEach(function(h){ h.shots = h.shots.filter(function(s){ return s.id !== u.shotId; }); });
  if (u.remarked){ // a re-mark moved an existing shot instead of adding one: put it back
    r.holes.forEach(function(h){ h.shots.forEach(function(x){
      if (x.id === u.remarked.id){ x.lat = u.remarked.was.lat; x.lng = u.remarked.was.lng; x.club = u.remarked.was.club; }
    }); });
  }
  if (u.greenOf){ r.holes.forEach(function(h){ if (h.n === u.greenOf) h.green = null; }); }
  if (u.closedId && u.club !== undefined){ // put the closed shot's club back the way it was
    r.holes.forEach(function(h){ h.shots.forEach(function(x){ if (x.id === u.closedId) x.club = u.club; }); });
  }
  if (u.newRound && !r.holes.some(function(h){ return h.shots.length; })){
    S.rounds = S.rounds.filter(function(x){ return x.id !== r.id; }); store.del('trail:' + r.id);
    S.activeId = u.prevActive; S.playingId = u.prevPlaying;
  } else {
    while (r.holes.length > u.holesLen && !r.holes[r.holes.length - 1].shots.length) r.holes.pop();
    r.cur = Math.min(u.cur, r.holes.length - 1);
  }
  if (u.plan){ plan = u.plan; planKey = holeKey(); $('#planBtn').classList.add('on'); renderPlanBox(false); }
  save(); renderHole(false); toast('Undone');
}

/* Makes sure there is a round and a live hole to log into. Returns null if the golfer cancels. */
function ensureHole(snap){
  var r = active();
  if (r && r.ended){
    if (confirm('This round was ended ' + niceDate(r.ended) + '.\n\nOK = start a new round, Cancel = add to that one and pick it back up.')){
      r = newRound(''); snap.newRound = true; if (plan) planKey = holeKey(); renderHole(false);
    } else { resumeRound(r, true); }
  }
  if (r && !r.keepOpen && Date.now() - r.started > 12 * 3600 * 1000){
    if (confirm('The current round started ' + niceDate(r.started) + '. Start a new round?\n\nOK = new round, Cancel = keep adding to the old one.')){
      r = newRound(''); snap.newRound = true; if (plan) planKey = holeKey(); renderHole(false);
    } else { r.keepOpen = true; save(); }
  }
  if (!r){ r = newRound(''); snap.newRound = true; if (plan) planKey = holeKey(); renderHole(false); }
  snap.rid = r.id; snap.holesLen = r.holes.length; snap.cur = r.cur;
  var h = curHole();
  if (h.green){
    var lastIdx = r.holes.length - 1, tgt = r.holes[lastIdx];
    var label = tgt.green ? nextN(tgt.n) : tgt.n;
    if (!confirm('Hole ' + h.n + ' is finished. Start hole ' + label + '?\n\nCancel, then tap the hole number at the top to jump to any hole.')) return null;
    var keepPlan = plan; r.cur = lastIdx;
    if (tgt.green){ r.holes.push({n:nextN(tgt.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
    save(); if (keepPlan) planKey = holeKey(); renderHole(true); h = curHole();
  }
  return {r:r, h:h};
}
/* Uses the locked average when it is ready, otherwise averages briefly (and asks about weak or stale GPS). */
function grabPosition(){
  var ls = lockState();
  if (ls.locked){ cap = null; return Promise.resolve(Object.assign({}, ls.pos, {stale:false, ageS:0, weak:false, locked:true, lockS:ls.spanS})); }
  startCapture(); return awaitCapture();
}

/* A second mark at the same ball, this soon and this close, is a re-mark, not a new shot. */
var REMARK_MS = 120000, REMARK_YD = 6;
/* Drops your ball position. plan and club are optional (PLAN then Go supplies both). */
function markBall(opts){
  opts = opts || {};
  if (!booted) return Promise.resolve(null);
  keepAwake(); hideResult();
  var snap = {prevActive:S.activeId, prevPlaying:S.playingId, newRound:false, plan:plan};
  var ctx = ensureHole(snap);
  if (!ctx) return Promise.resolve(null);
  var r = ctx.r, h = ctx.h;
  var usePlan = (opts && opts.plan) || null;
  return grabPosition().then(function(pos){
    if (!pos) return null;
    /* Tapping RECORD twice at the same ball used to make a second shot a yard from the first,
       which then measured as a 0 yd shot and pushed every club distance onto the wrong stroke.
       A second mark at the same spot within two minutes is the same ball: update it, do not add. */
    var last = h.shots[h.shots.length - 1];
    if (last && !opts.forceNew && Date.now() - last.t < REMARK_MS && yd(distM(last, pos)) < REMARK_YD){
      var was = {lat:last.lat, lng:last.lng, club:last.club};
      last.lat = pos.lat; last.lng = pos.lng; last.acc = pos.acc; last.n = pos.n; last.t = Date.now();
      Object.assign(last, gpsQ(pos));
      if (pos.locked) last.lockS = pos.lockS;
      if (opts && opts.club) last.club = opts.club;
      if (usePlan) last.plan = usePlan;
      markPlaying(r);
      if (usePlan) endPlan(true);
      save(); follow = true; renderHole(false);
      snap.shotId = null; snap.remarked = {id:last.id, was:was};
      lastLog = snap;
      return {h:h, shot:last, closed:null, pos:pos, remarked:true, opts:opts};
    }
    var closed = openShot(h);
    planForHole(r, h, true);   // playing a planned hole: the round keeps the plan as it stood
    var shot = Object.assign({id:uid(), club:(opts && opts.club) || null, lie:h.shots.length === 0 ? 'Tee' : null,
      lat:pos.lat, lng:pos.lng, acc:pos.acc, n:pos.n, t:Date.now(), strike:null, miss:[], excluded:false}, gpsQ(pos));
    if (pos.locked) shot.lockS = pos.lockS;
    if (usePlan) shot.plan = usePlan;
    markPlaying(r);
    h.shots.push(shot);
    if (usePlan) endPlan(true);
    save(); follow = true; renderHole(false);
    snap.shotId = shot.id; snap.closedId = closed ? closed.id : null; snap.club = closed ? closed.club : undefined;
    lastLog = snap;
    return {h:h, shot:shot, closed:closed, pos:pos};
  });
}

/* RECORD: measures the shot you just hit, then marks your new ball position. */
function onRecord(){
  markBall({}).then(function(res){
    if (!res) return;
    var h = res.h, closed = res.closed;
    if (res.remarked){ showResult({main:'Ball re-marked', sub:'Same spot as your last mark, so it was moved rather than counted as another shot' + gpsNote(res.pos), h:h, shot:res.shot, ask:!res.shot.club, separate:res.opts}); return; }
    if (!closed){ showResult({main:'Ball marked', sub:'Tap RECORD again at your next ball' + gpsNote(res.pos), h:h}); return; }
    var i = h.shots.indexOf(closed), d = shotDistYd(h, i), pr = planResultFor(h, i);
    showResult({
      main:(closed.club ? closed.club + ' · ' : '') + r0(d) + ' yd',
      sub:(pr ? missText(pr) + ' from your aim' + (pr.inside ? ' · inside your pattern' : ' · outside your pattern') : 'GPS total distance, carry plus roll') + gpsNote(res.pos),
      h:h, shot:closed, ask:!closed.club

  });
}
function onPlanGo(){
  if (!plan) return;
  var p = {lat:plan.aim.lat, lng:plan.aim.lng, club:plan.club, shape:plan.pat.shape, L:plan.pat.L, R:plan.pat.R, S:plan.pat.S, G:plan.pat.G};

        sub:'Aiming ' + r0(yd(distM(res.shot, p))) + ' yd. Your ball stays where you marked it \u2014 walk on and tap I\u2019M AT MY BALL when you get there.',
        h:h, shot:res.shot, ask:!res.shot.club});

/* Editing one shot: the club, how it was struck, where it missed, or moving the marker. */
/* Forgetting to tap the next hole at the tee puts a whole hole's shots on the hole before it.
   Deleting and re-recording loses the GPS position, which was the point of recording it, so
   shots move between holes instead, keeping everything they carry. */
function holeForN(r, n){
  for (var i = 0; i < r.holes.length; i++) if (r.holes[i].n === n) return r.holes[i];
  var h = {n:n, shots:[], green:null};
  r.holes.push(h);
  r.holes.sort(function(a, b){ return a.n - b.n; });
  return h;
}
function moveShots(src, from, toN, andAfter){
  var r = active(); if (!r || !src) return 0;
  var moving = andAfter ? src.shots.slice(from) : [src.shots[from]];
  if (!moving.length || !moving[0]) return 0;
  var tgt = holeForN(r, toN);
  if (tgt === src) return 0;
  src.shots.splice(from, moving.length);
  moving.forEach(function(sh){
    var at = tgt.shots.length;
    for (var k = 0; k < tgt.shots.length; k++) if (tgt.shots[k].t > sh.t){ at = k; break; }
    tgt.shots.splice(at, 0, sh);
  });
  save();
  return moving.length;
}
window.__moveShots = moveShots;
function openMoveShot(h, i){
  var r = active(); if (!r) return;

  el.querySelector('#hn').innerHTML = ns.map(function(n){
    return '<button class="chip' + (n === h.n ? ' on' : '') + '" data-n="' + n + '"' + (n === h.n ? ' disabled' : '') + '>' + n + '</button>';
  }).join('');
  Array.prototype.forEach.call(el.querySelectorAll('#hn .chip'), function(b){
    b.onclick = function(){

      var n = moveShots(h, i, +b.dataset.n, !!(box && box.checked));

/* ---------- finishing a hole: the whole story ---------- */
function onGreen(){

}

window.__openCard = openCard;

/* One sheet, used to finish a hole and to edit it afterwards. Only the distance is asked for;
   putts, bunkers and penalty strokes are there for anyone who wants the full picture. */
function openCard(h, mode){
  var finish = mode === 'finish';
  var g = h.green || null;
  var c = h.card ? JSON.parse(JSON.stringify(h.card)) : blankCard();
  var scoreTouched = c.score != null;
  var lastI = h.shots.length - 1, lastD = lastI >= 0 ? shotDistYd(h, lastI) : null;

  var el = openSheet(
    '<h3>' + (finish ? 'Finish hole ' : 'Hole ') + h.n + '</h3>' +
    '<div class="sub">' + (finish
      ? 'Stand at your ball on the green. Only the distance is needed \u2014 the rest is there when you want the whole story.'
      : ((lastD != null ? 'Last shot ' + r0(lastD) + ' yd \u00b7 ' : '') + 'GPS \u00b1' + r0(yd((g && g.acc) || 0)) + ' yd')) + '</div>' +
    '<label class="fl">Feet to pin<input id="ft" type="number" inputmode="decimal" min="0" step="0.5" placeholder="e.g. 18" value="' + (g && g.feet != null ? g.feet : '') + '"></label>' +
    '<label class="chk"><input type="checkbox" id="holed"' + (g && g.holed ? ' checked' : '') + '> Holed out from off the green</label>' +
    '<div class="fl">Par</div><div class="chips" id="parC"></div>' +
    '<div class="fl">Putts</div><div class="chips" id="puttN"></div><div id="puttList"></div>' +
    '<div class="fl">Bunkers and penalty strokes</div><div id="trouble"></div>' +
    '<div class="fl">Score</div><div id="scoreStep"></div><div class="scoreline" id="scoreWhy"></div>' +
    '<label class="fl">Note<input id="cnote" type="text" maxlength="120" placeholder="anything worth remembering" value="' + esc(c.note || '') + '"></label>' +
    (finish || !greenPos(h) ? '' : '<div class="row"><button class="btn sec" id="move">Move marker</button><button class="btn danger" id="reopen">Reopen hole</button></div>') +
    '<div class="row"><button class="btn ghost" id="cancel">Cancel</button><button class="btn pri" id="fin">' + (finish ? 'Finish hole' : 'Save') + '</button></div>',
    function(){ cap = null; });

  var ft = el.querySelector('#ft'), holed = el.querySelector('#holed');
  ft.disabled = holed.checked;
  holed.onchange = function(){ ft.disabled = holed.checked; if (holed.checked) ft.value = '0'; drawScore(); };

  function firstFt(){ var v = ft.value.trim(); return v === '' ? null : Number(v); }
  function setCount(n){
    while (c.putts.length > n) c.putts.pop();
    while (c.putts.length < n) c.putts.push({ft:(c.putts.length === 0 ? firstFt() : null), read:null, act:null, out:null});

  }
  function drawCount(){
    chips(el.querySelector('#puttN'), ['0','1','2','3','4','5'],
      function(){ return String(c.putts.length); },
      function(v){ setCount(v == null ? 0 : +v); });
  }

    var box = el.querySelector('#puttList');

/* ---------- review a round ---------- */
var GAP_HINT_YD = 30;

    h.shots.forEach(function(sh, si){

        out.push({kind:'monster', hi:hi, si:si, text:'Hole ' + h.n + ', shot ' + (si + 1) + ' measures ' + r0(d) + ' yd',
                  why:'Longer than any golf shot \u2014 usually the drive home, or a hole change that was missed.',
                  fix:'Delete it'});
      if (si > 0){
        var pv = h.shots[si - 1];

          out.push({kind:'dup', hi:hi, si:si, text:'Hole ' + h.n + ', shots ' + si + ' and ' + (si + 1) + ' are ' + r0(yd(distM(pv, sh))) + ' yd apart',

                    fix:'Delete the second'});

  var c = courseForRound(r);
  if (c && c.greens){
    var ns = Object.keys(c.greens).sort(function(a, b){ return +a - +b; });
    ns.forEach(function(na, i){
      ns.slice(i + 1).forEach(function(nb){
        var gap = yd(distM(c.greens[na], c.greens[nb]));
        if (gap > DUP_GREEN_YD) return;
        out.push({kind:'dupgreen', n:+nb,
                  text:'Holes ' + na + ' and ' + nb + ' share a green pin',
                  why:'Their centres are ' + (gap < 1 ? 'less than a yard' : r0(gap) + ' yd') + ' apart, so one is on the wrong hole. Every yardage on that hole is wrong until it is moved.',
                  fix:'Re-place hole ' + nb});

    if (near) return;
    out.push({kind:'stand', hi:pt[4], pi:pi,

              why:'A stand that long with nothing recorded is usually a shot that was missed.', fix:'Add a shot there'});
  });

}

/* ---------- stats ---------- */
function computeStats(rounds, pureOnly){
  var by = {};
  rounds.forEach(function(r){ r.holes.forEach(function(h){ h.shots.forEach(function(s, i){
    if (s.excluded || !s.club) return;
    if (pureOnly && s.strike !== 'Pure') return;
    var d = shotDistYd(h, i); if (d == null) return;
    (by[s.club] = by[s.club] || []).push(d);
  }); }); });
  var order = S.settings.clubs;
  return Object.keys(by).map(function(club){
    var a = by[club].slice().sort(function(x, y){ return x - y; }), n = a.length;
    var mean = a.reduce(function(t, x){ return t + x; }, 0) / n;
    var med = n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2;
    var sd = n > 1 ? Math.sqrt(a.reduce(function(t, x){ return t + (x - mean) * (x - mean); }, 0) / (n - 1)) : null;
    return {club:club, n:n, mean:mean, median:med, min:a[0], max:a[n-1], sd:sd};
  }).sort(function(x, y){
    var ix = order.indexOf(x.club), iy = order.indexOf(y.club);
    if (ix < 0) ix = 999; if (iy < 0) iy = 999;
    return ix - iy || y.mean - x.mean;
  });
}

   being saved, sent and reopened with no fonts or images to fetch. Scoring is carried by shape -
   circles under par, squares over - with colour only reinforcing it, so it reads for everyone. */
