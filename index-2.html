<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<meta name="theme-color" content="#0f5132">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Shot Tracker</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
:root{--g:#0f5132;--g2:#198754;--ink:#111;--mut:#555;--line:#d6d6d6;--red:#c62828}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:#e9ece9;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer}
#map{position:fixed;top:0;left:0;right:0;bottom:200px;background:#cfd8cf}
#top{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top) + 8px) 10px 8px;display:flex;align-items:center;gap:8px;z-index:1000;pointer-events:none}
#top>*{pointer-events:auto}
.ib{width:44px;height:44px;border-radius:12px;border:0;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);font-size:22px;font-weight:700;display:flex;align-items:center;justify-content:center}
#holeNav{display:flex;align-items:center;background:#fff;border-radius:12px;box-shadow:0 1px 5px rgba(0,0,0,.35)}
#holeNav .ib{box-shadow:none;background:none;font-size:28px}
#holeLabel{border:0;background:none;font-weight:800;font-size:18px;min-width:80px;height:44px}
.pill{margin-left:auto;padding:9px 12px;border-radius:999px;font-weight:800;font-size:14px;background:#fff;box-shadow:0 1px 5px rgba(0,0,0,.35);white-space:nowrap}
.pill.good{color:#0a7a33}.pill.fair{color:#a86b00}.pill.poor{color:var(--red)}
#fabs{position:fixed;right:10px;bottom:230px;z-index:1000;display:flex;flex-direction:column;gap:8px}
#panel{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:18px 18px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.25);padding:12px 16px calc(env(safe-area-inset-bottom) + 12px);z-index:1000}
#liveNum{font-size:46px;font-weight:900;line-height:1.05;letter-spacing:-1px}
#liveSub{color:var(--mut);font-size:14px;margin-top:2px}
#lastCard{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.lcHead{display:flex;justify-content:space-between;align-items:center;font-weight:700;font-size:15px}
.link{border:0;background:none;color:var(--g2);font-weight:800;padding:6px 0 6px 12px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:8px 12px;border-radius:999px;border:1.5px solid #b9b9b9;background:#fff;font-size:14px;font-weight:700}
.chip.on{background:var(--g);border-color:var(--g);color:#fff}
.clab{flex:none;align-self:center;font-size:12px;color:var(--mut);width:46px;font-weight:700;text-transform:uppercase}
.actions{display:grid;grid-template-columns:0.9fr 1fr 1.4fr;gap:8px;margin-top:10px}
.actions .btn{font-size:16px;padding:0 4px}
.plan{background:#fff3e0;color:#8a4b00;border:2px solid #ff9800}
.plan.on{background:#ff9800;color:#111}
#planBox{margin-top:6px}
.planHead{display:flex;justify-content:space-between;align-items:flex-start}
.pnum{font-size:34px;font-weight:900;line-height:1.05}
.psub{color:var(--mut);font-size:13px}
.planRow{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:4px;font-size:14px;font-weight:700}
.planRow>span:last-child{white-space:nowrap;flex:none}
.mini{min-width:40px;height:38px;border-radius:10px;border:1.5px solid #bbb;background:#fff;font-weight:800;font-size:16px}
.mini.wide{padding:0 10px;font-size:14px}
.chip.sug{border-color:#ff9800}
.aimx{width:34px;height:34px;border-radius:50%;border:3px solid #fff;background:rgba(255,152,0,.35);box-shadow:0 0 0 2px #ff9800,0 1px 4px rgba(0,0,0,.6);position:relative}
.aimx:before,.aimx:after{content:"";position:absolute;background:#fff;left:50%;top:50%;transform:translate(-50%,-50%)}
.aimx:before{width:2px;height:22px}.aimx:after{width:22px;height:2px}
.aimo{width:16px;height:16px;border-radius:50%;border:3px solid #ff9800;background:transparent}
input[type=range]{width:100%;margin:8px 0}
.split{font-weight:800;font-size:16px}
.btn{height:58px;border-radius:14px;border:0;font-size:18px;font-weight:800;letter-spacing:.3px;width:100%}
.pri{background:var(--g2);color:#fff}.pri:active{background:var(--g)}
.sec{background:#e8f5ec;color:var(--g);border:2px solid var(--g2)}
.ghost{background:#f1f1f1;color:#222}
.danger{background:#fdecea;color:var(--red);border:2px solid #f3b4ae}
#sheetWrap{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:2000;display:flex;align-items:flex-end}
#sheet{background:#fff;width:100%;max-height:90vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
#sheet h3{margin:0 0 4px;font-size:20px}
.sub{color:var(--mut);font-size:14px;margin-bottom:10px}
.fl{display:block;font-size:13px;font-weight:800;color:var(--mut);text-transform:uppercase;margin:12px 0 4px}
.fl input,.fl select,.fl textarea{display:block;width:100%;margin-top:4px;font-size:18px;padding:10px;border:1.5px solid #bbb;border-radius:10px;background:#fff;color:var(--ink);font-family:inherit;text-transform:none;font-weight:600}
#ft{font-size:30px;font-weight:800}
.chk{display:flex;align-items:center;gap:10px;font-size:16px;font-weight:600;margin:14px 0}
.chk input{width:22px;height:22px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.stack{display:grid;gap:10px;margin-top:12px}
.clubs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.clubs button{height:58px;border-radius:12px;border:1.5px solid #c4c4c4;background:#f6f7f6;font-size:17px;font-weight:800}
.clubs button:active{background:var(--g2);color:#fff}
.menu button{display:block;width:100%;text-align:left;padding:15px 12px;border:0;border-bottom:1px solid var(--line);background:none;font-size:17px;font-weight:700}
.rlist .ritem{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.ritem .rt{font-weight:800}.ritem .rs{color:var(--mut);font-size:13px;margin:2px 0 8px}
.ritem .rb{display:flex;gap:8px}
.ritem .rb button{flex:1;padding:9px;border-radius:10px;border:1.5px solid #bbb;background:#fff;font-weight:700;font-size:14px}
.tag{display:inline-block;background:var(--g2);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px;margin-left:6px;vertical-align:middle}
.tblwrap{overflow-x:auto;margin-top:8px}
table.stats{border-collapse:collapse;width:100%;font-size:15px;font-variant-numeric:tabular-nums}
table.stats th,table.stats td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
table.stats th:first-child,table.stats td:first-child{text-align:left}
table.stats th{font-size:12px;color:var(--mut);text-transform:uppercase}
.note{font-size:13px;color:var(--mut);line-height:1.4;margin-top:10px}
.guide{font-size:15px;line-height:1.5}
.guide .hero{background:linear-gradient(135deg,#0f5132,#198754);color:#fff;border-radius:16px;padding:20px 18px;margin-bottom:14px}
.guide .hero h2{margin:0 0 6px;font-size:26px;letter-spacing:-.5px}
.guide .hero p{margin:0;font-size:16px;opacity:.95}
.guide h4{margin:20px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.6px;color:var(--g2)}
.guide .sell{display:grid;gap:10px}
.guide .card{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.guide .card b{display:block;font-size:16px;margin-bottom:2px}
.guide ol{padding-left:0;list-style:none;counter-reset:st;margin:0}
.guide ol>li{counter-increment:st;position:relative;padding:0 0 12px 40px}
.guide ol>li:before{content:counter(st);position:absolute;left:0;top:0;width:28px;height:28px;border-radius:50%;background:var(--g2);color:#fff;font-weight:900;display:flex;align-items:center;justify-content:center;font-size:14px}
.guide ul{margin:4px 0 0;padding-left:18px}
.guide .k{display:inline-block;padding:1px 7px;border-radius:6px;font-weight:800;font-size:13px;background:#eef3ef;border:1px solid #cfdcd2;white-space:nowrap}
.guide .k.hit{background:var(--g2);color:#fff;border-color:var(--g2)}
.guide .k.plan{background:#ff9800;color:#111;border-color:#ff9800}
.guide .honest{background:#fff8e6;border:1px solid #f3d9a4;border-radius:12px;padding:12px 14px}
.seg{display:flex;border:1.5px solid var(--g2);border-radius:10px;overflow:hidden;margin-top:6px}
.seg button{flex:1;padding:10px;border:0;background:#fff;font-weight:800;color:var(--g)}
.seg button.on{background:var(--g2);color:#fff}
#capOverlay{position:fixed;inset:0;z-index:3000;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.capBox{background:#fff;border-radius:18px;padding:22px;text-align:center;width:min(320px,100%)}
.capBox .big{font-size:52px;font-weight:900}
.capBox .stack{margin-top:14px}
.pill.stale{color:#777}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 64px);z-index:4000;background:#111;color:#fff;padding:12px 16px;border-radius:12px;font-weight:700;font-size:15px;max-width:calc(100% - 32px);box-shadow:0 4px 14px rgba(0,0,0,.35);text-align:center}
.pin{width:28px;height:28px;border-radius:50%;background:#ff9800;border:3px solid #fff;color:#111;font-weight:900;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.pin.ex{background:#9e9e9e}
.flag{width:30px;height:30px;border-radius:50%;background:#fff;border:3px solid #d32f2f;color:#d32f2f;font-weight:900;font-size:16px;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.6)}
.leaflet-tooltip.dtip{background:rgba(17,17,17,.85);color:#fff;border:0;font-weight:800;font-size:13px;padding:3px 7px;border-radius:8px;box-shadow:none}
.leaflet-tooltip.dtip:before{display:none}
#fatal{position:fixed;inset:0;z-index:5000;background:#fff;padding:24px;font-size:17px;line-height:1.5}
</style>
</head>
<body>
<div id="map"></div>

<header id="top">
  <button id="menuBtn" class="ib" aria-label="Menu">&#9776;</button>
  <div id="holeNav">
    <button id="prevHole" class="ib" aria-label="Previous hole">&#8249;</button>
    <button id="holeLabel">Hole 1</button>
    <button id="nextHole" class="ib" aria-label="Next hole">&#8250;</button>
  </div>
  <div id="gps" class="pill poor">GPS &hellip;</div>
</header>

<div id="fabs">
  <button id="layerBtn" class="ib" aria-label="Map type" title="Street / Satellite">&#9707;</button>
  <button id="centerBtn" class="ib" aria-label="Center on me" title="Center on me">&#9678;</button>
</div>

<section id="panel">
  <div id="liveNum">&mdash;</div>
  <div id="liveSub">Tap HIT SHOT at your ball to start.</div>
  <div id="planBox" hidden>
    <div class="planHead"><div><div id="planNum" class="pnum">— yd</div><div id="planSub" class="psub"></div></div><button id="planClose" class="link">Close plan</button></div>
    <div class="chips" id="planClubs"></div>
    <div class="planRow"><span id="planPat"></span><span><button id="pwMinus" class="mini" aria-label="Narrower">&minus;</button> <button id="pwPlus" class="mini" aria-label="Wider">+</button> <button id="planEdit" class="mini wide">Pattern</button></span></div>
  </div>
  <div id="lastCard" hidden>
    <div class="lcHead"><span id="lcTitle"></span><button id="lcEdit" class="link">Edit</button></div>
    <div class="chips"><span class="clab">Strike</span><span id="lcStrike" style="display:contents"></span></div>
    <div class="chips"><span class="clab">Miss</span><span id="lcMiss" style="display:contents"></span></div>
  </div>
  <div class="actions">
    <button id="planBtn" class="btn plan">PLAN</button>
    <button id="greenBtn" class="btn sec">ON GREEN</button>
    <button id="hitBtn" class="btn pri">HIT SHOT</button>
  </div>
</section>

<div id="sheetWrap" hidden><div id="sheet"></div></div>

<div id="capOverlay" hidden>
  <div class="capBox">
    <div id="capTitle">Locking GPS position</div>
    <div class="big" id="capCount">4</div>
    <div class="sub" id="capInfo">Hold still</div>
    <div class="stack">
      <button class="btn ghost" id="capSkip">Use now</button>
      <button class="btn sec" id="capStale" hidden>Use last fix</button>
      <button class="btn sec" id="capWait" hidden>Wait 5 s more</button>
      <button class="btn pri" id="capAnyway" hidden>Record anyway</button>
      <button class="btn ghost" id="capCancel">Cancel</button>
    </div>
  </div>
</div>

<div id="toast" hidden></div>

<script>
(function(){
'use strict';
if (!window.L){ document.body.insertAdjacentHTML('beforeend', '<div id="fatal">The map library did not load. Check your connection and reload.</div>'); return; }

/* ---------- constants ---------- */
var KEY = 'gst.v1';
var M_PER_YD = 0.9144;                 // exact, by definition
var WGS84_A = 6378137;                 // semi-major axis (m)
var WGS84_F = 1 / 298.257223563;       // flattening
var WGS84_E2 = WGS84_F * (2 - WGS84_F);
var DEFAULT_CLUBS = ['Driver','Mini Driver','19° UW','Heavenwood','9 Wood','4 Utility','6i','7i','8i','9i','PW','50°','54°','58°'];
var LIES = ['Tee','Fairway','Rough','Bunker','Fringe','Other'];
var STRIKES = ['Pure','Thin','Fat','Toe','Heel'];
var MISSES = ['Left','Right','Short','Long','On target'];
var MISS_OPP = {Left:'Right', Right:'Left', Short:'Long', Long:'Short'};
var SAT_URL = 'https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=';
var USGS_TILE = 'https://basemap.nationalmap.gov/arcgis/rest/services/USGSImageryOnly/MapServer/tile/';
var MAPBOX_TILE = 'https://api.mapbox.com/v4/mapbox.satellite/';
var MAPBOX_CSS = 'https://api.mapbox.com/mapbox-gl-js/v3.9.4/mapbox-gl.css'; // official stylesheet, used only for the required Mapbox logo
var MAPBOX_TTL_MS = 30 * 24 * 3600 * 1000; // Mapbox terms: on-device cache limited to 30 days
var OFFLINE_MAX_TILES = 3000;
/* Imagery sources that may be saved on the phone.
   key() is the cache key (no access token in it); url() is what is fetched. */
var SOURCES = {
  usgs: {label:'USGS', cache:'st-tiles-usgs-v1', zmin:14, zmax:18, ttl:null,   // z18 ~0.46 m/px at 40° N, finer than the ~1 m NAIP source
    key:function(z,x,y){ return USGS_TILE + z + '/' + y + '/' + x; },
    url:function(z,x,y){ return USGS_TILE + z + '/' + y + '/' + x; }},
  mapbox: {label:'Mapbox', cache:'st-tiles-mapbox-v1', zmin:14, zmax:19, ttl:MAPBOX_TTL_MS, // z19 @2x ~0.11 m/px at 40° N
    key:function(z,x,y){ return MAPBOX_TILE + z + '/' + x + '/' + y + '@2x.jpg80'; },
    url:function(z,x,y){ return MAPBOX_TILE + z + '/' + x + '/' + y + '@2x.jpg80?access_token=' + encodeURIComponent(S.settings.mapboxToken); }}
};
var TRAIL_MIN_STEP_M = 3;
var WEAK_ACC_M = 20;          // above this median accuracy the app asks before recording
var STALE_FIX_MS = 5000;      // pill turns grey when the newest fix is older than this
var TRAIL_MAX_ACC_M = 20;

/* ---------- helpers ---------- */
function $(s){ return document.querySelector(s); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yd(m){ return m / M_PER_YD; }
function r0(x){ return Math.round(x); }

/* Distance on the WGS84 ellipsoid using local radii of curvature at the mean latitude.
   For golf-scale distances (< 1 km) this matches a full geodesic to well under a centimetre. */
function distM(a, b){
  var phi = (a.lat + b.lat) / 2 * Math.PI / 180;
  var s = Math.sin(phi), w = 1 - WGS84_E2 * s * s;
  var Mr = WGS84_A * (1 - WGS84_E2) / Math.pow(w, 1.5);
  var Nr = WGS84_A / Math.sqrt(w);
  var dy = (b.lat - a.lat) * Math.PI / 180 * Mr;
  var dx = (b.lng - a.lng) * Math.PI / 180 * Nr * Math.cos(phi);
  return Math.hypot(dx, dy);
}
window.__distM = distM; // exposed for testing

function isoDate(t){ var d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function niceDate(t){ return new Date(t).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric', year:'numeric'}); }

var toastTimer = null;
function toast(msg, ms){
  var el = $('#toast'); el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(function(){ el.hidden = true; }, ms || 2600);
}

/* ---------- state ---------- */
var APP_VERSION = '1.0.0', SCHEMA = 2;
function defaults(){ return {v:1, schema:SCHEMA, settings:{clubs:DEFAULT_CLUBS.slice(), arcgisKey:'', mapboxToken:'', patterns:{}, avgSeconds:4, basemap:'osm', wake:true}, rounds:[], activeId:null, playingId:null, offlineAreas:[]}; }
function normalize(j){
  var d = defaults();
  if (!j || j.v !== 1) return d;
  j.settings = Object.assign(d.settings, j.settings || {}); j.rounds = j.rounds || []; j.offlineAreas = j.offlineAreas || [];
  if (!('playingId' in j)) j.playingId = null;
  j.schema = SCHEMA;
  return j;
}

/* Storage: IndexedDB (large quota, can be marked persistent). Falls back to localStorage only if
   IndexedDB is unavailable. Keys: 'state' = everything except trails; 'trail:<roundId>' = breadcrumbs. */
var store = (function(){
  var db = null, mode = 'idb';
  var DB = 'shot-tracker', OS = 'kv';
  function lsKey(k){ return k === 'state' ? KEY : 'gst.' + k.replace(':', '.'); } // state -> gst.v1, trail:x -> gst.trail.x
  function req(r){ return new Promise(function(res, rej){ r.onsuccess = function(){ res(r.result); }; r.onerror = function(){ rej(r.error); }; }); }
  return {
    open:function(){
      if (!('indexedDB' in window)){ mode = 'ls'; return Promise.resolve(mode); }
      return new Promise(function(res){
        var q; try { q = indexedDB.open(DB, 1); } catch(e){ mode = 'ls'; return res(mode); }
        q.onupgradeneeded = function(){ q.result.createObjectStore(OS); };
        q.onsuccess = function(){ db = q.result; res(mode); };
        q.onerror = q.onblocked = function(){ mode = 'ls'; res(mode); };
      });
    },
    mode:function(){ return mode; },
    get:function(k){
      if (mode === 'ls'){ try { return Promise.resolve(JSON.parse(localStorage.getItem(lsKey(k)))); } catch(e){ return Promise.resolve(null); } }
      return req(db.transaction(OS, 'readonly').objectStore(OS).get(k));
    },
    put:function(k, v){
      if (mode === 'ls'){ try { localStorage.setItem(lsKey(k), JSON.stringify(v)); return Promise.resolve(); } catch(e){ return Promise.reject(e); } }
      return new Promise(function(res, rej){
        var t; try { t = db.transaction(OS, 'readwrite', {durability:'strict'}); } catch(e){ t = db.transaction(OS, 'readwrite'); }
        t.objectStore(OS).put(v, k); // structured clone happens now, so later edits to S don't leak into this write
        t.oncomplete = function(){ res(); }; t.onerror = t.onabort = function(){ rej(t.error); };
      });
    },
    del:function(k){
      if (mode === 'ls'){ try { localStorage.removeItem(lsKey(k)); } catch(e){} return Promise.resolve(); }
      return new Promise(function(res){ var t = db.transaction(OS, 'readwrite'); t.objectStore(OS).delete(k); t.oncomplete = t.onerror = function(){ res(); }; });
    },
    keys:function(){
      if (mode === 'ls'){
        var out = []; for (var i = 0; i < localStorage.length; i++){ var k = localStorage.key(i); if (k === KEY) out.push('state'); else if (k.indexOf('gst.trail.') === 0) out.push('trail:' + k.slice(10)); }
        return Promise.resolve(out);
      }
      return req(db.transaction(OS, 'readonly').objectStore(OS).getAllKeys());
    }
  };
})();

var S = defaults(), booted = false;
var lastSaveWarn = 0;
function warnSave(){ if (Date.now() - lastSaveWarn > 10000){ lastSaveWarn = Date.now(); toast('Could not save! Phone storage for this app may be full: back up, then delete old rounds.', 6000); } }
var bc = ('BroadcastChannel' in window) ? new BroadcastChannel('shot-tracker') : null;
function save(){
  if (!booted) return;
  store.put('state', S).then(function(){ if (bc) bc.postMessage('saved'); }).catch(warnSave);
}

/* Breadcrumb trails: one record per round, loaded on demand and never overwritten before they have loaded. */
var trails = {}, trailState = {};
function getTrail(r){
  if (!trails[r.id]){ trails[r.id] = []; loadTrail(r.id); }
  return trails[r.id];
}
function loadTrail(id){
  if (trailState[id]) return;
  trailState[id] = 'loading';
  store.get('trail:' + id).then(function(v){
    trailState[id] = 'ready';
    if (v && v.length){ trails[id] = v.concat(trails[id] || []); var r = active(); if (r && r.id === id) trailLine.setLatLngs(trails[id].map(function(p){ return [p[0], p[1]]; })); }
  }).catch(function(){ trailState[id] = 'ready'; });
}
function saveTrail(r){ if (!r || trailState[r.id] !== 'ready') return; store.put('trail:' + r.id, trails[r.id] || []).catch(warnSave); }
var trailDirty = false;
setInterval(function(){ if (trailDirty && booted){ trailDirty = false; saveTrail(active()); } }, 10000);

/* One-time move from the localStorage format used by earlier versions. */
function migrateFromLocal(){
  var raw; try { raw = localStorage.getItem(KEY); } catch(e){ return Promise.resolve(null); }
  if (!raw) return Promise.resolve(null);
  var j; try { j = JSON.parse(raw); } catch(e){ return Promise.resolve(null); }
  if (!j || j.v !== 1) return Promise.resolve(null);
  var trailMap = {};
  (j.rounds || []).forEach(function(r){
    if (r.trail){ if (r.trail.length) trailMap[r.id] = r.trail; delete r.trail; }
    try { var t = JSON.parse(localStorage.getItem('gst.trail.' + r.id)); if (t && t.length) trailMap[r.id] = t; } catch(e){}
  });
  j = normalize(j);
  var writes = [store.put('state', j)].concat(Object.keys(trailMap).map(function(id){ return store.put('trail:' + id, trailMap[id]); }));
  return Promise.all(writes).then(function(){ return store.get('state'); }).then(function(back){
    if (!back || back.rounds.length !== j.rounds.length) throw new Error('verify');
    // verified in IndexedDB: free the old localStorage copy (it shares a small quota with other apps on this site)
    try { localStorage.removeItem(KEY); Object.keys(trailMap).forEach(function(id){ localStorage.removeItem('gst.trail.' + id); });
      (j.rounds || []).forEach(function(r){ localStorage.removeItem('gst.trail.' + r.id); }); } catch(e){}
    return back;
  });
}

/* ---------- GPS ---------- */
var fix = null;       // latest fix {lat,lng,acc,t}
var recent = [];      // fixes from the last 15 s
var cap = null;       // active position capture {start, samples}
var firstFix = true;

function gpsPill(){
  var el = $('#gps');
  if (!fix){ return; }
  var age = Date.now() - fix.t;
  if (age > STALE_FIX_MS){ el.className = 'pill stale'; el.textContent = 'GPS ' + Math.round(age / 1000) + ' s old'; return; }
  var a = fix.acc;
  el.className = 'pill ' + (a <= 5 ? 'good' : a <= 10 ? 'fair' : 'poor');
  el.textContent = 'GPS ±' + r0(yd(a)) + ' yd';
}
setInterval(gpsPill, 1000);
function onPos(p, requested){
  var c = p.coords, now = Date.now(), raw = p.timestamp || now, pt = Math.abs(raw - now) > 30000 ? now : raw; // ignore a badly skewed clock
  fix = {lat:c.latitude, lng:c.longitude, acc:c.accuracy, t:now, pt:pt, lag:Math.max(0, now - pt)};
  // A capture accepts: the answer to the fresh-fix request made at the tap (maximumAge 0), or routine
  // updates received after the tap whose position time is no more than 2 s before it.
  if (cap && now >= cap.start && (requested === true || pt >= cap.start - 2000)) cap.samples.push(fix);

  var ll = [fix.lat, fix.lng];
  youDot.setLatLng(ll); accCircle.setLatLng(ll).setRadius(fix.acc);
  if (!map.hasLayer(youDot)){ accCircle.addTo(map); youDot.addTo(map); }
  if (firstFix){ firstFix = false; map.setView(ll, 18); }
  else if (follow){ map.panTo(ll, {animate:true}); }

  var r = active();
  // only the round actually being played gets a trail (not one opened just to look at), and not after 3 h idle
  if (r && booted && r.id === S.playingId && fix.acc <= TRAIL_MAX_ACC_M && Date.now() - (r.lastAt || r.started) < 3 * 3600 * 1000){
    var tr = getTrail(r), last = tr[tr.length - 1];
    // step at least the reported accuracy, so GPS jitter while standing still doesn't pile up points
    if (!last || distM({lat:last[0], lng:last[1]}, fix) >= Math.max(TRAIL_MIN_STEP_M, fix.acc)){
      tr.push([+fix.lat.toFixed(7), +fix.lng.toFixed(7), Math.round(fix.t/1000)]);
      trailLine.addLatLng(ll); trailDirty = true;
    }
  }
  gpsPill(); updateLive();
  if (plan && !aimDragging){ redrawShapeOnly(); renderPlanInfo(); }
}
function onErr(e){
  var el = $('#gps'); el.className = 'pill poor';
  if (e.code === 1){ el.textContent = 'GPS denied'; toast('Location permission denied. Allow location for this site in your browser settings.', 6000); }
  else { el.textContent = 'No GPS'; }
}
function startGPS(){
  if (!window.isSecureContext){ $('#gps').textContent = 'Needs HTTPS'; toast('GPS only works when this page is opened over https://', 6000); return; }
  if (!navigator.geolocation){ $('#gps').textContent = 'No GPS'; return; }
  navigator.geolocation.watchPosition(onPos, onErr, {enableHighAccuracy:true, maximumAge:0, timeout:30000});
}

/* Position capture.
   - Only fixes taken after the tap count; the app also asks the phone for a brand-new fix at the tap.
   - Fixes are averaged, weighted by 1/accuracy^2. The accuracy recorded is the median of the samples:
     GPS errors are correlated over seconds, so averaging smooths jitter but is not assumed to shrink the error.
   - No fresh fix yet: the app keeps waiting and says so. Using an older fix is an explicit choice and is flagged.
   - Weak fix (median worse than WEAK_ACC_M): the app asks, and never blocks. */
function requestFresh(){ try { navigator.geolocation.getCurrentPosition(function(p){ onPos(p, true); }, function(){}, {enableHighAccuracy:true, maximumAge:0, timeout:15000}); } catch(e){} }
function startCapture(){ cap = {start:Date.now(), samples:[]}; requestFresh(); }
function combine(samples){
  var good = samples.filter(function(f){ return f.acc <= 50; });
  if (good.length) samples = good;
  if (!samples.length) return null;
  var sw = 0, la = 0, lo = 0;
  samples.forEach(function(f){ var w = 1 / Math.pow(Math.max(f.acc, 1), 2); sw += w; la += f.lat * w; lo += f.lng * w; });
  var accs = samples.map(function(f){ return f.acc; }).sort(function(a,b){ return a-b; });
  var m = accs.length, med = m % 2 ? accs[(m-1)/2] : (accs[m/2-1] + accs[m/2]) / 2;
  var lags = samples.map(function(f){ return f.lag || 0; }).sort(function(a,b){ return a-b; });
  return {lat:la/sw, lng:lo/sw, acc:+med.toFixed(1), n:samples.length, lag:lags[Math.floor((lags.length - 1) / 2)]};
}
window.__combine = combine;
function awaitCapture(){
  return new Promise(function(resolve){
    if (!cap) startCapture();
    var need = S.settings.avgSeconds * 1000, iv = null, finished = false, phase = 'avg', extraUntil = 0, lastAsk = Date.now();
    var ov = $('#capOverlay'), bSkip = $('#capSkip'), bStale = $('#capStale'), bWait = $('#capWait'), bAny = $('#capAnyway');
    function fresh(){ return cap ? cap.samples.length : 0; }
    function finish(res){ if (finished) return; finished = true; if (iv) clearInterval(iv); ov.hidden = true; cap = null; resolve(res); }
    function show(title, big, info, b){ $('#capTitle').textContent = title; $('#capCount').textContent = big; $('#capInfo').textContent = info;
      bSkip.hidden = !b.skip; bStale.hidden = !b.stale; bWait.hidden = !b.wait; bAny.hidden = !b.anyway; }
    function accept(){ var pos = combine(cap.samples); if (!pos) return; pos.stale = false; pos.ageS = 0; pos.weak = pos.acc > WEAK_ACC_M; finish(pos); }
    function tick(){
      if (finished) return;
      var el = Date.now() - cap.start, n = fresh();
      if (phase === 'avg'){
        if (el < need){ show('Locking GPS position', Math.ceil((need - el) / 1000), n + ' fresh fix' + (n === 1 ? '' : 'es') + ' so far. Hold still.', {skip:n > 0}); return; }
        if (n === 0) phase = 'wait';
        else if (combine(cap.samples).acc > WEAK_ACC_M) phase = 'weak';
        else { accept(); return; }
      }
      if (phase === 'wait'){
        if (n > 0){ phase = 'avg'; need = 0; tick(); return; }  // a fresh fix arrived: use it
        if (Date.now() - lastAsk > 10000){ lastAsk = Date.now(); requestFresh(); }
        var age = fix ? Math.round((Date.now() - fix.t) / 1000) : null;
        show('Still getting your position', '…', age == null ? 'No GPS fix yet. Open sky helps.' : 'Newest fix is ' + age + ' s old (±' + r0(yd(fix.acc)) + ' yd). Waiting for a fresh one.', {stale:!!fix});
        if (fix) bStale.textContent = 'Use last fix (' + age + ' s old)';
        return;
      }
      if (phase === 'weak'){
        var pos = combine(cap.samples);
        if (extraUntil && Date.now() < extraUntil){ show('Improving position', Math.ceil((extraUntil - Date.now()) / 1000), 'GPS ±' + r0(yd(pos.acc)) + ' yd (phone estimate). Hold still.', {}); return; }
        if (extraUntil && pos.acc <= WEAK_ACC_M){ accept(); return; }
        extraUntil = 0;
        show('Weak GPS', '±' + r0(yd(pos.acc)) + ' yd', 'That is the phone\'s own estimate. Record it now and drag the marker later if needed, or wait a few seconds.', {wait:true, anyway:true});
      }
    }
    bSkip.onclick = function(){ if (fresh() > 0){ need = 0; tick(); } };
    bStale.onclick = function(){ if (!fix) return; finish({lat:fix.lat, lng:fix.lng, acc:fix.acc, n:0, lag:fix.lag, stale:true, ageS:Math.round((Date.now() - fix.t) / 1000), weak:fix.acc > WEAK_ACC_M}); };
    bWait.onclick = function(){ extraUntil = Date.now() + 5000; tick(); };
    bAny.onclick = function(){ accept(); };
    $('#capCancel').onclick = function(){ finish(null); };
    ov.hidden = false; tick();
    if (!finished) iv = setInterval(tick, 200);
  });
}
function gpsQ(pos){ var q = {lagMs:pos.lag || 0}; if (pos.stale){ q.stale = true; q.ageS = pos.ageS; } if (pos.weak) q.weak = true; return q; }
function gpsNote(pos){ return pos.stale ? ' (old GPS fix, ' + pos.ageS + ' s)' : pos.weak ? ' (weak GPS)' : ''; }

function renderHole(fit){
  if (plan && planKey !== holeKey()) endPlan(true);

function updateLive(){

  var last = h && h.shots.length ? h.shots[h.shots.length - 1] : null;
  if (!active()){ num.textContent = '—'; sub.textContent = 'Tap HIT SHOT at your ball to start a round.'; liveLine.setLatLngs([]); return; }
  if (!last){ num.textContent = '—'; sub.textContent = 'Hole ' + h.n + ': at the tee, tap HIT SHOT and pick a club.'; liveLine.setLatLngs([]); return; }
  if (h.green){

function missChips(el, get, set){
  function draw(){
    var cur = get();
    el.innerHTML = MISSES.map(function(o){ return '<button class="chip' + (cur.indexOf(o) >= 0 ? ' on' : '') + '">' + esc(o) + '</button>'; }).join('');
    Array.prototype.forEach.call(el.querySelectorAll('.chip'), function(b, i){
      b.onclick = function(){
        var o = MISSES[i], a = get().slice();
        if (o === 'On target') a = a.indexOf(o) >= 0 ? [] : [o];
        else {
          var had = a.indexOf(o) >= 0;
          a = a.filter(function(x){ return x !== 'On target' && x !== MISS_OPP[o] && x !== o; });
          if (!had) a.push(o);

  }
  draw();
}

/* ---------- hit shot ---------- */
function goNext(){
  var r = active(), h = curHole();
  if (r.cur < r.holes.length - 1) r.cur++;
  else { r.holes.push({n:nextN(h.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
  save(); renderHole(true);

function onHit(){
  if (!booted) return;
  keepAwake();
  var r = active();
  if (r && !r.keepOpen && Date.now() - r.started > 12 * 3600 * 1000){
    if (confirm('The current round started ' + niceDate(r.started) + '. Start a new round for this shot?\n\nOK = new round, Cancel = keep adding to the old one.')){
      r = newRound(''); if (plan) planKey = holeKey(); renderHole(false); // a plan made at this ball carries into the new round
    } else { r.keepOpen = true; save(); }
  }
  if (!r){ r = newRound(''); if (plan) planKey = holeKey(); renderHole(false); }
  var h = curHole();
  if (h.green){
    var lastIdx = r.holes.length - 1, tgt = r.holes[lastIdx];
    var label = tgt.green ? nextN(tgt.n) : tgt.n;
    if (!confirm('Hole ' + h.n + ' is finished. Log this shot on hole ' + label + '?')) return;
    var keepPlan = plan; r.cur = lastIdx;
    if (tgt.green){ r.holes.push({n:nextN(tgt.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
    save(); if (keepPlan) planKey = holeKey(); renderHole(true); h = curHole();
  }
  startCapture();
  var lie = h.shots.length === 0 ? 'Tee' : null;
  var planned = plan ? plan.club : null;
  var el = openSheet(
    '<h3>Hole ' + h.n + ' · Shot ' + (h.shots.length + 1) + '</h3>' +
    '<div class="sub">Stand at your ball. Lie is optional.</div>' +
    '<div class="chips" id="lieC"></div>' +
    (planned ? '<div class="stack"><button class="btn pri" id="hitPlanned">Hit planned ' + esc(planned) + '</button></div><div class="sub" style="margin-top:8px">or pick a different club (the plan is still kept):</div>' : '') +
    '<div class="clubs">' + S.settings.clubs.map(function(c, i){ return '<button data-i="' + i + '">' + esc(c) + '</button>'; }).join('') + '</div>' +
    '<button class="btn ghost" id="cancel">Cancel</button>',
    function(){ cap = null; });
  chips(el.querySelector('#lieC'), LIES, function(){ return lie; }, function(v){ lie = v; });
  el.querySelector('#cancel').onclick = function(){ closeSheet(); };
  function pick(club){
      closeSheet(true);
      var usePlan = plan ? {lat:plan.aim.lat, lng:plan.aim.lng, club:plan.club, shape:plan.pat.shape, L:plan.pat.L, R:plan.pat.R, S:plan.pat.S, G:plan.pat.G} : null;
      awaitCapture().then(function(pos){
        if (!pos){ toast('Shot not recorded.'); return; }
        var prevIdx = h.shots.length - 1;
        var shot = Object.assign({id:uid(), club:club, lie:lie, lat:pos.lat, lng:pos.lng, acc:pos.acc, n:pos.n, t:Date.now(), strike:null, miss:[], excluded:false}, gpsQ(pos));
        markPlaying(r);
        if (usePlan) shot.plan = usePlan;
        h.shots.push(shot);
        if (usePlan) endPlan(true);
        save(); follow = true; renderHole(false);
        if (prevIdx >= 0){
          var p = h.shots[prevIdx], pr = planResultFor(h, prevIdx);
          toast('Shot ' + (prevIdx + 1) + ' (' + p.club + '): ' + r0(shotDistYd(h, prevIdx)) + ' yd' + (pr ? ' · ' + missText(pr) + ' of aim' + (pr.inside ? ' · inside pattern' : ' · outside pattern') : '') + gpsNote(pos), 4500);
        } else toast('Tee shot logged: ' + club + (usePlan ? ' (aim saved)' : '') + gpsNote(pos));
      });
  }
  if (planned) el.querySelector('#hitPlanned').onclick = function(){ pick(planned); };
  Array.prototype.forEach.call(el.querySelectorAll('.clubs button'), function(b){
    b.onclick = function(){ pick(S.settings.clubs[+b.dataset.i]); };
  });
}

/* ---------- on green ---------- */
function onGreen(){

  if (!h || !h.shots.length){ toast('Log at least one shot on this hole first.'); return; }
  if (h.green){ toast('Hole ' + h.n + ' is already finished. Tap the flag to edit.'); return; }
  startCapture();
  var putts = null;
  var el = openSheet(
    '<h3>On the green · Hole ' + h.n + '</h3>' +
    '<div class="sub">Stand at your ball, then enter the distance to the pin.</div>' +
    '<label class="fl">Feet to pin<input id="ft" type="number" inputmode="decimal" min="0" step="0.5" placeholder="e.g. 18"></label>' +
    '<label class="chk"><input type="checkbox" id="holed"> Holed out (0 ft)</label>' +
    '<div class="fl">Putts (optional)</div><div class="chips" id="puttC"></div>' +
    '<div class="row"><button class="btn ghost" id="cancel">Cancel</button><button class="btn pri" id="fin">Finish hole</button></div>',
    function(){ cap = null; });
  var ft = el.querySelector('#ft'), holed = el.querySelector('#holed');
  chips(el.querySelector('#puttC'), ['0','1','2','3','4','5'], function(){ return putts; }, function(v){ putts = v; });
  holed.onchange = function(){ ft.disabled = holed.checked; if (holed.checked) ft.value = '0'; };
  el.querySelector('#cancel').onclick = function(){ closeSheet(); };
  setTimeout(function(){ ft.focus(); }, 50);
  el.querySelector('#fin').onclick = function(){
    var v = ft.value.trim();
    var feet = holed.checked ? 0 : (v === '' ? null : Number(v));
    if (feet != null && (!isFinite(feet) || feet < 0)){ toast('Enter feet as a number, or leave it blank.'); return; }
    var isHoled = holed.checked, p = putts;
    closeSheet(true);
    awaitCapture().then(function(pos){
      if (!pos){ toast('Hole not finished.'); return; }
      h.green = Object.assign({lat:pos.lat, lng:pos.lng, acc:pos.acc, n:pos.n, t:Date.now(), feet:feet, putts:p == null ? (isHoled ? 0 : null) : +p, holed:isHoled}, gpsQ(pos));
      markPlaying(active());
      var i = h.shots.length - 1, d = shotDistYd(h, i);

      var gpr = planResultFor(h, i);
      toast('Hole ' + h.n + ' done. Last shot (' + h.shots[i].club + '): ' + r0(d) + ' yd' + (gpr ? ' · ' + missText(gpr) + ' of aim' : ''), 4500);
      if (plan) endPlan(true);
      goNext();
    });
  };
}

/* ---------- shot planning ---------- */
/* Local flat-earth frame at an origin (east x, north y, metres), using the same WGS84 radii as distM. */
function radii(lat){ var phi = lat * Math.PI / 180, s = Math.sin(phi), w = 1 - WGS84_E2 * s * s; return {M:WGS84_A * (1 - WGS84_E2) / Math.pow(w, 1.5), N:WGS84_A / Math.sqrt(w), c:Math.cos(phi)}; }
function toXY(o, p){ var k = radii(o.lat), d = Math.PI / 180; return {x:(p.lng - o.lng) * d * k.N * k.c, y:(p.lat - o.lat) * d * k.M}; }
function fromXY(o, x, y){ var k = radii(o.lat), d = Math.PI / 180; return {lat:o.lat + y / k.M / d, lng:o.lng + x / (k.N * k.c) / d}; }

var WOODS = /driver|wood|uw|utility|hybrid|mini|heaven|\d\s*w\b|\bw\d/i;
/* Default patterns are placeholders to edit, not derived from your data. */
function patternFor(club){
  var p = S.settings.patterns[club];
  if (p) return p;
  return WOODS.test(club) ? {shape:'arc', width:60, leftPct:50, depth:30, shortPct:50} : {shape:'oval', width:30, leftPct:50, depth:30, shortPct:50};
}
function patYards(p){ // -> {shape, L, R, S, G} in yards
  return {shape:p.shape, L:p.width * p.leftPct / 100, R:p.width * (100 - p.leftPct) / 100, S:p.depth * p.shortPct / 100, G:p.depth * (100 - p.shortPct) / 100};
}
function patText(q){ return (q.shape === 'arc' ? 'Arc ' : 'Oval ') + r0(q.L + q.R) + ' wide (' + r0(q.L) + ' L / ' + r0(q.R) + ' R) · ' + r0(q.S + q.G) + ' deep (' + r0(q.S) + ' short / ' + r0(q.G) + ' long)'; }
function lr(v){ return Math.abs(v) < 0.5 ? '0' : r0(Math.abs(v)) + (v > 0 ? ' R' : ' L'); }
function ls(v){ return Math.abs(v) < 0.5 ? '0' : r0(Math.abs(v)) + (v > 0 ? ' long' : ' short'); }
function patShort(q){ return (q.shape === 'arc' ? 'Arc ' : 'Oval ') + r0(q.L + q.R) + '×' + r0(q.S + q.G) + ' · ' + r0(q.L) + 'L/' + r0(q.R) + 'R'; }
function missText(pr){ return lr(pr.latYd) + ', ' + ls(pr.lonYd); }

/* Pattern outline around the aim, as lat/lng points. Arc = band centred on the ball; oval = four quarter-ellipses. */
function patternPolygon(start, aim, q){
  var A = toXY(start, aim), Rm = Math.hypot(A.x, A.y); if (Rm < 1) return [];
  var ux = A.x / Rm, uy = A.y / Rm, rx = uy, ry = -ux, pts = [], n = 36, k;
  var L = q.L * M_PER_YD, R = q.R * M_PER_YD, Sh = q.S * M_PER_YD, G = q.G * M_PER_YD;
  function at(dx, dy){ return fromXY(start, dx, dy); }
  if (q.shape === 'arc'){
    var a0 = -L / Rm, a1 = R / Rm, rOut = Rm + G, rIn = Math.max(1, Rm - Sh);
    for (k = 0; k <= n; k++){ var a = a0 + (a1 - a0) * k / n; pts.push(at((ux * Math.cos(a) + rx * Math.sin(a)) * rOut, (uy * Math.cos(a) + ry * Math.sin(a)) * rOut)); }
    for (k = n; k >= 0; k--){ var b = a0 + (a1 - a0) * k / n; pts.push(at((ux * Math.cos(b) + rx * Math.sin(b)) * rIn, (uy * Math.cos(b) + ry * Math.sin(b)) * rIn)); }
  } else {
    for (k = 0; k < 72; k++){
      var t = 2 * Math.PI * k / 72, ct = Math.cos(t), st = Math.sin(t);
      var lat = ct * (ct >= 0 ? R : L), lon = st * (st >= 0 ? G : Sh);
      pts.push(at(A.x + rx * lat + ux * lon, A.y + ry * lat + uy * lon));
    }
  }
  return pts.map(function(p){ return [p.lat, p.lng]; });
}

/* Where the ball finished relative to the aim, in yards (right +, long +), and whether it was inside the pattern. */
function planResult(start, aim, end, q){
  var A = toXY(start, aim), E = toXY(start, end), Rm = Math.hypot(A.x, A.y); if (Rm < 1) return null;
  var ux = A.x / Rm, uy = A.y / Rm, rx = uy, ry = -ux;
  var along = E.x * ux + E.y * uy, side = E.x * rx + E.y * ry, inside;
  var L = q.L * M_PER_YD, R = q.R * M_PER_YD, Sh = q.S * M_PER_YD, G = q.G * M_PER_YD;
  if (q.shape === 'arc'){
    var rE = Math.hypot(E.x, E.y), ang = Math.atan2(side, along);
    inside = rE >= Rm - Sh && rE <= Rm + G && ang >= -L / Rm && ang <= R / Rm;
  } else {
    var dx = side, dy = along - Rm, a = dx >= 0 ? R : L, b = dy >= 0 ? G : Sh;
    inside = a > 0 && b > 0 && (dx / a) * (dx / a) + (dy / b) * (dy / b) <= 1;
  }
  return {latYd:yd(side), lonYd:yd(along - Rm), aimYd:yd(Rm), inside:inside};
}
function planResultFor(h, i){ var s = h.shots[i], e = shotEnd(h, i); return s && s.plan && e ? planResult(s, s.plan, e.pt, s.plan) : null; }
window.__planResult = planResult; window.__patternPolygon = patternPolygon; window.__toXY = toXY; window.__fromXY = fromXY;

function computeAimStats(rounds, pureOnly){
  var by = {};
  rounds.forEach(function(r){ r.holes.forEach(function(h){ h.shots.forEach(function(s, i){
    if (s.excluded || !s.plan) return;
    if (pureOnly && s.strike !== 'Pure') return;
    var pr = planResultFor(h, i); if (!pr) return;
    (by[s.club] = by[s.club] || []).push(pr);
  }); }); });
  function mean(a){ return a.reduce(function(t, x){ return t + x; }, 0) / a.length; }
  function sd(a){ if (a.length < 2) return null; var m = mean(a); return Math.sqrt(a.reduce(function(t, x){ return t + (x - m) * (x - m); }, 0) / (a.length - 1)); }
  var order = S.settings.clubs;
  return Object.keys(by).map(function(club){
    var a = by[club], la = a.map(function(x){ return x.latYd; }), lo = a.map(function(x){ return x.lonYd; });
    return {club:club, n:a.length, latMean:mean(la), latSd:sd(la), lonMean:mean(lo), lonSd:sd(lo), insidePct:100 * a.filter(function(x){ return x.inside; }).length / a.length};
  }).sort(function(x, y){ var ix = order.indexOf(x.club), iy = order.indexOf(y.club); if (ix < 0) ix = 999; if (iy < 0) iy = 999; return ix - iy; });
}
window.__computeAimStats = computeAimStats;

var plan = null;           // {aim:{lat,lng}, club, pat:{shape,L,R,S,G}}
var aimDragging = false, planKey = null;
var planLayer = L.layerGroup().addTo(map), aimMarker = null;
var aimIcon = L.divIcon({className:'', html:'<div class="aimx"></div>', iconSize:[34,34], iconAnchor:[17,17]});
var aimDoneIcon = L.divIcon({className:'', html:'<div class="aimo"></div>', iconSize:[16,16], iconAnchor:[8,8]});

function planStart(){ return fix ? {lat:fix.lat, lng:fix.lng} : null; }
function suggestClub(yards){
  var st = computeStats(S.rounds, false), best = null;
  st.forEach(function(x){ if (x.n >= 3 && (!best || Math.abs(x.median - yards) < Math.abs(best.median - yards))) best = x; });
  return best;
}
function startPlan(){
  var st = planStart();
  if (!st){ toast('Waiting for GPS. Planning measures from where you are standing.'); return; }
  // First aim guess: map centre if it is a sensible distance away, otherwise a point up-screen.
  var c = map.getCenter(), aim = {lat:c.lat, lng:c.lng};
  if (yd(distM(st, aim)) < 30){
    var sz = map.getSize ? map.getSize() : {x:390, y:560};
    var p = map.containerPointToLatLng ? map.containerPointToLatLng([sz.x / 2, sz.y * 0.2]) : null;
    if (p) aim = {lat:p.lat, lng:p.lng};
  }
  var h = curHole(), last = S.settings.clubs[0];
  plan = {aim:aim, club:(h && h.shots.length) ? S.settings.clubs[Math.min(6, S.settings.clubs.length - 1)] : last, pat:null};
  var sug = suggestClub(yd(distM(st, aim))); if (sug) plan.club = sug.club;
  plan.pat = patYards(patternFor(plan.club));
  follow = false; planKey = holeKey();
  $('#planBtn').classList.add('on'); $('#liveNum').hidden = true; $('#liveSub').hidden = true;
  renderLastCard(); renderPlanBox(); drawPlan();
  toast('Drag the target, or tap the map, to set your aim.', 3500);
}
function holeKey(){ var r = active(); return (S.activeId || '') + ':' + (r ? r.cur : ''); }
function endPlan(silent){
  plan = null; aimDragging = false; planKey = null; planLayer.clearLayers(); aimMarker = null;
  $('#planBtn').classList.remove('on'); $('#planBox').hidden = true; $('#liveNum').hidden = false; $('#liveSub').hidden = false;
  renderLastCard();
  if (!silent) updateLive();
}
function setAim(ll){ if (!plan) return; plan.aim = {lat:ll.lat, lng:ll.lng}; drawPlan(); renderPlanInfo(); }
map.on('click', function(e){ if (plan) setAim(e.latlng); });

function drawPlan(){
  if (!plan){ planLayer.clearLayers(); aimMarker = null; return; }
  var st = planStart(); if (!st) return;
  planLayer.clearLayers();
  var poly = patternPolygon(st, plan.aim, plan.pat);
  if (poly.length) L.polygon(poly, {color:'#ff9800', weight:2, fillColor:'#ff9800', fillOpacity:0.18, interactive:false}).addTo(planLayer);
  L.polyline([[st.lat, st.lng], [plan.aim.lat, plan.aim.lng]], {color:'#ffffff', weight:3, opacity:0.95, interactive:false})
    .bindTooltip(r0(yd(distM(st, plan.aim))) + ' yd', {permanent:true, direction:'center', className:'dtip'}).addTo(planLayer);
  aimMarker = L.marker([plan.aim.lat, plan.aim.lng], {icon:aimIcon, draggable:true, zIndexOffset:2000}).addTo(planLayer);
  aimMarker.on('dragstart', function(){ aimDragging = true; follow = false; });
  aimMarker.on('drag', function(e){ var ll = e.target.getLatLng(); plan.aim = {lat:ll.lat, lng:ll.lng}; redrawShapeOnly(); renderPlanInfo(); });
  aimMarker.on('dragend', function(){ aimDragging = false; drawPlan(); });
}
function redrawShapeOnly(){
  // cheap redraw while dragging: rebuild everything except the marker being dragged
  var st = planStart(); if (!st || !plan) return;
  planLayer.eachLayer && planLayer.eachLayer(function(l){ if (l !== aimMarker) planLayer.removeLayer(l); });
  var poly = patternPolygon(st, plan.aim, plan.pat);
  if (poly.length) L.polygon(poly, {color:'#ff9800', weight:2, fillColor:'#ff9800', fillOpacity:0.18, interactive:false}).addTo(planLayer);
  L.polyline([[st.lat, st.lng], [plan.aim.lat, plan.aim.lng]], {color:'#ffffff', weight:3, opacity:0.95, interactive:false})
    .bindTooltip(r0(yd(distM(st, plan.aim))) + ' yd', {permanent:true, direction:'center', className:'dtip'}).addTo(planLayer);
  if (!aimMarker) drawPlan();
}
function renderPlanInfo(){
  if (!plan) return;
  var st = planStart(), d = st ? yd(distM(st, plan.aim)) : null;

/* ---------- stats ---------- */
function computeStats(rounds, pureOnly){
  var by = {};
  rounds.forEach(function(r){ r.holes.forEach(function(h){ h.shots.forEach(function(s, i){
    if (s.excluded) return;
    if (pureOnly && s.strike !== 'Pure') return;
    var d = shotDistYd(h, i); if (d == null) return;
    (by[s.club] = by[s.club] || []).push(d);
  }); }); });
  var order = S.settings.clubs;
  return Object.keys(by).map(function(club){
    var a = by[club].slice().sort(function(x, y){ return x - y; }), n = a.length;
    var mean = a.reduce(function(t, x){ return t + x; }, 0) / n;
    var med = n % 2 ? a[(n-1)/2] : (a[n/2-1] + a[n/2]) / 2;
    var sd = n > 1 ? Math.sqrt(a.reduce(function(t, x){ return t + (x - mean) * (x - mean); }, 0) / (n - 1)) : null;
    return {club:club, n:n, mean:mean, median:med, min:a[0], max:a[n-1], sd:sd};
  }).sort(function(x, y){
    var ix = order.indexOf(x.club), iy = order.indexOf(y.club);
    if (ix < 0) ix = 999; if (iy < 0) iy = 999;
    return ix - iy || y.mean - x.mean;
  });
}

/* ---------- offline maps ---------- */
/* Standard Web Mercator tile math (the scheme both USGS and Mapbox use). */
function lng2x(lng, z){ return Math.floor((lng + 180) / 360 * Math.pow(2, z)); }
function lat2y(lat, z){ var r = lat * Math.PI / 180; return Math.floor((1 - Math.log(Math.tan(r) + 1 / Math.cos(r)) / Math.PI) / 2 * Math.pow(2, z)); }
function tilesFor(b, zmin, zmax){
  var out = [];

    var x0 = lng2x(b.w, z), x1 = lng2x(b.e, z), y0 = lat2y(b.n, z), y1 = lat2y(b.s, z);
    for (var x = x0; x <= x1; x++) for (var y = y0; y <= y1; y++) out.push([z, x, y]);
  }
  return out;
}
window.__tilesFor = tilesFor;
function mb(bytes){ return (bytes / 1048576).toFixed(1) + ' MB'; }
function areaSrc(a){ return SOURCES[a.src || 'usgs']; }
function daysLeft(a){ var s = areaSrc(a); return s.ttl ? Math.max(0, Math.ceil((a.t + s.ttl - Date.now()) / 86400000)) : null; }
var offlineOK = ('caches' in window) && ('serviceWorker' in navigator) && window.isSecureContext;
var dl = null; // active download {cancel}

function registerSW(){
  if (!offlineOK) return;
  navigator.serviceWorker.register('sw.js').catch(function(){ offlineOK = false; });
}

function downloadArea(srcName, b, onProgress){
  var src = SOURCES[srcName], tiles = tilesFor(b, src.zmin, src.zmax), i = 0, done = 0, ok = 0, bytes = 0, netErr = 0, httpErr = 0;
  var stamp = String(Date.now());
  dl = {cancel:false};
  var mine = dl;
  return caches.open(src.cache).then(function(cache){
    function worker(){
      if (mine.cancel || i >= tiles.length) return Promise.resolve();
      var t = tiles[i++], key = src.key(t[0], t[1], t[2]);
      return cache.match(key).then(function(hit){
        if (hit && !src.ttl) return hit.blob(); // expiring sources are always refetched so every tile gets a fresh 30-day clock
        // cache:'reload' tells our service worker to go to the network, so a re-save really refetches
        return fetch(src.url(t[0], t[1], t[2]), {mode:'cors', cache:src.ttl ? 'reload' : 'default'}).then(function(res){
          if (!res.ok){ httpErr++; return null; }
          return res.blob().then(function(bl){
            var stored = new Response(bl, {headers:{'Content-Type':res.headers.get('Content-Type') || 'image/jpeg', 'X-Saved-At':stamp}});
            return cache.put(key, stored).then(function(){ return bl; });
          });
        });
      }).then(function(bl){ if (bl){ ok++; bytes += bl.size; } })
        .catch(function(){ netErr++; })
        .then(function(){ done++; onProgress(done, tiles.length, bytes); return worker(); });
    }
    var ws = []; for (var k = 0; k < 6; k++) ws.push(worker());
    return Promise.all(ws);
  }).then(function(){
    if (dl === mine) dl = null;
    return {cancelled:mine.cancel, total:tiles.length, ok:ok, bytes:bytes, netErr:netErr, httpErr:httpErr};
  });
}
function now(){ return Date.now(); }

function deleteAreaTiles(area){
  var src = areaSrc(area), keep = {};
  S.offlineAreas.forEach(function(a){
    if (a.id !== area.id && areaSrc(a) === src) tilesFor(a.b, a.zmin, a.zmax).forEach(function(t){ keep[src.key(t[0], t[1], t[2])] = 1; });
  });
  return caches.open(src.cache).then(function(c){
    return Promise.all(tilesFor(area.b, area.zmin, area.zmax).map(function(t){ return src.key(t[0], t[1], t[2]); })
      .filter(function(k){ return !keep[k]; }).map(function(k){ return c.delete(k); }));
  });
}

/* Remove saved areas whose source has an expiry (Mapbox: 30 days). */
function purgeExpired(){
  if (!offlineOK) return Promise.resolve([]);
  var expired = S.offlineAreas.filter(function(a){ var s = areaSrc(a); return s.ttl && now() - a.t >= s.ttl; });
  return expired.reduce(function(p, a){
    return p.then(function(){ return deleteAreaTiles(a); }).then(function(){
      S.offlineAreas = S.offlineAreas.filter(function(x){ return x.id !== a.id; });
    });
  }, Promise.resolve()).then(function(){
    if (expired.length){ save(); toast('Saved Mapbox imagery for ' + expired.map(function(a){ return a.name; }).join(', ') + ' reached 30 days and was removed. Save it again before you play.', 6000); }
    return expired;
  });
}
window.__purgeExpired = purgeExpired;

function openOffline(){
  if (!offlineOK){
    openSheet('<h3>Offline maps</h3><div class="note">Offline maps need this page opened over https:// in a browser that supports service workers.</div><div class="stack"><button class="btn ghost" id="close">Close</button></div>');
    $('#close').onclick = function(){ closeSheet(); }; return;
  }
  var st = S.settings;
  var srcName = st.basemap === 'mapbox' && st.mapboxToken ? 'mapbox' : 'usgs';
  var el = openSheet(
    '<h3>Offline maps</h3>' +
    '<div class="sub">Saves satellite imagery for the area on your screen, so the map works with no signal. GPS and shot tracking do not need a data signal.</div>' +
    '<div id="areas"></div>' +
    '<div id="prog" class="note" hidden></div>' +
    '<div class="stack"><button class="btn pri" id="saveArea">Save area on screen (' + SOURCES[srcName].label + ')</button><button class="btn danger" id="cancelDl" hidden>Stop download</button></div>' +
    '<div class="note" id="usage"></div>' +
    '<div class="note">How: zoom and pan so the whole course fills the screen, then tap Save. This saves the imagery shown on the map now: ' +
      (srcName === 'mapbox' ? 'Mapbox (zoom 14 to 19). Mapbox terms limit saved imagery to 30 days, so it is removed automatically after that. Fallback order is Mapbox, then OpenStreetMap (online only), then USGS, so save USGS too for an offline fallback that never expires.' : 'USGS (zoom 14 to 18).' + (st.basemap === 'osm' ? ' OpenStreetMap cannot be saved (its rules forbid offline downloads), so USGS is saved as the offline fallback.' : st.basemap === 'sat' ? ' Esri imagery cannot be saved (Esri only allows offline use through its native app toolkits), so USGS is saved as the offline fallback.' : '') + ' To save sharper Mapbox imagery, add a Mapbox token in Settings and switch the map to Mapbox first.') +
    '</div>' +
    '<div class="stack"><button class="btn ghost" id="clearAll">Delete all saved imagery</button><button class="btn ghost" id="close">Close</button></div>');
  function usage(){
    if (navigator.storage && navigator.storage.estimate) navigator.storage.estimate().then(function(e){
      var u = el.querySelector('#usage'); if (u) u.textContent = 'This app is using ' + mb(e.usage || 0) + ' of phone storage' + (e.quota ? ' (browser allows up to ' + mb(e.quota) + ').' : '.');
    });
  }
  function drawAreas(){
    var box = el.querySelector('#areas');
    if (!box) return;
    if (!S.offlineAreas.length){ box.innerHTML = '<div class="note">No saved areas yet.</div>'; return; }
    box.innerHTML = '<div class="rlist">' + S.offlineAreas.map(function(a, idx){
      var d = daysLeft(a);
      return '<div class="ritem"><div class="rt">' + esc(a.name) + ' <span class="tag">' + areaSrc(a).label.toUpperCase() + '</span></div><div class="rs">' + niceDate(a.t) + ' · ' + a.ok + ' of ' + a.total + ' tiles · ' + mb(a.bytes) +
        (d != null ? ' · expires in ' + d + ' day' + (d === 1 ? '' : 's') : '') + '</div>' +
        '<div class="rb"><button data-a="view" data-i="' + idx + '">Show</button><button data-a="del" data-i="' + idx + '">Delete</button></div></div>';
    }).join('') + '</div>';
    Array.prototype.forEach.call(box.querySelectorAll('button'), function(bt){
      bt.onclick = function(){
        var a = S.offlineAreas[+bt.dataset.i];
        if (bt.dataset.a === 'view'){
          follow = false; closeSheet(true); map.fitBounds([[a.b.s, a.b.w], [a.b.n, a.b.e]]);
          var want = a.src === 'mapbox' && S.settings.mapboxToken ? 'mapbox' : 'usgs';
          if (S.settings.basemap !== want){ S.settings.basemap = want; save(); setBase(); }
          return;
        }
        if (!confirm('Delete saved imagery for ' + a.name + '?')) return;
        deleteAreaTiles(a).then(function(){ S.offlineAreas = S.offlineAreas.filter(function(x){ return x.id !== a.id; }); save(); drawAreas(); usage(); });
      };
    });
  }
  el.querySelector('#close').onclick = function(){ closeSheet(); };
  el.querySelector('#clearAll').onclick = function(){
    if (!confirm('Delete all saved map imagery from this phone? Rounds are not affected.')) return;
    Promise.all(Object.keys(SOURCES).map(function(k){ return caches.delete(SOURCES[k].cache); }))
      .then(function(){ S.offlineAreas = []; save(); drawAreas(); usage(); toast('Saved imagery deleted'); });
  };
  el.querySelector('#cancelDl').onclick = function(){ if (dl) dl.cancel = true; };
  el.querySelector('#saveArea').onclick = function(){
    if (dl){ toast('A download is already running.'); return; }
    if (!navigator.onLine){ toast('You need a data or Wi-Fi connection to save an area.'); return; }
    var src = SOURCES[srcName];
    var bb = map.getBounds(), b = {n:bb.getNorth(), s:bb.getSouth(), e:bb.getEast(), w:bb.getWest()};
    var n = tilesFor(b, src.zmin, src.zmax).length;
    if (n > OFFLINE_MAX_TILES){ toast('That area needs ' + n + ' tiles (limit ' + OFFLINE_MAX_TILES + '). Zoom in so just the course fills the screen.', 5000); return; }
    var r = active();
    var name = prompt('Name this area (' + n + ' ' + src.label + ' tiles)', (r && r.course) || 'Course');
    if (name === null) return;
    name = name.trim() || 'Course';
    if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
    var prog = el.querySelector('#prog'), sv = el.querySelector('#saveArea'), cn = el.querySelector('#cancelDl');
    prog.hidden = false; sv.hidden = true; cn.hidden = false;
    downloadArea(srcName, b, function(d, t, by){ prog.textContent = 'Downloading ' + d + ' of ' + t + ' tiles · ' + mb(by); }).then(function(res){
      prog.hidden = true; sv.hidden = false; cn.hidden = true;
      if (res.ok === 0){
        toast(res.netErr ? 'Download failed: no connection, or the imagery server refused the request.' : (res.httpErr ? 'The imagery server rejected the request' + (srcName === 'mapbox' ? ' (check the Mapbox token).' : '.') : 'Nothing was saved.'), 5000);
        return;
      }
      S.offlineAreas.unshift({id:uid(), src:srcName, name:name, b:b, zmin:src.zmin, zmax:src.zmax, total:res.total, ok:res.ok, bytes:res.bytes, t:Date.now()});
      save(); drawAreas(); usage();
      var miss = res.total - res.ok;
      toast((res.cancelled ? 'Stopped. ' : 'Saved. ') + res.ok + ' tiles, ' + mb(res.bytes) + (miss ? ' (' + miss + ' not saved)' : ''), 4500);
    });
  };
  purgeExpired().then(drawAreas); usage();
}


/* ---------- about & tutorial ---------- */
function openGuide(){
  var k = function(t, c){ return '<span class="k' + (c ? ' ' + c : '') + '">' + t + '</span>'; };
  var el = openSheet(
    '<div class="guide">' +
    '<div class="hero"><h2>Shot Tracker</h2><p>Know your real yardages. Pick a smarter target. See exactly how close you came.</p></div>' +

    '<div class="sell">' +
      '<div class="card"><b>Your real numbers, not your best ones</b>Every shot is measured by GPS from where you hit it to where you hit the next one. Over a few rounds you get honest averages, medians and spread for every club in your bag.</div>' +
      '<div class="card"><b>Plan every shot</b>Drop a target on the map and see your dispersion drawn to scale: an arc off the tee, an oval into greens. Set each club\'s pattern to match your shot shape, like 15 yards left and 45 right for a fade.</div>' +
      '<div class="card"><b>The truth after the shot</b>When you reach your ball, the app tells you how far left or right, long or short you finished from your target, and whether it stayed inside your pattern. Your aim results build up club by club.</div>' +
      '<div class="card"><b>Works with no signal</b>The app and your saved course imagery live on your phone. GPS is a satellite signal, so tracking keeps working out where the cell bars disappear.</div>' +
      '<div class="card"><b>No sensors, no subscription, no account</b>Your rounds stay on your phone. Export every shot to a spreadsheet whenever you like.</div>' +
    '</div>' +

    '<h4>Set up once</h4>' +
    '<ol>' +
      '<li><b>Install it.</b> In Chrome tap ⋮ then <i>Add to Home screen</i>. Allow location when asked.</li>' +
      '<li><b>Your bag.</b> ' + k('☰') + ' then <i>Settings</i>: list your clubs in bag order.</li>' +
      '<li><b>Your patterns.</b> In Settings under <i>Dispersion patterns</i>, tap each club. Choose Arc (tee shots) or Circle/oval (approaches), set the total width and depth, then slide the split to match your miss. The presets cover fades and draws.</li>' +
      '<li><b>Sharp satellite (optional).</b> Paste a free ArcGIS key in Settings and pick <i>Sharp satellite (Esri)</i>.</li>' +
      '<li><b>Save your course.</b> At home on Wi-Fi: zoom so the course fills the screen, then ' + k('☰') + ' <i>Offline maps</i> and <i>Save area on screen</i>. That imagery shows even with no signal.</li>' +
    '</ol>' +

    '<h4>Playing a hole</h4>' +
    '<ol>' +
      '<li><b>Wait for good GPS.</b> The pill at the top right shows accuracy. Green is good, amber is fair, red means give it a few seconds.</li>' +
      '<li><b>Plan (optional).</b> Tap ' + k('PLAN', 'plan') + '. Drag the orange target, or tap the map where you want to aim. The big number is your yards to the target. Pick the club; the pattern redraws. Use ' + k('−') + ' ' + k('+') + ' to narrow or widen it, or ' + k('Pattern') + ' to change the split.</li>' +
      '<li><b>Hit.</b> Standing at your ball, tap ' + k('HIT SHOT', 'hit') + ', then the club (or <i>Hit planned</i>). Hold still for about 4 seconds while the app averages fresh GPS readings. If the phone has not delivered a fresh position yet, the app waits and tells you, rather than quietly using an old one.</li>' +
      '<li><b>Walk.</b> The big number counts the yards from your last shot as you walk. Tag the strike and miss on the card if you want. It\'s optional.</li>' +
      '<li><b>Next shot.</b> At your ball, tap ' + k('HIT SHOT', 'hit') + ' again. Your last shot gets its distance, and its result against the target if you planned it.</li>' +
      '<li><b>On the green.</b> Stand at your ball, tap ' + k('ON GREEN') + ', type the feet to the pin, and add putts if you like. <i>Finish hole</i> moves you to the next hole.</li>' +
    '</ol>' +

    '<h4>Fixing and reviewing</h4>' +
    '<ul>' +
      '<li><b>Tap a numbered pin</b> to change the club or tags, drag it to the right spot, delete it, or leave it out of your stats (punch-outs, penalties).</li>' +
      '<li><b>Took a drop or re-teed?</b> The shot before it now measures to your drop, not to where the ball finished. Tap that shot\'s pin and choose <i>Exclude from club stats</i>.</li>' +
      '<li><b>Tap the flag</b> to edit feet to pin, putts, or reopen a hole.</li>' +
      '<li><b>Tap the hole number</b> to renumber it, for example when you start on 10. Use ' + k('‹') + ' ' + k('›') + ' to move between holes.</li>' +
      '<li>' + k('☰') + ' <i>Club distances</i> shows your averages, medians and spread, plus aim results for planned shots. <i>Export</i> and <i>Backup</i> are in the same menu.</li>' +
      '<li>The map button cycles map types, and ' + k('◎') + ' re-centers on you.</li>' +
    '</ul>' +

    '<h4>Good to know</h4>' +
    '<div class="honest"><ul style="margin:0">' +
      '<li><b>GPS is good, not perfect.</b> Phones are typically accurate to about 5 meters (16 feet) in open sky, so any single distance can be a few yards off. The ± the app shows is the phone\'s own estimate, and real errors can be larger. Averages over many shots are where the value is. You can drag a marker to correct a bad one.</li>' +
      '<li><b>Distances are total, not carry.</b> They measure where the ball stopped, roll included.</li>' +
      '<li><b>Aim results use where the ball finished,</b> since that is where you hit your next shot from.</li>' +
      '<li><b>Keep the app on screen.</b> Phones pause GPS for web apps when the screen locks, so the breadcrumb trail has gaps then. Shots are captured when you tap, so they are not affected.</li>' +
      '<li><b>Your data lives on this phone only.</b> Use <i>Backup</i> now and then. It is a plain JSON file you own, and <i>Export</i> gives every shot as a spreadsheet.</li>' +
    '</ul></div>' +

    '<div class="stack"><button class="btn pri" id="close">Let\'s play</button></div>' +
    '</div>');
  el.querySelector('#close').onclick = function(){ closeSheet(); };
}

/* ---------- wiring ---------- */
$('#hitBtn').onclick = onHit;
$('#planBtn').onclick = function(){ if (plan) endPlan(); else startPlan(); };
$('#planClose').onclick = function(){ endPlan(); };
$('#pwMinus').onclick = function(){ nudgeWidth(-5); };
$('#pwPlus').onclick = function(){ nudgeWidth(5); };
$('#planEdit').onclick = function(){ if (plan) openPatternEdit(plan.club); };
$('#greenBtn').onclick = onGreen;
$('#menuBtn').onclick = openMenu;
$('#prevHole').onclick = function(){ var r = active(); if (r && r.cur > 0){ r.cur--; save(); renderHole(true); } };
$('#nextHole').onclick = function(){
  var r = active(); if (!r) return;
  var h = curHole();
  if (r.cur < r.holes.length - 1) r.cur++;
  else if (h.shots.length) { r.holes.push({n:nextN(h.n), shots:[], green:null}); r.cur = r.holes.length - 1; }
  else { toast('Log a shot on this hole first.'); return; }
  save(); renderHole(true);
};
$('#holeLabel').onclick = function(){
  var h = curHole(); if (!h) return;
  var v = prompt('Hole number', h.n); if (v === null) return;
  var n = parseInt(v, 10); if (n >= 1 && n <= 36){ h.n = n; save(); renderHole(false); } else toast('Enter a hole number from 1 to 36.');
};
$('#centerBtn').onclick = function(){ follow = true; if (fix) map.setView([fix.lat, fix.lng], Math.max(map.getZoom(), 17)); else toast('Waiting for GPS'); };
$('#layerBtn').onclick = function(){
  var st = S.settings, order = [];
  if (st.mapboxToken) order.push('mapbox');
  if (st.arcgisKey) order.push('sat');
  order.push('osm', 'usgs');
  var i = order.indexOf(st.basemap);
  st.basemap = order[(i + 1) % order.length];
  save(); setBase();
  toast({mapbox:'Mapbox satellite (offline in saved areas, 30 days)', usgs:'USGS satellite (offline in saved areas)', osm:'OpenStreetMap (online only, saved USGS underneath)', sat:'Esri satellite (online only, OSM and USGS underneath)'}[st.basemap]);
};

/* ---------- boot ---------- */
function startApp(){
  booted = true;
  setBase(); layout(); renderHole(true);
  startGPS(); registerSW(); purgeExpired(); keepAwake();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(function(){});
}
window.__S = function(){ return S; }; window.__save = function(){ save(); };
window.__store = store;
window.__ready = store.open().then(function(mode){
  if (mode !== 'idb') return store.get('state');
  return store.get('state').then(function(st){ return st || migrateFromLocal(); });
}).then(function(st){ S = normalize(st); }).catch(function(){ S = defaults(); })
  .then(function(){ startApp(); return store.mode(); });
})();
</script>
